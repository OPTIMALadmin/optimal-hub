    return {minX,maxX,minY,maxY};
  }

  // Finds a font height (and, if it helps, a text direction other than the ply's own
  // placement angle) that comfortably fits the ply's name inside its outline. Rather
  // than checking a single line through the centroid — which can look fine there but
  // still overflow a tapered shape a little further along — this samples a band the
  // full height of the candidate font size and shrinks to fit if any sample in that
  // band is narrower than assumed. It also tries the text at 0°/45°/90°/135° relative
  // to the ply itself and keeps whichever direction allows the largest safe size,
  // since a ply that's narrow along its own placement angle is often much roomier on
  // the diagonal.
  const PLY_LABEL_HEIGHT_MM = 8;

  // Finds the best of 0°/45°/90°/135° (relative to the ply itself) to write the
  // ply's name in at a fixed height, and how many characters of the name actually
  // fit at that height — truncating rather than shrinking the font, since a very
  // small font is often harder to read on the shop floor than a shorter label.
  // Also returns an explicit baseline-left insertion point rather than relying on
  // DXF TEXT justification codes (72/73 + a secondary alignment point), since not
  // every reader honours those — some render straight from the raw insertion point
  // regardless, which pushes centred text off to one side and past the ply edge.
  function pointInPolygon(pt, pts){
    const x = pt.x, y = pt.y;
    let inside = false;
    const n = pts.length;
    for (let i=0, j=n-1; i<n; j=i++){
      const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
      if (((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
    }
    return inside;
  }

  // Checks whether a text box (given as baseline-left origin, direction and
  // perpendicular unit vectors, width and height, all in the polygon's own frame)
  // actually sits inside the polygon — sampling along the box's edges and a small
  // interior grid, not just relying on a horizontal-span estimate. A span estimate
  // alone overestimates available room for a concave shape (it only sees the
  // overall min/max crossing, not an inward notch in between), which is exactly
  // what let text spill past a ply with a non-convex outline.
  function textBoxFitsPolygon(pts, origin, dir, perp, width, height){
    const stepsX = 6, stepsY = 3;
    for (let iy=0; iy<=stepsY; iy++){
      const fy = (iy/stepsY) * height;
      for (let ix=0; ix<=stepsX; ix++){
        const fx = (ix/stepsX) * width;
        const p = { x: origin.x + dir.x*fx + perp.x*fy, y: origin.y + dir.y*fx + perp.y*fy };
        if (!pointInPolygon(p, pts)) return false;
      }
    }
    return true;
  }

  // Scans a grid of candidate positions to find where a band the full height of the
  // label genuinely has the most room, anywhere in the polygon — not just centred on
  // its centroid. This matters for concave, multi-lobed shapes (e.g. a claw-like ply
  // with several prongs) where the centroid can sit in a notch that's only open at
  // some Y-levels within the label's height and closed at others, so no text centred
  // there can ever fit no matter how small it gets, even though plenty of room exists
  // a short distance away. Returns the widest valid run found: { x (midpoint), y,
  // width }, or null if nothing fits even at zero width.
  function findRoomiestBand(pts, height){
    const bb = polygonBoundsLocal(pts);
    if ((bb.maxY - bb.minY) < height) return null;
    const yStart = bb.minY + height/2;
    const yEnd = bb.maxY - height/2;
    if (yEnd < yStart) return null;

    const totalWidth = bb.maxX - bb.minX;
    if (totalWidth <= 0) return null;
    const gridCells = 120;
    const cellSize = totalWidth / gridCells;
    const numYSamples = 16;
    const subSamples = 4;

    let best = null;
    for (let iy=0; iy<=numYSamples; iy++){
      const yc = yStart + (yEnd - yStart) * (numYSamples === 0 ? 0 : iy/numYSamples);
      const subYs = [];
      for (let s=0; s<subSamples; s++) subYs.push(yc - height/2 + height*(subSamples===1?0:s/(subSamples-1)));

      let runStartCell = null;
      for (let cell=0; cell<=gridCells; cell++){
        const xc = bb.minX + cellSize*cell + cellSize/2;
        const valid = cell < gridCells && subYs.every(yy => pointInPolygon({ x: xc, y: yy }, pts));
        if (valid){
          if (runStartCell === null) runStartCell = cell;
        } else if (runStartCell !== null){
          const width = (cell - runStartCell) * cellSize;
          if (!best || width > best.width){
            best = { x: bb.minX + cellSize*(runStartCell + (cell-runStartCell)/2), y: yc, width };
          }
          runStartCell = null;
        }
      }
    }
    return best;
  }

  function bestTextFit(pts, label){
    const height = PLY_LABEL_HEIGHT_MM;
    const charWidthFactor = 0.7; // conservative width/height ratio for a standard DXF font
    const marginFactor = 0.85;

    const candidateAngles = [0, 45, 90, 135];
    let best = null;
    for (const angDeg of candidateAngles){
      const rad = angDeg * Math.PI / 180;
      const dir = { x: Math.cos(rad), y: Math.sin(rad) };
      const perp = { x: -Math.sin(rad), y: Math.cos(rad) };

      const rotated = window.NestingEngine.rotatePolygon(pts, -angDeg);
      const band = findRoomiestBand(rotated, height);
      if (!band) continue;

      let maxChars = Math.min(label.length, Math.floor((band.width * marginFactor) / (charWidthFactor * height)));
      if (maxChars < 1) continue;

      // band.x/band.y are in the rotated-by(-angDeg) frame; rotate back to the
      // polygon's own frame to get the real anchor point to build the text box from.
      const anchor = window.NestingEngine.rotatePolygon([{ x: band.x, y: band.y }], angDeg)[0];

      // Verify the actual text box against the actual polygon (not just the grid
      // estimate used to find this spot), shrinking one character at a time until
      // it genuinely fits everywhere it's sampled.
      let verifiedChars = 0;
      for (let c = maxChars; c >= 1; c--){
        const w = c * charWidthFactor * height;
        const origin = {
          x: anchor.x - dir.x*(w/2) - perp.x*(height/2),
          y: anchor.y - dir.y*(w/2) - perp.y*(height/2)
        };
        if (textBoxFitsPolygon(pts, origin, dir, perp, w, height)){ verifiedChars = c; break; }
      }
      if (verifiedChars > 0 && (!best || verifiedChars > best.chars)){
        best = { angle: angDeg, chars: verifiedChars, dir, perp, anchor };
      }
    }
    if (!best) return null; // no direction has room for even a single character at this height

    const truncated = label.length <= best.chars ? label : label.slice(0, best.chars);
    const textWidth = truncated.length * charWidthFactor * height;
    const insert = {
      x: best.anchor.x - best.dir.x*(textWidth/2) - best.perp.x*(height/2),
      y: best.anchor.y - best.dir.y*(textWidth/2) - best.perp.y*(height/2)
    };
    return { angleOffset: best.angle, height, label: truncated, insert };
  }

  function dxfEscapeText(s){
    // DXF text strings don't support literal newlines; keep it to one line.
    return String(s).replace(/[\r\n]+/g, ' ');
  }

  function buildNestingDxf(result){
    const lines = [];
    function add(code, val){ lines.push(String(code)); lines.push(String(val)); }

    add(0,'SECTION'); add(2,'HEADER');
    add(9,'$ACADVER'); add(1,'AC1009');
    add(9,'$INSUNITS'); add(70,4); // 4 = millimetres
    add(0,'ENDSEC');

    add(0,'SECTION'); add(2,'TABLES');
    add(0,'TABLE'); add(2,'LAYER'); add(70,2);
    add(0,'LAYER'); add(2,'PLIES'); add(70,0); add(62,7); add(6,'CONTINUOUS');
    add(0,'LAYER'); add(2,'PLIES_CUTS'); add(70,0); add(62,8); add(6,'CONTINUOUS');
    add(0,'LAYER'); add(2,'PLY_LABELS'); add(70,0); add(62,1); add(6,'CONTINUOUS');
    add(0,'ENDTAB');
    add(0,'ENDSEC');

    add(0,'SECTION'); add(2,'ENTITIES');

    // The nesting engine's own coordinate frame runs length along Y and width along
    // X (matching how the strip-packing math is written), but the on-screen preview
    // displays length horizontally and width vertically — so the export is put
    // through the same swap here, otherwise it comes out rotated 90° from what's
    // shown on screen. This is a pure rotation (verified: it preserves polygon
    // winding, so nothing ends up mirrored) — (x,y) -> (y, materialWidth - x).
    function toDxf(p){ return { x: p.y, y: result.materialWidth - p.x }; }

    result.placements.forEach(pl => {
      const rotated = window.NestingEngine.rotatePolygon(window.NestingEngine.ensureCCW(pl.outline), pl.angle);
      const tx = pl.xCells*pl.res - pl.originX;
      const ty = pl.yCells*pl.res - pl.originY;
      const shifted = rotated.map(p => ({ x: p.x+tx, y: p.y+ty }));
      const dxfOutline = shifted.map(toDxf);

      // ply outline, on its own layer — written as a classic POLYLINE/VERTEX/SEQEND
      // group (rather than LWPOLYLINE) since that's the entity type valid for the
      // R12 (AC1009) format declared above, and is understood by the widest range
      // of CAD/CAM and nesting software.
      add(0,'POLYLINE'); add(8,'PLIES'); add(66,1); add(70,1);
      dxfOutline.forEach(p => {
        add(0,'VERTEX'); add(8,'PLIES'); add(10, p.x.toFixed(4)); add(20, p.y.toFixed(4));
      });
      add(0,'SEQEND'); add(8,'PLIES');

      // real closed cuts/holes inside the ply (text is discarded at import time and
      // never reaches here) — same rigid transform, on their own layer
      (pl.holeLoops || []).forEach(loop => {
        const rotatedHole = window.NestingEngine.rotatePolygon(loop, pl.angle);
        const shiftedHole = rotatedHole.map(p => ({ x: p.x+tx, y: p.y+ty })).map(toDxf);
        add(0,'POLYLINE'); add(8,'PLIES_CUTS'); add(66,1); add(70,1);
        shiftedHole.forEach(p => {
          add(0,'VERTEX'); add(8,'PLIES_CUTS'); add(10, p.x.toFixed(4)); add(20, p.y.toFixed(4));
        });
        add(0,'SEQEND'); add(8,'PLIES_CUTS');
      });

      // ply name, on its own layer, at a fixed height with an explicitly-computed
      // insertion point (baseline-left — the one TEXT behaviour every DXF reader
      // supports, so the label can't end up rendered from the wrong point). If the
      // full name doesn't fit at the fixed height in any of the tried directions,
      // it's truncated to whatever does fit rather than overflowing the ply.
      const label = dxfEscapeText(pl.label || '');
      const fit = bestTextFit(shifted, label);
      if (fit){
        const dxfInsert = toDxf(fit.insert);
        const dxfRotation = ((fit.angleOffset - 90) % 360 + 360) % 360;

        add(0,'TEXT'); add(8,'PLY_LABELS');
        add(10, dxfInsert.x.toFixed(4)); add(20, dxfInsert.y.toFixed(4)); add(30, 0);
        add(40, fit.height.toFixed(3));
        add(1, fit.label);
        add(50, dxfRotation.toFixed(2));
      }
    });

    add(0,'ENDSEC');
    add(0,'EOF');
    return lines.join('\r\n');
  }

  function downloadDxf(result){
    const dxfText = buildNestingDxf(result);
    const blob = new Blob([dxfText], { type: 'application/dxf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'nesting-layout.dxf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------------- ADMIN VIEW ----------------
  function renderAdminView(){
    const root = document.getElementById('viewAdmin');
    if (!root) return;
    let rows = '';
    if (jobHistory.length === 0){
      rows = '<tr><td colspan="6" style="color:var(--text-faint);">No nesting jobs run yet this session.</td></tr>';
    } else {
      jobHistory.forEach(j => {
        rows += `<tr>
          <td>${j.time.toLocaleString()}</td>
          <td>${j.plyCount}</td>
          <td>${j.totalParts}</td>
          <td>${fmt(j.materialWidth,0)} mm</td>
          <td>${fmt(j.usedLength,1)} mm</td>
          <td>${j.unplaced ? j.unplaced + ' unplaced' : 'all placed'}</td>
        </tr>`;
      });
    }
    root.innerHTML = `
      <div class="panel-card">
        <div class="panel-head">
          <div>
            <h2>Nesting job history</h2>
            <div class="desc">Session log of nesting jobs computed by any user (admin view only).</div>
          </div>
          <button type="button" class="btn small danger" id="clearHistoryBtn">Clear history</button>
        </div>
        <div class="panel-body">
          <table id="jobHistoryTable">
            <thead><tr><th>Time</th><th>Ply types</th><th>Total plies</th><th>Material width</th><th>Nesting length</th><th>Status</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
    const clearBtn = document.getElementById('clearHistoryBtn');
    if (clearBtn) clearBtn.addEventListener('click', () => { jobHistory = []; renderAdminView(); });
  }

})();
</script>
