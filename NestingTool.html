<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OPTIMAL Nesting — Composite Ply Nesting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --panel: #171b22;
    --panel-alt: #1c2129;
    --border: #2a2f3a;
    --border-soft: #22262f;
    --text: #e9ecf1;
    --text-dim: #8b93a3;
    --text-faint: #5c6373;
    --accent: #f2a93b;
    --accent-dim: #a97a34;
    --accent-2: #33c9b0;
    --danger: #e8598b;
    --radius: 6px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, Segoe UI, Arial, sans-serif;
    min-height:100%;
  }
  .mono{ font-family:'IBM Plex Mono', 'Courier New', monospace; }

  /* ---------- Header ---------- */
  header{
    padding: 20px 28px 16px;
    display:flex; align-items:center; justify-content:space-between;
    gap: 24px; flex-wrap: wrap;
  }
  .header-right{ display:flex; align-items:center; gap: 22px; flex: none; }
  .title-block .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight:600; margin: 0 0 6px;
  }
  .title-block h1{ margin:0; font-size: 22px; font-weight:600; letter-spacing:-0.01em; }
  .title-block .sub{ margin: 4px 0 0; font-size: 13px; color: var(--text-dim); }

  .main-tabs{ display:flex; gap:8px; }
  .main-tab{
    background: var(--panel-alt); border: 1px solid var(--border);
    color: var(--text-dim); padding: 9px 18px; border-radius: var(--radius);
    font-size: 13px; font-weight:500; cursor:pointer; font-family:inherit;
  }
  .main-tab.active{ color: var(--text); border-color: var(--accent-dim); background:#22272f; }

  .btn{
    background: var(--panel-alt); border: 1px solid var(--border);
    color: var(--text); padding: 9px 16px; border-radius: var(--radius);
    font-size: 13px; font-weight:500; cursor:pointer; font-family:inherit;
    transition: border-color .15s, background .15s;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn:hover{ border-color: var(--accent-dim); background:#22272f; }
  .btn.primary{ background: var(--accent); border-color: var(--accent); color:#1a1406; font-weight:600; }
  .btn.primary:hover{ background:#ffb84f; }
  .btn.primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn.danger{ color: var(--danger); }
  .btn svg{ width:14px; height:14px; flex:none; }
  .btn.small{ padding:6px 10px; font-size:12px; }
  input[type=file]{ display:none; }

  label.field-label{
    font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint);
    display:block; margin-bottom:4px;
  }
  input[type=text], input[type=number], select{
    background: var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding: 8px 10px; border-radius: var(--radius); font-size:13px; font-family:'IBM Plex Mono', monospace;
    width: 100%;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus{ outline:none; border-color:var(--accent-dim); }

  /* ---------- Login gate ---------- */
  #loginGate{
    position:fixed; inset:0; background: var(--bg); z-index: 500;
    display:flex; align-items:center; justify-content:center;
  }
  #loginGate.hidden{ display:none; }
  .login-card{
    width: 360px; background: var(--panel); border:1px solid var(--border);
    border-radius: 12px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .login-logo-wrap{ text-align:center; margin-bottom: 20px; }
  .login-logo-wrap img{ width:180px; height:auto; margin:0 auto 14px; display:block; }
  .login-logo-wrap h1{ font-size:16px; font-weight:600; margin:0; color: var(--text); }
  .login-logo-wrap .tag{ font-size:12px; color: var(--text-dim); margin-top:4px; }
  .login-field{ margin-bottom: 16px; }
  .login-field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color: var(--text-faint); margin-bottom:6px;
  }
  .login-field input{
    width:100%; background: var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding: 10px 12px; border-radius: var(--radius); font-size:14px; font-family:inherit;
  }
  .login-field input:focus{ border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(51,201,176,0.15); outline:none; }
  .login-error{ display:none; color:#f4a7c1; font-size:12px; margin: -6px 0 14px; }
  .login-error.visible{ display:block; }
  .login-submit{
    width:100%; padding: 11px; border:none; border-radius: var(--radius);
    background: var(--accent-2); color:#06231d; font-weight:600; font-size:14px; cursor:pointer;
  }
  .login-submit:hover{ background:#3fe0c4; }

  #appRoot{ display:none; }
  #appRoot.visible{ display:block; }

  /* ---------- Toolbar / config ---------- */
  .panel-card{
    margin: 0 28px 20px; background: var(--panel); border:1px solid var(--border);
    border-radius: 10px; overflow:hidden;
  }
  .panel-card .panel-head{
    padding: 14px 20px; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background: var(--panel-alt);
  }
  .panel-card .panel-head h2{ margin:0; font-size:14px; font-weight:600; }
  .panel-card .panel-head .desc{ font-size:12px; color: var(--text-dim); margin-top:2px; }
  .panel-body{ padding: 18px 20px; }

  .settings-row{ display:flex; gap: 22px; flex-wrap:wrap; align-items:flex-end; }
  .settings-field{ min-width: 160px; }

  #emptyPlies{ padding: 40px 20px; text-align:center; color: var(--text-faint); font-size:13px; }

  .ply-table{ width:100%; border-collapse:collapse; }
  .ply-table th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
    color: var(--text-faint); padding: 8px 10px; border-bottom:1px solid var(--border-soft);
  }
  .ply-table td{ padding: 10px; border-bottom:1px solid var(--border-soft); vertical-align:middle; font-size:13px; }
  .ply-table tr:last-child td{ border-bottom:none; }
  .ply-swatch{ width:14px; height:14px; border-radius:4px; display:inline-block; flex:none; }
  .ply-name-cell{ display:flex; align-items:center; gap:10px; }
  .ply-mini{ width:44px; height:34px; background:var(--panel-alt); border:1px solid var(--border); border-radius:4px; flex:none; }
  .ply-meta{ font-size:11px; color: var(--text-faint); }
  .angle-chips{ display:flex; flex-wrap:wrap; gap:5px; max-width: 320px; }
  .angle-chip{
    font-size:11px; font-family:'IBM Plex Mono', monospace; color: var(--text-dim);
    background: var(--panel-alt); border:1px solid var(--border); border-radius: 14px;
    padding: 4px 9px; cursor:pointer; user-select:none;
  }
  .angle-chip.checked{ color:#1a1406; background: var(--accent); border-color: var(--accent); font-weight:600; }
  .qty-input{ width: 70px; }

  /* ---------- Results ---------- */
  .stat-row{ display:flex; gap: 28px; flex-wrap:wrap; }
  .stat-box{ min-width: 130px; }
  .stat-box .num{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color: var(--text); }
  .stat-box .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-top:4px; }
  .stat-box .num.accent{ color: var(--accent); }
  .stat-box .num.good{ color: var(--accent-2); }
  .stat-box .num.warn{ color: var(--danger); }

  #warnBox{
    display:none; margin: 14px 20px 0; padding: 10px 14px; background: rgba(232,89,139,0.08);
    border: 1px solid rgba(232,89,139,0.35); border-radius: var(--radius); color:#f4a7c1; font-size:12.5px;
  }

  #canvasWrap{
    margin: 16px 20px 4px; border:1px solid var(--border); border-radius: 8px;
    background: #0d0f13; overflow:auto; max-height: 560px; position:relative;
  }
  #canvasWrap svg{ display:block; }
  .zoom-row{ display:flex; align-items:center; gap:10px; margin: 4px 20px 16px; }
  .zoom-row input[type=range]{ width:180px; }
  .zoom-row .zlabel{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono', monospace; }

  #jobHistoryTable{ width:100%; border-collapse:collapse; }
  #jobHistoryTable th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
    color: var(--text-faint); padding: 8px 10px; border-bottom:1px solid var(--border-soft);
  }
  #jobHistoryTable td{ padding: 9px 10px; border-bottom:1px solid var(--border-soft); font-size:12.5px; font-family:'IBM Plex Mono', monospace; }

  .spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.25);
    border-top-color: #1a1406; animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .tooltip-part{
    position:fixed; display:none; background:#1c2129; border:1px solid var(--border);
    border-radius:6px; padding:8px 10px; font-size:12px; pointer-events:none; z-index:400;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
</style>
</head>

<script>
/* ======================================================================
   DXF PARSER — minimal ASCII DXF reader.
   Extracts LINE, LWPOLYLINE, POLYLINE/VERTEX, ARC, CIRCLE, ELLIPSE
   entities from the ENTITIES section and reduces them to closed loops.
   ====================================================================== */
(function(){
  function parseTagPairs(text){
    const rawLines = text.split(/\r\n|\r|\n/);
    const pairs = [];
    for (let i = 0; i + 1 < rawLines.length; i += 2){
      const code = parseInt(rawLines[i].trim(), 10);
      const value = rawLines[i+1] !== undefined ? rawLines[i+1].trim() : '';
      pairs.push([code, value]);
    }
    return pairs;
  }

  function extractEntitiesSection(pairs){
    let i = 0;
    const out = [];
    while (i < pairs.length){
      if (pairs[i][0] === 0 && pairs[i][1] === 'SECTION'){
        let j = i + 1;
        if (j < pairs.length && pairs[j][0] === 2 && pairs[j][1] === 'ENTITIES'){
          j++;
          while (j < pairs.length && !(pairs[j][0] === 0 && pairs[j][1] === 'ENDSEC')){
            out.push(pairs[j]); j++;
          }
          i = j; continue;
        }
      }
      i++;
    }
    return out;
  }

  function splitEntities(entitiesPairs){
    const entities = [];
    let current = null;
    for (const [code, value] of entitiesPairs){
      if (code === 0){
        if (current) entities.push(current);
        current = { type: value, tags: [] };
      } else if (current){
        current.tags.push([code, value]);
      }
    }
    if (current) entities.push(current);
    return entities;
  }

  function getTag(tags, code){ for (const t of tags) if (t[0] === code) return t[1]; return undefined; }
  function getAllTags(tags, code){ return tags.filter(t => t[0] === code).map(t => t[1]); }
  function num(v, def){ const n = parseFloat(v); return isNaN(n) ? (def === undefined ? 0 : def) : n; }

  function arcToSegments(cx, cy, r, a0deg, a1deg, maxSegAngleDeg){
    maxSegAngleDeg = maxSegAngleDeg || 6;
    let a0 = a0deg, a1 = a1deg;
    while (a1 < a0) a1 += 360;
    const sweep = a1 - a0;
    const segCount = Math.max(1, Math.ceil(sweep / maxSegAngleDeg));
    const pts = [];
    for (let k = 0; k <= segCount; k++){
      const a = (a0 + (sweep * k) / segCount) * Math.PI / 180;
      pts.push({ x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) });
    }
    return pts;
  }

  function entityToSegments(entity){
    const segs = [];
    const t = entity.tags;
    switch(entity.type){
      case 'LINE': {
        segs.push({ x1: num(getTag(t,10)), y1: num(getTag(t,20)), x2: num(getTag(t,11)), y2: num(getTag(t,21)) });
        break;
      }
      case 'LWPOLYLINE': {
        const xs = getAllTags(t,10).map(v=>num(v));
        const ys = getAllTags(t,20).map(v=>num(v));
        const closed = (num(getTag(t,70),0) & 1) === 1;
        const pts = xs.map((x,idx)=>({x, y: ys[idx]}));
        for (let k=0;k<pts.length-1;k++) segs.push({x1:pts[k].x,y1:pts[k].y,x2:pts[k+1].x,y2:pts[k+1].y});
        if (closed && pts.length>1) segs.push({x1:pts[pts.length-1].x,y1:pts[pts.length-1].y,x2:pts[0].x,y2:pts[0].y});
        break;
      }
      case 'ARC': {
        const cx=num(getTag(t,10)), cy=num(getTag(t,20)), r=num(getTag(t,40));
        const pts = arcToSegments(cx,cy,r, num(getTag(t,50)), num(getTag(t,51)));
        for (let k=0;k<pts.length-1;k++) segs.push({x1:pts[k].x,y1:pts[k].y,x2:pts[k+1].x,y2:pts[k+1].y});
        break;
      }
      case 'CIRCLE': {
        const cx=num(getTag(t,10)), cy=num(getTag(t,20)), r=num(getTag(t,40));
        const pts = arcToSegments(cx,cy,r,0,360);
        for (let k=0;k<pts.length-1;k++) segs.push({x1:pts[k].x,y1:pts[k].y,x2:pts[k+1].x,y2:pts[k+1].y});
        break;
      }
      case 'ELLIPSE': {
        const cx=num(getTag(t,10)), cy=num(getTag(t,20));
        const majX=num(getTag(t,11)), majY=num(getTag(t,21));
        const ratio=num(getTag(t,40),1);
        const a0=num(getTag(t,41),0), a1=num(getTag(t,42), 2*Math.PI);
        const majR=Math.sqrt(majX*majX+majY*majY);
        const rot=Math.atan2(majY,majX);
        const minR=majR*ratio;
        const steps=Math.max(8, Math.ceil(((a1-a0)*180/Math.PI)/6));
        const pts=[];
        for (let k=0;k<=steps;k++){
          const a=a0+(a1-a0)*(k/steps);
          const ex=majR*Math.cos(a), ey=minR*Math.sin(a);
          pts.push({ x: cx+ex*Math.cos(rot)-ey*Math.sin(rot), y: cy+ex*Math.sin(rot)+ey*Math.cos(rot) });
        }
        for (let k=0;k<pts.length-1;k++) segs.push({x1:pts[k].x,y1:pts[k].y,x2:pts[k+1].x,y2:pts[k+1].y});
        break;
      }
      case 'TEXT': case 'MTEXT': case 'ATTRIB': case 'ATTDEF': {
        // Ply labels/markings drawn as DXF text are never part of the cuttable
        // outline — deliberately ignored so they can't be mistaken for geometry.
        // (Real closed cuts/holes made of LINE/ARC/LWPOLYLINE etc. are unaffected
        // and continue to be picked up as inner loops below.)
        break;
      }
      default: break;
    }
    return segs;
  }

  function parsePolylineGroup(entities, startIdx){
    const t = entities[startIdx].tags;
    const closed = (num(getTag(t,70),0) & 1) === 1;
    const pts = [];
    let i = startIdx + 1;
    while (i < entities.length && entities[i].type === 'VERTEX'){
      const vt = entities[i].tags;
      pts.push({ x: num(getTag(vt,10)), y: num(getTag(vt,20)) });
      i++;
    }
    if (i < entities.length && entities[i].type === 'SEQEND') i++;
    const segs = [];
    for (let k=0;k<pts.length-1;k++) segs.push({x1:pts[k].x,y1:pts[k].y,x2:pts[k+1].x,y2:pts[k+1].y});
    if (closed && pts.length>1) segs.push({x1:pts[pts.length-1].x,y1:pts[pts.length-1].y,x2:pts[0].x,y2:pts[0].y});
    return { segs, nextIdx: i };
  }

  function allSegmentsFromDxf(text){
    const pairs = parseTagPairs(text);
    const entPairs = extractEntitiesSection(pairs);
    const entities = splitEntities(entPairs);
    const allSegs = [];
    let i = 0;
    while (i < entities.length){
      const e = entities[i];
      if (e.type === 'POLYLINE'){
        const { segs, nextIdx } = parsePolylineGroup(entities, i);
        allSegs.push(...segs);
        i = nextIdx;
        continue;
      }
      allSegs.push(...entityToSegments(e));
      i++;
    }
    return allSegs;
  }

  function buildLoops(segments, precision){
    precision = precision || 0.05;
    // Node lookup uses a spatial grid for speed, but — critically — a point close to
    // a grid-cell boundary can round to a different cell than another point that's
    // only a thousandth of a millimetre away (e.g. 408.474262 -> cell 40847 while
    // 408.475159 -> cell 40848, despite being ~0.0013mm apart). Two entities meant to
    // share an endpoint can therefore land in adjacent cells. To handle that, matching
    // checks the cell a point rounds to *and* its 8 neighbours, and only accepts a
    // match that's genuinely within tolerance (real Euclidean distance), rather than
    // trusting the rounded key alone.
    const tolerance = precision;
    const nodeMap = new Map(); // cellKey -> array of nodes whose rounded cell is this key
    const allNodes = [];
    function cellOf(v){ return Math.round(v/precision); }
    function getNode(x,y){
      const cx = cellOf(x), cy = cellOf(y);
      for (let dx=-1; dx<=1; dx++){
        for (let dy=-1; dy<=1; dy++){
          const k = (cx+dx) + '_' + (cy+dy);
          const bucket = nodeMap.get(k);
          if (!bucket) continue;
          for (const node of bucket){
            if (Math.hypot(node.x-x, node.y-y) <= tolerance) return node;
          }
        }
      }
      const node = { x, y, edges: [] };
      const k = cx + '_' + cy;
      if (!nodeMap.has(k)) nodeMap.set(k, []);
      nodeMap.get(k).push(node);
      allNodes.push(node);
      return node;
    }
    const edges = [];
    segments.forEach(s => {
      // A segment shorter than the merge tolerance will always collapse into a
      // self-loop once its endpoints snap together (both ends land on the same
      // node) — which then breaks traversal for the *entire* chain it's part of,
      // not just this one segment. Very large-radius arcs sampled at a fixed
      // angular step can produce these, so they're dropped up front.
      if (Math.hypot(s.x1-s.x2, s.y1-s.y2) < tolerance) return;
      const a = getNode(s.x1,s.y1), b = getNode(s.x2,s.y2);
      const edge = { a, b };
      edges.push(edge); a.edges.push(edge); b.edges.push(edge);
    });

    // Some DXF exports contain a line/arc traced twice over the same geometry —
    // harmless visually, but it turns what should be a simple two-edge node into a
    // four-edge junction, which can send the boundary-walk below down the wrong
    // branch. Any exact duplicate connection between the same pair of nodes is
    // collapsed down to one edge before walking the outline.
    {
      const seen = new Map();
      let dedupedEdges = [];
      for (const e of edges){
        const ia = allNodes.indexOf(e.a), ib = allNodes.indexOf(e.b);
        const k = ia < ib ? ia+'_'+ib : ib+'_'+ia;
        if (seen.has(k)) continue;
        seen.set(k, true);
        dedupedEdges.push(e);
      }
      if (dedupedEdges.length !== edges.length){
        allNodes.forEach(n => { n.edges = []; });
        edges.length = 0;
        dedupedEdges.forEach(e => { edges.push(e); e.a.edges.push(e); e.b.edges.push(e); });
      }
    }

    // A ply outline that's otherwise complete can still have one small real gap —
    // e.g. two entities that were meant to meet but were drawn a fraction of a
    // millimetre apart, beyond what's safe to treat as pure floating-point noise.
    // Rather than silently dropping the whole outline, any nodes left with only one
    // connection (a true dead end) are paired up with their nearest such neighbour
    // and closed with a synthetic edge, as long as the gap is still small relative
    // to typical DXF export tolerances.
    const AUTO_CLOSE_MAX_GAP = 3; // mm
    {
      let openEnds = allNodes.filter(n => n.edges.length === 1);
      while (openEnds.length >= 2){
        let bestI = -1, bestJ = -1, bestD = Infinity;
        for (let i=0;i<openEnds.length;i++){
          for (let j=i+1;j<openEnds.length;j++){
            const d = Math.hypot(openEnds[i].x-openEnds[j].x, openEnds[i].y-openEnds[j].y);
            if (d < bestD){ bestD = d; bestI = i; bestJ = j; }
          }
        }
        if (bestD > AUTO_CLOSE_MAX_GAP) break;
        const a = openEnds[bestI], b = openEnds[bestJ];
        const edge = { a, b };
        edges.push(edge); a.edges.push(edge); b.edges.push(edge);
        openEnds = openEnds.filter(n => n !== a && n !== b);
      }
    }

    allNodes.forEach((node, i) => { node.key = 'n' + i; });
    const loops = [];
    const visited = new Set();
    for (const startEdge of edges){
      if (visited.has(startEdge)) continue;
      const loopPts = [];
      let prevNode = startEdge.a, curNode = startEdge.b, curEdge = startEdge;
      visited.add(curEdge);
      loopPts.push({ x: prevNode.x, y: prevNode.y });
      let guard = 0; const maxGuard = segments.length*2+10;
      while (curNode.key !== startEdge.a.key && guard < maxGuard){
        loopPts.push({ x: curNode.x, y: curNode.y });
        let nextEdge = null;
        for (const e of curNode.edges){ if (!visited.has(e)){ nextEdge = e; break; } }
        if (!nextEdge) break;
        visited.add(nextEdge);
        const nextNode = (nextEdge.a.key === curNode.key) ? nextEdge.b : nextEdge.a;
        prevNode = curNode; curNode = nextNode; curEdge = nextEdge;
        guard++;
      }
      if (curNode.key === startEdge.a.key) loops.push(loopPts);
    }
    return loops;
  }

  function polygonArea(pts){
    let a = 0;
    for (let i=0;i<pts.length;i++){ const p1=pts[i], p2=pts[(i+1)%pts.length]; a += p1.x*p2.y - p2.x*p1.y; }
    return a/2;
  }

  function loopBBox(loop){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for (const p of loop){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
    return {minX,maxX,minY,maxY};
  }
  function bboxOverlapWithMargin(a,b,margin){
    return !(a.maxX+margin < b.minX || b.maxX+margin < a.minX || a.maxY+margin < b.minY || b.maxY+margin < a.minY);
  }

  // DXF ply files sometimes have their label ("PLY-042", a part number, etc.) drawn
  // as real cut geometry rather than a TEXT entity — often because the text was
  // "exploded" into its constituent strokes at some point in the CAD/export chain.
  // That's geometrically indistinguishable from a real hole using entity type alone,
  // so instead this looks at the *pattern*: a genuine cutout is normally an isolated
  // feature, while text renders as a tight cluster of several small closed loops
  // (each character, and each enclosed counter like the hole in "0" or "8") sitting
  // right next to each other. Loops are discarded only when they're both small
  // relative to the ply and part of such a cluster — a lone small hole, or a row of
  // holes spaced further apart than typical character spacing, is left alone.
  function discardTextLikeLoops(loops, outerLoop, outerArea){
    const areaFrac = 0.02;   // a loop must be under 2% of the ply's own area to qualify
    const maxClusterMargin = 50; // mm cap on how far apart loops can be and still cluster

    const candidates = loops.filter(l => l !== outerLoop);
    if (candidates.length === 0) return loops;
    const info = candidates.map(l => ({ loop: l, bbox: loopBBox(l), area: Math.abs(polygonArea(l)) }));

    // Build proximity adjacency between ALL candidate loops (not just the small
    // ones) — a small loop still counts as "clustered" if its only nearby neighbour
    // happens to be a larger element, e.g. a bigger digit sitting next to smaller
    // ones in the same annotation block.
    const n = info.length;
    const hasNeighbor = new Array(n).fill(false);
    for (let i=0;i<n;i++){
      for (let j=i+1;j<n;j++){
        const a = info[i], b = info[j];
        const margin = Math.min(
          Math.max(a.bbox.maxX-a.bbox.minX, a.bbox.maxY-a.bbox.minY, b.bbox.maxX-b.bbox.minX, b.bbox.maxY-b.bbox.minY) * 1.5,
          maxClusterMargin
        );
        if (bboxOverlapWithMargin(a.bbox, b.bbox, margin)){ hasNeighbor[i] = true; hasNeighbor[j] = true; }
      }
    }

    // A loop is discarded only if it is itself small AND sits next to at least one
    // other loop — an isolated small loop (no neighbours at all, at any size) is
    // left alone, since that's the profile of a genuine standalone cutout rather
    // than a character in a text label.
    const discard = new Set();
    for (let i=0;i<n;i++){
      if (info[i].area < areaFrac * outerArea && hasNeighbor[i]){
        discard.add(info[i].loop);
      }
    }
    return loops.filter(l => !discard.has(l));
  }

  function parseDxfToShape(text){
    const segs = allSegmentsFromDxf(text);
    let loops = buildLoops(segs);
    if (loops.length === 0) return null;
    let outerIdx = 0, maxArea = -Infinity;
    loops.forEach((l, idx) => { const a = Math.abs(polygonArea(l)); if (a > maxArea){ maxArea = a; outerIdx = idx; } });
    const outer = loops[outerIdx];
    loops = discardTextLikeLoops(loops, outer, maxArea);
    return { outer, loops, area: maxArea };
  }

  window.DxfParser = { parseDxfToShape, polygonArea };
})();
</script>

<script>
/* ======================================================================
   NESTING ENGINE — interval-based irregular strip packing.
   Each column tracks a sorted list of occupied length-intervals (not just a
   single running height), so a smaller ply can be placed into a gap that's
   sandwiched between two earlier pieces in the same column - e.g. the
   triangular pockets left between two large rotated plies - which a simple
   skyline model can never see. Two placement strategies (classic largest-
   first, and a priority-aware gap-filler) are run and whichever produces
   the shorter nesting length is kept, so gap-filling can only ever help.
   ====================================================================== */
(function(){
// Interval-based irregular strip packing.
// Unlike a simple "skyline" (one height per column), each column tracks a sorted list
// of occupied [start,end] length-intervals. This lets a later, smaller ply be placed in
// a gap that's sandwiched between two earlier pieces in the same column — something a
// single running-height skyline can never represent.

function rotatePoint(x,y,deg){ const r=deg*Math.PI/180, c=Math.cos(r), s=Math.sin(r); return { x: x*c - y*s, y: x*s + y*c }; }
function rotatePolygon(pts, deg){ return pts.map(p => rotatePoint(p.x,p.y,deg)); }
function bbox(pts){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for (const p of pts){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
  return { minX, maxX, minY, maxY };
}
function polygonAreaLocal(pts){
  let a=0; for(let i=0;i<pts.length;i++){ const p1=pts[i],p2=pts[(i+1)%pts.length]; a+=p1.x*p2.y-p2.x*p1.y; } return a/2;
}
function ensureCCW(pts){ return polygonAreaLocal(pts) < 0 ? pts.slice().reverse() : pts; }

function columnExtents(pts, res, widthCells){
  const colMin = new Float64Array(widthCells).fill(Infinity);
  const colMax = new Float64Array(widthCells).fill(-Infinity);
  const n = pts.length;
  for (let c=0;c<widthCells;c++){
    const xq = (c+0.5)*res;
    let lo=Infinity, hi=-Infinity;
    for (let i=0;i<n;i++){
      const p1=pts[i], p2=pts[(i+1)%n];
      const x1=p1.x,y1=p1.y,x2=p2.x,y2=p2.y;
      if ((x1<=xq && x2>xq) || (x2<=xq && x1>xq)){
        const t=(xq-x1)/(x2-x1); const y=y1+t*(y2-y1);
        if (y<lo) lo=y; if (y>hi) hi=y;
      }
    }
    if (hi>=lo){ colMin[c]=lo; colMax[c]=hi; }
  }
  return { colMin, colMax };
}

function inflatePolygon(pts, d){
  const n = pts.length;
  const out = [];
  for (let i=0;i<n;i++){
    const prev = pts[(i-1+n)%n], cur = pts[i], next = pts[(i+1)%n];
    const e1x=cur.x-prev.x, e1y=cur.y-prev.y;
    const e2x=next.x-cur.x, e2y=next.y-cur.y;
    const len1=Math.hypot(e1x,e1y)||1, len2=Math.hypot(e2x,e2y)||1;
    const n1x=e1y/len1, n1y=-e1x/len1;
    const n2x=e2y/len2, n2y=-e2x/len2;
    let nx=n1x+n2x, ny=n1y+n2y;
    const nlen=Math.hypot(nx,ny)||1; nx/=nlen; ny/=nlen;
    out.push({ x: cur.x + nx*d, y: cur.y + ny*d });
  }
  return out;
}

function buildVariant(outline, angleDeg, res, gap, materialWidthCells){
  let pts = ensureCCW(outline);
  // +90: a ply's own left-to-right axis, as drawn, should align with the material's
  // length axis (also left-to-right, the roll's feed direction) at "0°" — not its
  // width axis, which is what a plain, un-adjusted rotation would give.
  pts = rotatePolygon(pts, angleDeg + 90);
  if (gap > 0) pts = inflatePolygon(pts, gap/2);
  const bb = bbox(pts);
  const w = bb.maxX - bb.minX;
  const shifted = pts.map(p => ({ x: p.x - bb.minX, y: p.y - bb.minY }));
  const widthCells = Math.max(1, Math.ceil(w / res));
  if (widthCells > materialWidthCells) return null;
  const { colMin, colMax } = columnExtents(shifted, res, widthCells);
  const colMinCells = new Float64Array(widthCells);
  const colMaxCells = new Float64Array(widthCells);
  let anyFilled = false;
  for (let c=0;c<widthCells;c++){
    if (colMax[c] >= colMin[c]){ colMinCells[c]=colMin[c]/res; colMaxCells[c]=colMax[c]/res; anyFilled=true; }
    else colMinCells[c] = NaN;
  }
  if (!anyFilled) return null;
  return { angle: angleDeg + 90, userAngle: angleDeg, colMinCells, colMaxCells, widthCells, originX: bb.minX, originY: bb.minY };
}

// ---- per-column interval occupancy ----
// occupied[col] is a sorted, non-overlapping array of [start,end] (in cell units).
function insertInterval(occupied, col, start, end){
  const list = occupied[col];
  let i = 0;
  while (i < list.length && list[i][1] < start) i++;
  let mergedStart = start, mergedEnd = end;
  let j = i;
  while (j < list.length && list[j][0] <= end){
    if (list[j][0] < mergedStart) mergedStart = list[j][0];
    if (list[j][1] > mergedEnd) mergedEnd = list[j][1];
    j++;
  }
  list.splice(i, j-i, [mergedStart, mergedEnd]);
}

function lowerBoundEnd(list, value){
  // first index i such that list[i][1] > value
  let lo = 0, hi = list.length;
  while (lo < hi){
    const mid = (lo + hi) >> 1;
    if (list[mid][1] <= value) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function feasibleAt(colIdxs, colMinCells, colMaxCells, occupied, xOffset, y0){
  for (const c of colIdxs){
    const list = occupied[xOffset + c];
    if (list.length === 0) continue;
    const lo = y0 + colMinCells[c], hi = y0 + colMaxCells[c];
    const i = lowerBoundEnd(list, lo);
    if (i < list.length && list[i][0] < hi) return false;
  }
  return true;
}

// Width, in cells, below which the more expensive "find a sandwiched gap" search is
// attempted at all. Above this, a ply is large enough that fitting into a narrow
// leftover pocket is very unlikely, so we skip straight to the cheap skyline-
// equivalent placement — this keeps big structural plies (which would otherwise
// touch the most columns) fast, while small filler plies still get the full
// gap-aware search that lets them nestle into pockets left by the big ones.
const DETAILED_SEARCH_MAX_COLS = 24;
// Once the touched columns collectively hold more intervals than this, the detailed
// search is skipped for this specific placement attempt too — this is what actually
// bounds runtime as a nesting job fills up with many plies, regardless of how small
// any individual ply is.
const DETAILED_SEARCH_MAX_INTERVALS = 600;

// Find the smallest feasible y0 (>=0) such that for every touched column c,
// [y0+colMinCells[c], y0+colMaxCells[c]] doesn't overlap any occupied interval in
// column x+c.
function findFeasibleY(colIdxs, colMinCells, colMaxCells, occupied, xOffset){
  // Always compute the cheap baseline first: placing right after the last interval
  // in whichever touched column requires it. This is O(wc) and always valid. While
  // we're at it, tally how many intervals we'd need to consider for a detailed
  // search, so we can bail out early if it's too many to check cheaply.
  let y0Fast = 0;
  let anyIntervals = false;
  let intervalCount = 0;
  const tooWide = colIdxs.length > DETAILED_SEARCH_MAX_COLS;
  for (const c of colIdxs){
    const list = occupied[xOffset + c];
    if (list.length){
      anyIntervals = true;
      if (!tooWide) intervalCount += list.length;
      const req = list[list.length-1][1] - colMinCells[c];
      if (req > y0Fast) y0Fast = req;
    }
  }
  if (!anyIntervals || tooWide || intervalCount > DETAILED_SEARCH_MAX_INTERVALS){
    return y0Fast;
  }

  // Detailed search: gather breakpoints from every interval in every touched column,
  // and try them in ascending order — the first one that clears every column's
  // intervals is the lowest feasible position, which may be a gap sandwiched between
  // two pieces placed earlier in the same column.
  const candidates = [0];
  for (const c of colIdxs){
    const list = occupied[xOffset + c];
    for (let k=0;k<list.length;k++){
      const cand = list[k][1] - colMinCells[c];
      if (cand > 0 && cand < y0Fast) candidates.push(cand);
    }
  }
  if (candidates.length === 1) return y0Fast; // no candidate below the cheap baseline
  candidates.sort((a,b) => a-b);
  for (let i=0;i<candidates.length;i++){
    const y0 = candidates[i];
    if (feasibleAt(colIdxs, colMinCells, colMaxCells, occupied, xOffset, y0)) return y0;
  }
  return y0Fast;
}

function findBestPlacement(partDef, occupied, materialWidthCells, res, deadline){
  let best = null;
  let bestGapFill = null; // candidate that fits within space already used elsewhere
  const useDetailed = !deadline || Date.now() < deadline;
  const currentMax = currentMaxEnd(occupied);
  const angleKeys = Object.keys(partDef.variants);
  for (const angleStr of angleKeys){
    const v = partDef.variants[angleStr];
    const wc = v.widthCells;
    if (wc > materialWidthCells) continue;
    const colIdxs = [];
    for (let c=0;c<wc;c++) if (!Number.isNaN(v.colMinCells[c])) colIdxs.push(c);
    if (colIdxs.length === 0) continue;
    // How many copies of this exact angle/width would tile side by side across the
    // full material width. This only matters for comparing *between* angles when
    // extending fresh territory below — within a single angle, the best x position
    // is still whichever minimises the absolute resulting top, same as before. It's
    // also capped by how many instances of this ply are actually left to place —
    // an angle that theoretically tiles 4-per-row is not "efficient" if there are
    // only 2 copies of the ply in the whole job; that assumed efficiency could never
    // be realised, and would otherwise make a wide, low-capacity angle look better
    // than it really is for a small quantity.
    const rowCapacity = Math.max(1, Math.min(Math.floor(materialWidthCells / wc), partDef.remaining || Infinity));
    const maxX = materialWidthCells - wc;
    let bestForAngle = null;
    for (let x=0; x<=maxX; x++){
      const y0 = useDetailed
        ? findFeasibleY(colIdxs, v.colMinCells, v.colMaxCells, occupied, x)
        : fastFeasibleY(colIdxs, v.colMinCells, occupied, x);
      let top = 0;
      for (const c of colIdxs){
        const t = y0 + v.colMaxCells[c];
        if (t > top) top = t;
      }
      if (!bestForAngle || top < bestForAngle.top - 1e-9 || (Math.abs(top-bestForAngle.top)<1e-9 && x < bestForAngle.x)){
        bestForAngle = { angle: v.angle, userAngle: v.userAngle, x, y: y0, top, wc, colIdxs, v };
      }
    }
    if (!bestForAngle) continue;

    // A candidate that fits entirely within length already used elsewhere is
    // nestling into a specific existing gap (possibly one only this angle's shape
    // can reach, like a triangle rotated to match a diagonal pocket). What matters
    // there is the tightest possible fit for *that* gap, not row-tiling efficiency —
    // a "more efficient" angle that doesn't actually fit the gap as well is not a
    // better choice. These are tracked separately and always win over any angle
    // that would extend the nesting length.
    if (bestForAngle.top <= currentMax + 1e-6){
      if (!bestGapFill || bestForAngle.top < bestGapFill.top - 1e-9) bestGapFill = bestForAngle;
      continue;
    }

    // Otherwise this angle would extend the frontier. Comparing raw "top" alone
    // falls into a trap here: a narrower-looking angle can look better for a single
    // piece while actually wasting a lot of width if repeated (e.g. a 100x60 rect at
    // 0° looks "shorter" than at 90°, but on a 160mm-wide material one leaves 60mm
    // idle per row, the other only 40mm). Dividing the height this placement *adds*
    // by how many fit per row gives an estimate of length-cost per instance if this
    // angle were reused, which is what actually determines the final nesting length.
    bestForAngle.cost = (bestForAngle.top - bestForAngle.y) / rowCapacity;
    if (!best || bestForAngle.cost < best.cost - 1e-9 ||
        (Math.abs(bestForAngle.cost-best.cost)<1e-9 && bestForAngle.top < best.top - 1e-9)){
      best = bestForAngle;
    }
  }
  return bestGapFill || best;
}

// Cheap O(wc) placement used once a strategy run's time budget is exhausted: skip
// the sandwiched-gap search and just clear the topmost interval in every touched
// column, same as a simple running skyline. Always valid, just not always minimal.
function fastFeasibleY(colIdxs, colMinCells, occupied, xOffset){
  let y0 = 0;
  for (const c of colIdxs){
    const list = occupied[xOffset + c];
    if (list.length){
      const req = list[list.length-1][1] - colMinCells[c];
      if (req > y0) y0 = req;
    }
  }
  return y0;
}

function commitPlacement(occupied, best){
  for (const c of best.colIdxs){
    insertInterval(occupied, best.x + c, best.y + best.v.colMinCells[c], best.y + best.v.colMaxCells[c]);
  }
}

function makeOccupied(materialWidthCells){
  const occ = new Array(materialWidthCells);
  for (let i=0;i<materialWidthCells;i++) occ[i] = [];
  return occ;
}

function currentMaxEnd(occupied){
  let m = 0;
  for (const list of occupied){
    if (list.length){ const e = list[list.length-1][1]; if (e>m) m = e; }
  }
  return m;
}

const STRATEGY_TIME_BUDGET_MS = 3000;

function runFfdStrategy(placeable, materialWidthCells, res){
  const occupied = makeOccupied(materialWidthCells);
  const placements = [];
  const unplacedPd = [];
  const instances = [];
  placeable.forEach(pd => { for (let i=0;i<pd.remaining;i++) instances.push(pd); });
  instances.sort((a,b) => b.area - a.area);
  const deadline = Date.now() + STRATEGY_TIME_BUDGET_MS;
  for (const pd of instances){
    const placement = findBestPlacement(pd, occupied, materialWidthCells, res, deadline);
    if (!placement){ unplacedPd.push(pd); continue; }
    commitPlacement(occupied, placement);
    placements.push({
      id: pd.id, label: pd.label, color: pd.color, angle: placement.angle, userAngle: placement.userAngle,
      xCells: placement.x, yCells: placement.y, res,
      originX: placement.v.originX, originY: placement.v.originY,
      outline: pd.outline, holeLoops: pd.holeLoops
    });
  }
  return { placements, unplacedPd, usedLength: currentMaxEnd(occupied) * res };
}

function runGapFillStrategy(placeable, materialWidthCells, res){
  const occupied = makeOccupied(materialWidthCells);
  const placements = [];
  const unplacedPd = [];
  let totalRemaining = placeable.reduce((s,pd) => s + pd.remaining, 0);
  let guard = 0;
  const guardMax = totalRemaining + 5;
  const deadline = Date.now() + STRATEGY_TIME_BUDGET_MS;
  while (totalRemaining > 0 && guard < guardMax){
    guard++;
    const currentMax = currentMaxEnd(occupied);
    const candidates = placeable
      .filter(pd => pd.remaining > 0)
      .sort((a,b) => b.area - a.area)
      .map(pd => ({ pd, placement: findBestPlacement(pd, occupied, materialWidthCells, res, deadline) }))
      .filter(c => c.placement);
    if (candidates.length === 0){
      placeable.forEach(pd => { for (let i=0;i<pd.remaining;i++) unplacedPd.push(pd); pd.remaining = 0; });
      break;
    }
    const chosen = candidates.find(c => c.placement.top <= currentMax + 1e-6) || candidates[0];
    commitPlacement(occupied, chosen.placement);
    placements.push({
      id: chosen.pd.id, label: chosen.pd.label, color: chosen.pd.color, angle: chosen.placement.angle, userAngle: chosen.placement.userAngle,
      xCells: chosen.placement.x, yCells: chosen.placement.y, res,
      originX: chosen.placement.v.originX, originY: chosen.placement.v.originY,
      outline: chosen.pd.outline, holeLoops: chosen.pd.holeLoops
    });
    chosen.pd.remaining--;
    totalRemaining--;
  }
  return { placements, unplacedPd, usedLength: currentMaxEnd(occupied) * res };
}

function buildPlaceableSetup(parts, options){
  const materialWidth = options.materialWidth;
  const gap = options.gap || 0;
  let res = options.resolution;
  if (!res){ res = materialWidth / 320; res = Math.max(res, 0.25); }
  const materialWidthCells = Math.max(1, Math.round(materialWidth / res));

  const partDefs = [];
  for (const p of parts){
    const outline = ensureCCW(p.outline);
    const area = Math.abs(polygonAreaLocal(outline));
    const bb = bbox(outline);
    const variants = {};
    for (const ang of p.angles){
      const v = buildVariant(outline, ang, res, gap, materialWidthCells);
      if (v) variants[ang] = v;
    }
    partDefs.push({ id: p.id, label: p.label, outline, area, bb, variants, count0: p.count, color: p.color, holeLoops: p.holeLoops || [] });
  }
  const placeableBase = partDefs.filter(pd => Object.keys(pd.variants).length > 0);
  const neverPlaceable = partDefs.filter(pd => Object.keys(pd.variants).length === 0);
  const baseUnplaced = [];
  neverPlaceable.forEach(pd => { for (let i=0;i<pd.count0;i++) baseUnplaced.push(pd); });

  return { materialWidth, gap, res, materialWidthCells, placeableBase, baseUnplaced };
}

function seededRng(seed){
  let s = seed >>> 0;
  return function(){
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// Same overall structure as the gap-fill strategy, but occasionally (with low
// probability) takes the second-best candidate instead of the best one — a small
// perturbation intended to explore variations near the already-strong greedy
// solution, used as the starting point for local-search refinement below.
function runPerturbedGapFillStrategy(placeable, materialWidthCells, res, rng, deviationProb){
  const occupied = makeOccupied(materialWidthCells);
  const placements = [];
  const unplacedPd = [];
  let totalRemaining = placeable.reduce((s,pd) => s + pd.remaining, 0);
  let guard = 0;
  const guardMax = totalRemaining + 5;
  const deadline = Date.now() + STRATEGY_TIME_BUDGET_MS;
  while (totalRemaining > 0 && guard < guardMax){
    guard++;
    const currentMax = currentMaxEnd(occupied);
    const candidates = placeable
      .filter(pd => pd.remaining > 0)
      .sort((a,b) => b.area - a.area)
      .map(pd => ({ pd, placement: findBestPlacement(pd, occupied, materialWidthCells, res, deadline) }))
      .filter(c => c.placement);
    if (candidates.length === 0){
      placeable.forEach(pd => { for (let i=0;i<pd.remaining;i++) unplacedPd.push(pd); pd.remaining = 0; });
      break;
    }
    const gapFillers = candidates.filter(c => c.placement.top <= currentMax + 1e-6);
    const pool = gapFillers.length > 0 ? gapFillers : candidates;
    let chosen = pool[0];
    if (pool.length > 1 && rng() < deviationProb) chosen = pool[1];
    commitPlacement(occupied, chosen.placement);
    placements.push({
      id: chosen.pd.id, label: chosen.pd.label, color: chosen.pd.color, angle: chosen.placement.angle, userAngle: chosen.placement.userAngle,
      xCells: chosen.placement.x, yCells: chosen.placement.y, res,
      originX: chosen.placement.v.originX, originY: chosen.placement.v.originY,
      outline: chosen.pd.outline, holeLoops: chosen.pd.holeLoops,
      pd: chosen.pd
    });
    chosen.pd.remaining--;
    totalRemaining--;
  }
  return { placements, unplacedPd, usedLength: currentMaxEnd(occupied) * res };
}

function rebuildOccupiedFromPlacements(materialWidthCells, placements){
  const occupied = makeOccupied(materialWidthCells);
  for (const p of placements){
    const v = p.pd.variants[p.userAngle];
    const colIdxs = [];
    for (let c=0;c<v.widthCells;c++) if (!Number.isNaN(v.colMinCells[c])) colIdxs.push(c);
    commitPlacement(occupied, { x: p.xCells, y: p.yCells, wc: v.widthCells, colIdxs, v });
  }
  return occupied;
}

// Large-neighbourhood local search: repeatedly pick a handful of already-placed
// plies at random, remove them, and re-insert them (largest first) into the
// resulting layout — keeping the change only if it doesn't make the nesting
// longer. Because removed plies are re-inserted using the same placement search
// as everything else, this lets plies that were placed early (when the layout was
// still mostly empty) get a chance to relocate now that the final layout's shape
// is known, without ever accepting a worse outcome.
function localSearchRefine(placeable, materialWidthCells, res, initialPlacements, rng, moves, deadline){
  let current = initialPlacements;
  let currentLen = currentMaxEnd(rebuildOccupiedFromPlacements(materialWidthCells, current)) * res;

  for (let m = 0; m < moves; m++){
    if (deadline && Date.now() > deadline) break;
    if (current.length < 2) break;
    const k = Math.min(current.length, 1 + Math.floor(rng()*3));
    const idxSet = new Set();
    while (idxSet.size < k) idxSet.add(Math.floor(rng()*current.length));
    const removed = Array.from(idxSet).map(i => current[i]).sort((a,b) => b.pd.area - a.pd.area);
    const remaining = current.filter((_,i) => !idxSet.has(i));

    const occ = rebuildOccupiedFromPlacements(materialWidthCells, remaining);
    const reinserted = [];
    let ok = true;
    for (const r of removed){
      const placement = findBestPlacement(r.pd, occ, materialWidthCells, res, deadline);
      if (!placement){ ok = false; break; }
      commitPlacement(occ, placement);
      reinserted.push({
        id: r.pd.id, label: r.pd.label, color: r.pd.color, angle: placement.angle, userAngle: placement.userAngle,
        xCells: placement.x, yCells: placement.y, res,
        originX: placement.v.originX, originY: placement.v.originY,
        outline: r.pd.outline, holeLoops: r.pd.holeLoops,
        pd: r.pd
      });
    }
    if (!ok) continue;
    const candidate = remaining.concat(reinserted);
    const newLen = currentMaxEnd(rebuildOccupiedFromPlacements(materialWidthCells, candidate)) * res;
    if (newLen <= currentLen + 1e-9){
      current = candidate;
      currentLen = newLen;
    }
  }
  return { placements: current, usedLength: currentLen };
}

// One full attempt for the iterative "Optimize" mode: a perturbed construction
// followed by local-search refinement. Returns the same shape as nest()'s result.
// This never replaces the fast deterministic result unless it's genuinely shorter —
// the caller is expected to run this repeatedly and keep only the best outcome
// across all attempts, including the original fast result as a guaranteed floor.
function runOptimizationPass(setup, seed, localSearchMoves){
  const { materialWidth, res, materialWidthCells, placeableBase, baseUnplaced } = setup;
  const rng = seededRng(seed);
  const constructed = runPerturbedGapFillStrategy(
    placeableBase.map(pd => ({...pd, remaining: pd.count0})),
    materialWidthCells, res, rng, 0.08
  );
  if (constructed.unplacedPd.length > 0){
    return {
      placements: constructed.placements, unplaced: baseUnplaced.concat(constructed.unplacedPd),
      usedLength: constructed.usedLength, materialWidth, resolution: res, materialWidthCells
    };
  }
  const deadline = Date.now() + STRATEGY_TIME_BUDGET_MS * 2;
  const refined = localSearchRefine(placeableBase, materialWidthCells, res, constructed.placements, rng, localSearchMoves, deadline);
  return {
    placements: refined.placements, unplaced: baseUnplaced.slice(),
    usedLength: refined.usedLength, materialWidth, resolution: res, materialWidthCells
  };
}


function nest(parts, options){
  const setup = buildPlaceableSetup(parts, options);
  const { materialWidth, res, materialWidthCells, placeableBase, baseUnplaced } = setup;

  const runs = [
    runFfdStrategy(placeableBase.map(pd => ({...pd, remaining: pd.count0})), materialWidthCells, res),
    runGapFillStrategy(placeableBase.map(pd => ({...pd, remaining: pd.count0})), materialWidthCells, res)
  ];

  // When a ply allows several orientations, the greedy per-instance search can
  // occasionally talk itself into mixing angles in a way that ends up *worse* than
  // simply picking one good angle and sticking with it throughout (allowing more
  // freedom should never make the result worse — only a greedy heuristic can trip
  // over its own options like that). As a safety net, also try locking every multi-
  // angle ply to whichever single allowed angle tiles the material width most
  // efficiently on its own, and keep that result if it turns out shorter.
  const multiAngleTypes = placeableBase.filter(pd => Object.keys(pd.variants).length > 1);
  const totalInstanceCount = placeableBase.reduce((s,pd) => s + pd.count0, 0);
  if (multiAngleTypes.length > 0){
    // Heuristic guess (cheap, catches the common case) — kept as one candidate.
    const heuristicLockedBase = placeableBase.map(pd => {
      const angleKeys = Object.keys(pd.variants);
      if (angleKeys.length <= 1) return pd;
      let bestAngle = angleKeys[0], bestCost = Infinity;
      for (const angleStr of angleKeys){
        const v = pd.variants[angleStr];
        let lo = Infinity, hi = -Infinity;
        for (let c=0;c<v.widthCells;c++){
          if (Number.isNaN(v.colMinCells[c])) continue;
          if (v.colMinCells[c] < lo) lo = v.colMinCells[c];
          if (v.colMaxCells[c] > hi) hi = v.colMaxCells[c];
        }
        const height = hi - lo;
        const rowCapacity = Math.max(1, Math.min(Math.floor(materialWidthCells / v.widthCells), pd.count0));
        const cost = height / rowCapacity;
        if (cost < bestCost){ bestCost = cost; bestAngle = angleStr; }
      }
      return { ...pd, variants: { [bestAngle]: pd.variants[bestAngle] } };
    });
    runs.push(
      runFfdStrategy(heuristicLockedBase.map(pd => ({...pd, remaining: pd.count0})), materialWidthCells, res),
      runGapFillStrategy(heuristicLockedBase.map(pd => ({...pd, remaining: pd.count0})), materialWidthCells, res)
    );

    // Exhaustive per-type, per-angle lock: for each multi-angle type, try forcing
    // *just that type* to each of its individually allowed angles in turn (every
    // other type keeps its full allowed set). A greedy per-instance search can get
    // trapped between two similarly-costed angles and end up worse than simply
    // committing to one of them throughout — trying each angle outright always
    // recovers whatever the true best single angle is for that type, regardless of
    // where the heuristic guess above lands. This is most valuable — and cheapest —
    // for smaller quantities, so it's skipped for large jobs (where it would mean
    // dozens of extra full passes) and capped to the highest-impact types otherwise.
    const EXHAUSTIVE_LOCK_MAX_INSTANCES = 300;
    const EXHAUSTIVE_LOCK_MAX_RUNS = 10;
    if (totalInstanceCount <= EXHAUSTIVE_LOCK_MAX_INSTANCES){
      const byImpact = multiAngleTypes.slice().sort((a,b) => (b.area*b.count0) - (a.area*a.count0));
      let runsLeft = EXHAUSTIVE_LOCK_MAX_RUNS;
      for (const targetPd of byImpact){
        if (runsLeft <= 0) break;
        const angleKeys = Object.keys(targetPd.variants).slice(0, runsLeft);
        runsLeft -= angleKeys.length;
        for (const angleStr of angleKeys){
          const variantBase = placeableBase.map(pd => {
            if (pd !== targetPd) return pd;
            return { ...pd, variants: { [angleStr]: pd.variants[angleStr] } };
          });
          runs.push(runFfdStrategy(variantBase.map(pd => ({...pd, remaining: pd.count0})), materialWidthCells, res));
        }
      }
    }
  }

  runs.forEach(r => { r.totalUnplaced = r.unplacedPd.length; });
  runs.sort((a,b) => (a.totalUnplaced - b.totalUnplaced) || (a.usedLength - b.usedLength));
  const winner = runs[0];
  const unplaced = baseUnplaced.concat(winner.unplacedPd);

  return {
    placements: winner.placements, unplaced,
    usedLength: winner.usedLength,
    materialWidth, resolution: res, materialWidthCells
  };
}

  window.NestingEngine = { nest, rotatePolygon, bbox, ensureCCW, buildPlaceableSetup, runOptimizationPass };
})();
</script>

<script>
(function(){
  'use strict';

  const ORIENTATION_OPTIONS = [0,45,90,135,180,225,270,315];
  const COLOR_PALETTE = ['#f2a93b','#33c9b0','#4c8bf5','#e8598b','#8b93a3','#c77dff','#5ecb63','#ff8c42','#4dd0e1','#d4a5ff'];

  // ---------------- state ----------------
  let plies = [];        // { uid, name, outline, loops, count, angles:Set, color }
  let plyCounter = 0;
  let currentUser = null;
  let lastResult = null; // last nest() output
  let jobHistory = [];    // session-only admin log
  let zoomPx = 0.6;       // px per mm for the SVG canvas

  // ---------------- login ----------------
  const loginGate = document.getElementById('loginGate');
  const appRoot = document.getElementById('appRoot');
  const loginUser = document.getElementById('loginUser');
  const loginPass = document.getElementById('loginPass');
  const loginError = document.getElementById('loginError');
  const loginSubmit = document.getElementById('loginSubmit');

  function attemptLogin(){
    const u = loginUser.value.trim();
    const p = loginPass.value;
    const match = window.__LOGIN_ACCOUNTS__.find(a => a.user === u && a.pass === p);
    if (match){
      currentUser = match;
      loginGate.classList.add('hidden');
      appRoot.classList.add('visible');
      document.getElementById('adminTabBtn').style.display = (match.role === 'admin') ? 'inline-flex' : 'none';
      loginError.classList.remove('visible');
      renderNestingView();
      renderAdminView();
    } else {
      loginError.classList.add('visible');
      loginPass.value = '';
      loginPass.focus();
    }
  }
  loginSubmit.addEventListener('click', attemptLogin);
  loginUser.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
  loginPass.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    currentUser = null;
    appRoot.classList.remove('visible');
    loginGate.classList.remove('hidden');
    loginUser.value = ''; loginPass.value = '';
  });

  // ---------------- tab switching ----------------
  document.querySelectorAll('.main-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('viewNesting').style.display = (tab === 'nesting') ? '' : 'none';
      document.getElementById('viewAdmin').style.display = (tab === 'admin') ? '' : 'none';
    });
  });

  // ---------------- helpers ----------------
  // Expands each selected orientation into a small band of candidate angles around
  // it (e.g. 45° with a 5° tolerance becomes {40, 42.5, 45, 47.5, 50}), letting the
  // placement search find a slightly better fit than the exact nominal angle would
  // allow. A step of half the tolerance was found (by direct testing) to capture
  // essentially all of the benefit a finer step gives, at much lower search cost.
  function expandAnglesWithTolerance(baseAngles, toleranceDeg){
    if (!toleranceDeg || toleranceDeg <= 0) return baseAngles.slice();
    const step = toleranceDeg / 2;
    const set = new Set();
    baseAngles.forEach(base => {
      for (let d = -toleranceDeg; d <= toleranceDeg + 1e-9; d += step){
        set.add(Math.round((base + d) * 10) / 10);
      }
    });
    return Array.from(set);
  }

  function fmt(n, d){ d = d===undefined?1:d; return Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function nextColor(){ return COLOR_PALETTE[plyCounter % COLOR_PALETTE.length]; }
  function svgEl(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function polygonBounds(pts){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for (const p of pts){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
    return {minX,maxX,minY,maxY};
  }

  // ---------------- NESTING VIEW ----------------
  function renderNestingView(){
    const root = document.getElementById('viewNesting');
    root.innerHTML = `
      <div class="panel-card">
        <div class="panel-head">
          <div>
            <h2>Plies to nest</h2>
            <div class="desc">Upload DXF outlines, then set quantity and allowed layup orientations for each.</div>
          </div>
          <div>
            <label for="dxfFileInput" class="btn primary small" style="cursor:pointer;">+ Add DXF file(s)</label>
            <input type="file" id="dxfFileInput" accept=".dxf" multiple>
          </div>
        </div>
        <div class="panel-body" style="padding:0;">
          <div id="plyTableWrap"></div>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-head">
          <div>
            <h2>Material &amp; nesting settings</h2>
            <div class="desc">All dimensions in millimetres (mm).</div>
          </div>
        </div>
        <div class="panel-body">
          <div class="settings-row">
            <div class="settings-field">
              <label class="field-label">Material width (mm)</label>
              <input type="number" id="materialWidth" min="1" step="1" value="1500">
            </div>
            <div class="settings-field">
              <label class="field-label">Gap between plies (mm)</label>
              <input type="number" id="plyGap" min="0" step="0.5" value="5">
            </div>
            <div class="settings-field">
              <label class="field-label">Angle tolerance (±°)</label>
              <input type="number" id="angleTolerance" min="0" max="15" step="0.5" value="0">
            </div>
            <div class="settings-field" style="flex:none;">
              <button type="button" class="btn primary" id="computeBtn">Compute nesting</button>
            </div>
          </div>
          <div class="ply-meta" style="margin-top:6px;">Lets each selected orientation drift a little either side of its exact value to find a tighter fit — 0 keeps orientations exact.</div>
          <div class="settings-row" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border-soft);">
            <div class="settings-field">
              <label class="field-label">Optimization iterations</label>
              <input type="number" id="optimizeIterations" min="1" max="500" step="1" value="20">
            </div>
            <div class="settings-field" style="flex:none;">
              <button type="button" class="btn primary" id="optimizeBtn">Optimize nesting (slower)</button>
            </div>
          </div>
          <div class="ply-meta" style="margin-top:6px;">Higher iteration counts are more thorough, but take longer to compute.</div>
          <div id="optimizeProgress" style="display:none; margin-top:10px; font-size:12px; color:var(--text-dim); font-family:'IBM Plex Mono', monospace;"></div>
        </div>
      </div>

      <div class="panel-card" id="resultsCard" style="display:none;">
        <div class="panel-head">
          <div>
            <h2>Nesting result</h2>
            <div class="desc" id="resultDesc"></div>
          </div>
          <div>
            <button type="button" class="btn small" id="downloadSvgBtn">Download nesting (DXF)</button>
          </div>
        </div>
        <div class="panel-body" style="padding-top:14px;">
          <div class="stat-row" id="statRow"></div>
        </div>
        <div id="warnBox"></div>
        <div class="zoom-row">
          <span class="zlabel">Zoom</span>
          <input type="range" id="zoomSlider" min="0.05" max="2" step="0.01" value="0.6">
          <span class="zlabel" id="zoomVal">0.60 px/mm</span>
        </div>
        <div id="canvasWrap"></div>
      </div>
    `;

    document.getElementById('dxfFileInput').addEventListener('change', handleDxfFiles);
    document.getElementById('computeBtn').addEventListener('click', runNesting);
    document.getElementById('optimizeBtn').addEventListener('click', runOptimizeNesting);
    renderPlyTable();
  }

  function handleDxfFiles(e){
    const files = Array.from(e.target.files || []);
    const readOne = (file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ file, text: reader.result, error: null });
      reader.onerror = () => resolve({ file, text: null, error: reader.error });
      reader.readAsText(file);
    });
    Promise.all(files.map(readOne)).then(results => {
      // Append in the original file-selection order, not whichever FileReader
      // happened to finish first, so quantities/orientations line up with what
      // the person actually selected.
      const failedNames = [];
      results.forEach(({ file, text }) => {
        if (text == null){ failedNames.push(file.name); return; }
        let shape;
        try { shape = window.DxfParser.parseDxfToShape(text); }
        catch(err){ shape = null; }
        if (!shape || !shape.outer || shape.outer.length < 3){
          failedNames.push(file.name);
          return;
        }
        plyCounter++;
        plies.push({
          uid: 'ply' + plyCounter,
          name: file.name.replace(/\.dxf$/i, ''),
          outline: shape.outer,
          loops: shape.loops,
          count: 1,
          angles: new Set([0]),
          color: nextColor()
        });
      });
      renderPlyTable();
      if (failedNames.length){
        alert('Could not read a closed outline from: ' + failedNames.join(', ') + '. Make sure each ply boundary is a single closed contour (LWPOLYLINE/POLYLINE/LINE/ARC).');
      }
    });
    e.target.value = '';
  }

  function miniPreviewSvg(outline, loops){
    const b = polygonBounds(outline);
    const w = b.maxX - b.minX || 1, h = b.maxY - b.minY || 1;
    const pad = 0.08;
    const vb = `${b.minX - w*pad} ${b.minY - h*pad} ${w*(1+2*pad)} ${h*(1+2*pad)}`;
    let paths = '';
    (loops || [outline]).forEach(loop => {
      const d = loop.map((p,i) => (i===0?'M':'L') + p.x + ' ' + p.y).join(' ') + ' Z';
      paths += `<path d="${d}" fill="none" stroke="#33c9b0" stroke-width="${Math.max(w,h)/40}" />`;
    });
    return `<svg viewBox="${vb}" width="44" height="34" preserveAspectRatio="xMidYMid meet" transform="scale(1,-1)">${paths}</svg>`;
  }

  function renderPlyTable(){
    const wrap = document.getElementById('plyTableWrap');
    if (!wrap) return;
    if (plies.length === 0){
      wrap.innerHTML = '<div id="emptyPlies">No DXF files loaded yet. Add one or more ply outlines to begin.</div>';
      return;
    }
    let rows = '';
    plies.forEach(ply => {
      const b = polygonBounds(ply.outline);
      const w = (b.maxX-b.minX).toFixed(1), h = (b.maxY-b.minY).toFixed(1);
      const chips = ORIENTATION_OPTIONS.map(a => {
        const checked = ply.angles.has(a) ? ' checked' : '';
        return `<span class="angle-chip${checked}" data-uid="${ply.uid}" data-angle="${a}">${a}°</span>`;
      }).join('');
      rows += `
        <tr>
          <td>
            <div class="ply-name-cell">
              <span class="ply-swatch" style="background:${ply.color}"></span>
              <div class="ply-mini">${miniPreviewSvg(ply.outline, ply.loops)}</div>
              <div>
                <input type="text" class="ply-name-input" data-uid="${ply.uid}" value="${ply.name.replace(/"/g,'&quot;')}" style="width:320px;">
                <div class="ply-meta">${w} × ${h} mm bbox</div>
              </div>
            </div>
          </td>
          <td><input type="number" class="qty-input ply-qty-input" data-uid="${ply.uid}" min="1" step="1" value="${ply.count}"></td>
          <td><div class="angle-chips">${chips}</div></td>
          <td><button type="button" class="btn small danger ply-remove-btn" data-uid="${ply.uid}">Remove</button></td>
        </tr>`;
    });
    wrap.innerHTML = `
      <table class="ply-table">
        <thead><tr><th>Ply</th><th>Quantity</th><th>Allowed orientations</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

    wrap.querySelectorAll('.ply-name-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const ply = plies.find(p => p.uid === inp.dataset.uid);
        if (ply) ply.name = inp.value;
      });
    });
    wrap.querySelectorAll('.ply-qty-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const ply = plies.find(p => p.uid === inp.dataset.uid);
        if (ply) ply.count = Math.max(1, parseInt(inp.value, 10) || 1);
      });
    });
    wrap.querySelectorAll('.angle-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const ply = plies.find(p => p.uid === chip.dataset.uid);
        const angle = parseFloat(chip.dataset.angle);
        if (!ply) return;
        if (ply.angles.has(angle)){
          if (ply.angles.size > 1) ply.angles.delete(angle); // keep at least one orientation
        } else {
          ply.angles.add(angle);
        }
        renderPlyTable();
      });
    });
    wrap.querySelectorAll('.ply-remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        plies = plies.filter(p => p.uid !== btn.dataset.uid);
        renderPlyTable();
      });
    });
  }

  // ---------------- run nesting ----------------
  function runNesting(){
    if (plies.length === 0){ alert('Add at least one DXF ply before computing a nesting.'); return; }
    const materialWidth = parseFloat(document.getElementById('materialWidth').value);
    const gap = parseFloat(document.getElementById('plyGap').value) || 0;
    const angleTolerance = parseFloat(document.getElementById('angleTolerance').value) || 0;
    if (!materialWidth || materialWidth <= 0){ alert('Enter a valid material width.'); return; }

    const computeBtn = document.getElementById('computeBtn');
    const originalLabel = computeBtn.innerHTML;
    computeBtn.disabled = true;
    computeBtn.innerHTML = '<span class="spinner"></span> Computing…';

    setTimeout(() => {
      const parts = plies.map(p => ({
        id: p.uid, label: p.name, outline: p.outline, count: p.count,
        angles: expandAnglesWithTolerance(Array.from(p.angles), angleTolerance), color: p.color,
        holeLoops: (p.loops || []).filter(l => l !== p.outline)
      }));
      const result = window.NestingEngine.nest(parts, { materialWidth, gap });
      lastResult = result;
      renderResults(result, materialWidth, gap);
      jobHistory.unshift({
        time: new Date(),
        plyCount: plies.length,
        totalParts: parts.reduce((s,p)=>s+p.count,0),
        materialWidth, gap,
        usedLength: result.usedLength,
        unplaced: result.unplaced.length
      });
      renderAdminView();
      computeBtn.disabled = false;
      computeBtn.innerHTML = originalLabel;
    }, 20);
  }

  // Iterative "Optimize" mode: runs the same fast result first (as a guaranteed
  // floor), then repeatedly tries a perturbed construction plus local-search
  // refinement, keeping only whichever attempt is shortest so far. Because every
  // attempt is compared against the running best and only kept if it's actually
  // better, this can never produce a worse result than plain "Compute nesting" —
  // it can only match it or improve on it, at the cost of a lot more time.
  async function runOptimizeNesting(){
    if (plies.length === 0){ alert('Add at least one DXF ply before computing a nesting.'); return; }
    const materialWidth = parseFloat(document.getElementById('materialWidth').value);
    const gap = parseFloat(document.getElementById('plyGap').value) || 0;
    const angleTolerance = parseFloat(document.getElementById('angleTolerance').value) || 0;
    if (!materialWidth || materialWidth <= 0){ alert('Enter a valid material width.'); return; }
    let iterations = parseInt(document.getElementById('optimizeIterations').value, 10);
    if (!isFinite(iterations) || iterations < 1) iterations = 1;
    iterations = Math.min(iterations, 500);

    const optimizeBtn = document.getElementById('optimizeBtn');
    const computeBtn = document.getElementById('computeBtn');
    const originalLabel = optimizeBtn.innerHTML;
    optimizeBtn.disabled = true;
    computeBtn.disabled = true;
    const progressEl = document.getElementById('optimizeProgress');
    progressEl.style.display = 'block';

    await new Promise(r => setTimeout(r, 20));

    const parts = plies.map(p => ({
      id: p.uid, label: p.name, outline: p.outline, count: p.count,
      angles: expandAnglesWithTolerance(Array.from(p.angles), angleTolerance), color: p.color,
      holeLoops: (p.loops || []).filter(l => l !== p.outline)
    }));

    optimizeBtn.innerHTML = '<span class="spinner"></span> Computing baseline…';
    progressEl.textContent = 'Running the fast baseline first…';
    await new Promise(r => setTimeout(r, 20));

    const setup = window.NestingEngine.buildPlaceableSetup(parts, { materialWidth, gap });
    let best = window.NestingEngine.nest(parts, { materialWidth, gap });
    let bestSource = 'fast baseline';
    renderResults(best, materialWidth, gap);

    for (let i = 0; i < iterations; i++){
      optimizeBtn.innerHTML = '<span class="spinner"></span> Optimizing…';
      progressEl.textContent = `Iteration ${i+1} of ${iterations} — best so far: ${fmt(best.usedLength,1)} mm (${bestSource})`;
      await new Promise(r => setTimeout(r, 0)); // yield so the browser can repaint

      const localSearchMoves = 60;
      const attempt = window.NestingEngine.runOptimizationPass(setup, Date.now() ^ (i*2654435761), localSearchMoves);
      if (attempt.unplaced.length === 0 && attempt.usedLength < best.usedLength - 1e-6){
        best = attempt;
        bestSource = `iteration ${i+1}`;
        renderResults(best, materialWidth, gap);
      }
    }

    progressEl.textContent = `Done — ${iterations} iterations tried. Best result: ${fmt(best.usedLength,1)} mm (${bestSource}).`;
    lastResult = best;
    jobHistory.unshift({
      time: new Date(),
      plyCount: plies.length,
      totalParts: parts.reduce((s,p)=>s+p.count,0),
      materialWidth, gap,
      usedLength: best.usedLength,
      unplaced: best.unplaced.length
    });
    renderAdminView();
    optimizeBtn.disabled = false;
    computeBtn.disabled = false;
    optimizeBtn.innerHTML = originalLabel;
  }

  function partArea(outline){
    let a = 0;
    for (let i=0;i<outline.length;i++){ const p1=outline[i], p2=outline[(i+1)%outline.length]; a += p1.x*p2.y - p2.x*p1.y; }
    return Math.abs(a/2);
  }

  function renderResults(result, materialWidth, gap){
    const card = document.getElementById('resultsCard');
    card.style.display = '';
    document.getElementById('resultDesc').textContent =
      `Material width ${fmt(materialWidth,0)} mm · gap ${fmt(gap,1)} mm · ${result.placements.length} plies placed`;

    let totalArea = 0;
    result.placements.forEach(pl => { totalArea += partArea(pl.outline); });
    const usedArea = result.usedLength * result.materialWidth;
    const utilization = usedArea > 0 ? (totalArea / usedArea) * 100 : 0;

    const statRow = document.getElementById('statRow');
    statRow.innerHTML = `
      <div class="stat-box"><div class="num accent">${fmt(result.usedLength,1)}</div><div class="lbl">Nesting length (mm)</div></div>
      <div class="stat-box"><div class="num">${fmt(result.materialWidth,0)}</div><div class="lbl">Material width (mm)</div></div>
      <div class="stat-box"><div class="num good">${fmt(utilization,1)}%</div><div class="lbl">Material utilization</div></div>
      <div class="stat-box"><div class="num">${result.placements.length}</div><div class="lbl">Plies placed</div></div>
      <div class="stat-box"><div class="num ${result.unplaced.length? 'warn':''}">${result.unplaced.length}</div><div class="lbl">Plies unplaced</div></div>
    `;

    const warnBox = document.getElementById('warnBox');
    if (result.unplaced.length){
      const byLabel = {};
      result.unplaced.forEach(u => { byLabel[u.label] = (byLabel[u.label]||0)+1; });
      const parts = Object.entries(byLabel).map(([l,c]) => `${l} (${c})`).join(', ');
      warnBox.style.display = 'block';
      warnBox.textContent = `${result.unplaced.length} ply instance(s) could not be placed within the material width at any allowed orientation: ${parts}. Consider a wider material, a different orientation selection, or a smaller gap.`;
    } else {
      warnBox.style.display = 'none';
    }

    renderCanvas(result);
    setupZoomSlider(result);
  }

  function setupZoomSlider(result){
    const slider = document.getElementById('zoomSlider');
    const label = document.getElementById('zoomVal');
    slider.value = zoomPx;
    label.textContent = zoomPx.toFixed(2) + ' px/mm';
    slider.oninput = () => {
      zoomPx = parseFloat(slider.value);
      label.textContent = zoomPx.toFixed(2) + ' px/mm';
      renderCanvas(result);
    };
  }

  function renderCanvas(result){
    const wrap = document.getElementById('canvasWrap');
    wrap.innerHTML = '';
    const scale = zoomPx;
    // Horizontal axis = nesting length (feed direction), zero at the left.
    // Vertical axis = material width.
    const Lpx = Math.max(result.usedLength, 1) * scale;
    const Wpx = result.materialWidth * scale;
    const marginL = 46, marginT = 20;
    const svg = svgEl('svg', { width: Lpx + marginL + 20, height: Wpx + marginT + 20, viewBox: `0 0 ${Lpx+marginL+20} ${Wpx+marginT+20}` });

    // background sheet
    svg.appendChild(svgEl('rect', { x: marginL, y: marginT, width: Lpx, height: Wpx, fill: '#0d0f13', stroke: '#2a2f3a', 'stroke-width': 1 }));

    // length ruler (top) — 0 at the left, increasing left-to-right along the feed direction
    const lenStep = niceStep(result.usedLength || 100);
    for (let len = 0; len <= result.usedLength; len += lenStep){
      const px = marginL + len*scale;
      svg.appendChild(svgEl('line', { x1: px, y1: marginT, x2: px, y2: marginT+Wpx, stroke: '#22262f', 'stroke-width': 1 }));
      const t = svgEl('text', { x: px, y: marginT-6, fill: '#5c6373', 'font-size': 9, 'font-family': 'IBM Plex Mono, monospace', 'text-anchor': 'middle' });
      t.textContent = len;
      svg.appendChild(t);
    }
    // width ruler (left)
    const widthStep = niceStep(result.materialWidth);
    for (let wv = 0; wv <= result.materialWidth; wv += widthStep){
      const py = marginT + wv*scale;
      svg.appendChild(svgEl('line', { x1: marginL, y1: py, x2: marginL+Lpx, y2: py, stroke: '#1a1e26', 'stroke-width': 1 }));
      const t = svgEl('text', { x: marginL-6, y: py+3, fill: '#5c6373', 'font-size': 9, 'font-family': 'IBM Plex Mono, monospace', 'text-anchor': 'end' });
      t.textContent = wv;
      svg.appendChild(t);
    }

    // used-length line (marks the end of the nesting, on the right)
    const usedX = marginL + result.usedLength*scale;
    svg.appendChild(svgEl('line', { x1: usedX, y1: marginT, x2: usedX, y2: marginT+Wpx, stroke: '#f2a93b', 'stroke-width': 1.5, 'stroke-dasharray': '5,4' }));

    // parts — material coordinate: (x_mat = across width, y_mat = along length, zero at feed start).
    // SVG coordinate: svgX = marginL + y_mat*scale (length, left-to-right) ; svgY = marginT + x_mat*scale (width)
    result.placements.forEach(pl => {
      const rotated = window.NestingEngine.rotatePolygon(window.NestingEngine.ensureCCW(pl.outline), pl.angle);
      const tx = pl.xCells*pl.res - pl.originX;
      const ty = pl.yCells*pl.res - pl.originY;
      const shifted = rotated.map(p => ({ x: p.x+tx, y: p.y+ty }));
      const d = shifted.map((p,i) => (i===0?'M':'L') + (marginL+p.y*scale).toFixed(1) + ' ' + (marginT+p.x*scale).toFixed(1)).join(' ') + ' Z';
      const path = svgEl('path', { d, fill: (pl.color||'#33c9b0') + '33', stroke: pl.color||'#33c9b0', 'stroke-width': 1.2 });
      path.addEventListener('mousemove', (ev) => showPartTooltip(ev, pl));
      path.addEventListener('mouseleave', hidePartTooltip);
      svg.appendChild(path);

      // Real closed cuts/holes inside the ply (not text — text is discarded on
      // import) are drawn too, transformed the same rigid way as the outline.
      (pl.holeLoops || []).forEach(loop => {
        const rotatedHole = window.NestingEngine.rotatePolygon(loop, pl.angle);
        const shiftedHole = rotatedHole.map(p => ({ x: p.x+tx, y: p.y+ty }));
        const dh = shiftedHole.map((p,i) => (i===0?'M':'L') + (marginL+p.y*scale).toFixed(1) + ' ' + (marginT+p.x*scale).toFixed(1)).join(' ') + ' Z';
        svg.appendChild(svgEl('path', { d: dh, fill: '#0d0f13', stroke: pl.color||'#33c9b0', 'stroke-width': 1, 'stroke-dasharray': '3,2', 'pointer-events':'none' }));
      });

      const b = polygonBounds(shifted);
      const cx = marginL + (b.minY+b.maxY)/2*scale;
      const cy = marginT + (b.minX+b.maxX)/2*scale;
      if (scale > 0.25){
        const label = svgEl('text', { x: cx, y: cy, fill: '#e9ecf1', 'font-size': 10, 'font-family':'IBM Plex Mono, monospace', 'text-anchor':'middle', 'pointer-events':'none' });
        label.textContent = pl.label + ' · ' + pl.userAngle + '°';
        svg.appendChild(label);
      }
    });

    wrap.appendChild(svg);

    document.getElementById('downloadSvgBtn').onclick = () => downloadDxf(result);
  }

  function niceStep(range){
    const target = range / 12;
    const mag = Math.pow(10, Math.floor(Math.log10(Math.max(target,1))));
    const norm = target / mag;
    let step;
    if (norm < 1.5) step = 1; else if (norm < 3.5) step = 2; else if (norm < 7.5) step = 5; else step = 10;
    return step * mag;
  }

  function showPartTooltip(ev, pl){
    const tip = document.getElementById('partTooltip');
    tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px;">${pl.label}</div>` +
      `<div>Orientation: ${pl.userAngle}°</div>` +
      `<div>Position: x=${fmt(pl.xCells*pl.res,1)} mm, y=${fmt(pl.yCells*pl.res,1)} mm</div>`;
    tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX+14, window.innerWidth-260) + 'px';
    tip.style.top = Math.min(ev.clientY+14, window.innerHeight-100) + 'px';
  }
  function hidePartTooltip(){ document.getElementById('partTooltip').style.display = 'none'; }

  // ---------------- DXF export ----------------
  // Area-weighted centroid of a simple polygon (falls back to the bbox centre for
  // degenerate/zero-area cases).
  function polygonCentroidGeom(pts){
    let a = 0, cx = 0, cy = 0;
    for (let i=0;i<pts.length;i++){
      const p1 = pts[i], p2 = pts[(i+1)%pts.length];
      const cross = p1.x*p2.y - p2.x*p1.y;
      a += cross;
      cx += (p1.x+p2.x)*cross;
      cy += (p1.y+p2.y)*cross;
    }
    a *= 0.5;
    if (Math.abs(a) < 1e-9){
      const b = polygonBounds(pts);
      return { x: (b.minX+b.maxX)/2, y: (b.minY+b.maxY)/2 };
    }
    return { x: cx/(6*a), y: cy/(6*a) };
  }

  // Width of the polygon measured along a horizontal line through y (used to size the
  // ply-name text so it fits inside the shape at the height it's actually drawn at).
  function horizontalSpanAtY(pts, y){
    let lo = Infinity, hi = -Infinity;
    const n = pts.length;
    for (let i=0;i<n;i++){
      const p1 = pts[i], p2 = pts[(i+1)%n];
      const y1 = p1.y, y2 = p2.y;
      if ((y1 <= y && y2 > y) || (y2 <= y && y1 > y)){
        const t = (y-y1)/(y2-y1);
        const x = p1.x + t*(p2.x-p1.x);
        if (x < lo) lo = x;
        if (x > hi) hi = x;
      }
    }
    if (hi < lo) return null;
    return hi - lo;
  }

  function polygonBoundsLocal(pts){
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for (const p of pts){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
