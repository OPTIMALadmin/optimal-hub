<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roll Tracker — OPTIMAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c24;--surface2:#1e2330;--surface3:#252b38;--border:#2a3040;--border2:#3a4255;
  --text:#e0e6f0;--text2:#8a95a8;--text3:#4a5568;
  --cyan:#00d4aa;--cyan-dim:rgba(0,212,170,0.12);--cyan-border:rgba(0,212,170,0.3);
  --green:#39d353;--green-dim:rgba(57,211,83,0.1);--green-border:rgba(57,211,83,0.3);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.1);--amber-border:rgba(245,166,35,0.3);
  --red:#e05252;--red-dim:rgba(224,82,82,0.1);--red-border:rgba(224,82,82,0.3);
  --blue:#4a9eff;--blue-dim:rgba(74,158,255,0.1);--blue-border:rgba(74,158,255,0.3);
  --radius:4px;--radius-lg:6px;
  --shadow-lg:0 8px 32px rgba(0,0,0,0.5);
  --font:'JetBrains Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;line-height:1.5}
.app{display:flex;min-height:100vh;flex-direction:column}

/* Top header bar */
.topbar{height:70px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:20px;position:fixed;top:0;left:0;right:0;z-index:200;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--text)}
.topbar-title span{color:var(--cyan)}
.topbar-sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.topbar-user{font-size:11px;color:var(--text2);letter-spacing:0.05em}
.topbar-user strong{color:var(--cyan);font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-builddate{font-size:10px;color:var(--text3);letter-spacing:0.08em}

/* Optimal Group logo SVG inline */
.optimal-logo{height:32px;width:auto;opacity:0.85}

/* Layout below topbar */
.app-body{display:flex;margin-top:70px;min-height:calc(100vh - 70px)}

/* Sidebar */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;height:calc(100vh - 70px);top:70px;left:0;z-index:100;overflow-y:auto}
.sidebar-user{padding:16px 18px;border-bottom:1px solid var(--border)}
.sidebar-user .name{font-size:12px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.06em}
.sidebar-user .role{font-size:10px;color:var(--cyan);margin-top:3px;letter-spacing:0.06em}
nav{flex:1;padding:8px 0}
nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--text2);text-decoration:none;font-size:11px;cursor:pointer;transition:all 0.12s;border:none;background:none;width:100%;text-align:left;font-family:var(--font);letter-spacing:0.06em;text-transform:uppercase;border-left:2px solid transparent}
nav a:hover{background:var(--surface2);color:var(--text);border-left-color:var(--border2)}
nav a.active{background:var(--cyan-dim);color:var(--cyan);border-left-color:var(--cyan)}
nav a svg{width:14px;height:14px;flex-shrink:0}
.nav-section{padding:14px 18px 4px;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:4px}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--border)}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 12px;border-radius:var(--radius);cursor:pointer;font-size:10px;font-family:var(--font);width:100%;text-align:left;transition:all 0.12s;display:flex;align-items:center;gap:8px;letter-spacing:0.06em;text-transform:uppercase}
.logout-btn:hover{border-color:var(--red-border);color:var(--red);background:var(--red-dim)}

/* Main content */
.main{margin-left:220px;flex:1;padding:28px 32px;min-height:calc(100vh - 70px);max-width:calc(100vw - 220px)}
.page-header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.page-header h2{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text)}
.page-header h2 span{color:var(--cyan)}
.page-header p{color:var(--text2);margin-top:4px;font-size:11px;letter-spacing:0.04em}

/* Login */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);flex-direction:column;gap:0}
.login-topbar{width:100%;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0}
.login-topbar-left{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text)}
.login-topbar-left span{color:var(--cyan)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;width:380px;margin-top:56px}
.login-logo-wrap{text-align:center;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.login-logo-wrap h1{font-size:12px;font-weight:600;color:var(--text2);margin-top:14px;letter-spacing:0.12em;text-transform:uppercase}

/* Forms */
.form-group{margin-bottom:16px}
label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em}
input[type=text],input[type=password],input[type=email],input[type=number],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--surface2);color:var(--text);transition:border-color 0.12s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-dim)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input[type=checkbox]{width:auto;margin-right:4px;accent-color:var(--cyan)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.12s;text-decoration:none;text-transform:uppercase;letter-spacing:0.06em}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-primary{background:var(--cyan);color:#0f1117;border-color:var(--cyan)}.btn-primary:hover{background:#00bfa0}
.btn-success{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}.btn-success:hover{background:var(--green);color:#0f1117}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:var(--red-border)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.btn-blue{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-border)}.btn-blue:hover{background:var(--blue);color:#fff}
.btn-sm{padding:5px 10px;font-size:10px}
.btn:disabled{opacity:0.3;cursor:not-allowed}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;font-weight:600}
.stat-card .value{font-size:28px;font-weight:700;letter-spacing:-0.02em;color:var(--text)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);font-weight:600;white-space:nowrap;background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:2px;font-size:10px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:0.06em;border:1px solid}
.badge-blue{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-border)}
.badge-green{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}
.badge-amber{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-border)}
.badge-red{background:var(--red-dim);color:var(--red);border-color:var(--red-border)}
.badge-gray{background:var(--surface3);color:var(--text2);border-color:var(--border)}
.badge-cyan{background:var(--cyan-dim);color:var(--cyan);border-color:var(--cyan-border)}

/* PO Detail */
.po-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.po-field{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.po-field .key{font-size:9px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em}
.po-field .val{font-size:13px;font-weight:500;word-break:break-word;color:var(--text)}
.section-title{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--cyan);margin-bottom:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* Approval level cards */
.level-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.level-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;opacity:0.3;transition:all 0.2s;background:var(--surface2)}
.level-card.active{opacity:1;border-color:var(--cyan-border);background:var(--cyan-dim);box-shadow:0 0 12px var(--cyan-dim)}
.level-card.approved{opacity:1;border-color:var(--green-border);background:var(--green-dim)}
.level-card.rejected{opacity:1;border-color:var(--red-border);background:var(--red-dim)}
.level-card h4{font-size:11px;font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.06em}
.level-card p{font-size:10px;color:var(--text2)}
.level-card .status-label{margin-top:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--cyan)}

/* Alerts */
.alert{padding:11px 14px;border-radius:var(--radius);font-size:11px;margin-bottom:16px;line-height:1.6;border:1px solid}
.alert-success{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}
.alert-error{background:var(--red-dim);color:var(--red);border-color:var(--red-border)}
.alert-info{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-border)}
.alert-warning{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-border)}

/* Approval stamp */
.approval-stamp{position:relative;overflow:hidden;border:1px solid var(--green-border);background:var(--green-dim);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.approval-stamp .stamp-text{position:absolute;right:-10px;top:50%;transform:translateY(-50%) rotate(-12deg);font-size:48px;font-weight:900;color:rgba(57,211,83,0.08);white-space:nowrap;pointer-events:none;letter-spacing:6px;text-transform:uppercase}

/* Timeline */
.timeline{padding:0}
.timeline-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.timeline-item:last-child{border-bottom:none}
.timeline-dot{width:28px;height:28px;border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;border:1px solid var(--border);background:var(--surface2)}
.timeline-body .who{font-size:11px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.04em}
.timeline-body .when{font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--font)}
.timeline-body .what{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.5}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;width:480px;max-width:100%;box-shadow:var(--shadow-lg)}
.modal h3{font-size:13px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cyan)}
.modal .modal-desc{color:var(--text2);font-size:11px;margin-bottom:16px;line-height:1.7}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* Upload page */
.upload-options{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.upload-option{border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;cursor:pointer;transition:all 0.15s;background:var(--surface)}
.upload-option:hover{border-color:var(--cyan-border);background:var(--cyan-dim)}
.upload-option .opt-icon{font-size:32px;margin-bottom:12px}
.upload-option h3{font-size:12px;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cyan)}
.upload-option p{font-size:11px;color:var(--text2);line-height:1.7;margin-bottom:14px}
.upload-option .steps{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.upload-option .step{display:flex;align-items:flex-start;gap:8px}
.step-num{width:16px;height:16px;border-radius:2px;background:var(--cyan);color:#0f1117;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:11px;color:var(--text2);line-height:1.5}

/* PDF import banner */
.pdf-ready-banner{background:var(--green-dim);border:1px solid var(--green-border);border-radius:var(--radius-lg);padding:16px 20px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.pdf-ready-banner .pdf-icon{font-size:28px;flex-shrink:0}
.pdf-ready-banner h3{font-size:12px;font-weight:700;color:var(--green);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.06em}
.pdf-ready-banner p{font-size:11px;color:var(--text2)}

/* Review form */
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.level-indicator{border-radius:var(--radius);padding:11px 14px;display:flex;align-items:center;gap:10px;margin-bottom:18px;background:var(--surface2);border:1px solid var(--border)}

/* Items editor */
.items-header-row{display:grid;grid-template-columns:1fr 70px 100px 100px 32px;gap:8px;margin-bottom:5px;padding:0 2px}
.items-header-row span{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;font-weight:600}
.item-row{display:grid;grid-template-columns:1fr 70px 100px 100px 32px;gap:8px;align-items:center;margin-bottom:7px}
.item-row input{padding:7px 9px;font-size:11px}
.del-btn{background:var(--red-dim);border:1px solid var(--red-border);color:var(--red);border-radius:var(--radius);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;height:32px;width:32px;flex-shrink:0;font-weight:400;line-height:1;padding:0}
.del-btn:hover{background:var(--red);color:#fff}

/* User management */
.user-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.user-row:last-child{border-bottom:none}
.user-avatar{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid var(--border)}
.user-info{flex:1;min-width:160px}
.user-info .uname{font-size:12px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.04em}
.user-info .uemail{font-size:10px;color:var(--text3);margin-top:2px}

/* Parameters */
.param-card{border-radius:var(--radius);padding:18px;border:1px solid}
.param-card h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px}
.param-card .amount{font-size:20px;font-weight:700;margin-bottom:4px;color:var(--text)}
.param-card .desc{font-size:10px;color:var(--text2);margin-bottom:12px;letter-spacing:0.04em}
.approver-chip{font-size:10px;background:var(--surface3);padding:2px 8px;border-radius:2px;display:inline-block;margin:2px;color:var(--text2);border:1px solid var(--border);font-family:var(--font)}

/* Toast */
#toast{position:fixed;top:70px;right:20px;z-index:9999;pointer-events:none}
.toast-item{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:var(--radius);font-size:11px;margin-bottom:7px;box-shadow:var(--shadow-lg);animation:slideIn 0.15s ease;max-width:300px;line-height:1.5;font-family:var(--font);letter-spacing:0.03em}
.toast-item.success{border-color:var(--green-border);color:var(--green);background:var(--green-dim)}
.toast-item.error{border-color:var(--red-border);color:var(--red);background:var(--red-dim)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{opacity:1}to{opacity:0;transform:translateX(110%)}}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

@media(max-width:900px){
  .sidebar{width:190px}.main{margin-left:190px;padding:20px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .po-grid,.review-grid{grid-template-columns:1fr}
  .upload-options,.level-cards{grid-template-columns:1fr}
}


/* ===== Roll Tracker additions ===== */
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:300;background:var(--surface)}
.topbar{top:env(safe-area-inset-top,0px)}
.sidebar{top:calc(70px + env(safe-area-inset-top,0px))}
img{max-width:100%}
.btn:focus-visible,nav a:focus-visible,.logout-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=date],input[type=datetime-local]{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--surface2);color:var(--text);outline:none;color-scheme:dark}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.serial{font-weight:700;color:var(--cyan);letter-spacing:0.04em;white-space:nowrap}
.muted{color:var(--text2)}.dim{color:var(--text3)}
.clickrow{cursor:pointer}
.bar{height:6px;background:var(--surface3);border-radius:2px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--cyan)}
.bar.amber>i{background:var(--amber)}.bar.red>i{background:var(--red)}.bar.green>i{background:var(--green)}
.roll-hero{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.roll-hero .big-serial{font-size:24px;font-weight:700;color:var(--cyan);letter-spacing:0.04em}
.roll-hero .sub{font-size:11px;color:var(--text2);margin-top:4px}
.gauge{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.gauge .k{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:6px}
.gauge .v{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.gauge .v small{font-size:11px;color:var(--text2);font-weight:500}
.usage-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.usage-card.open{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-dim),var(--surface2) 40%)}
.usage-card .uc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.usage-card .uc-num{font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.06em}
.usage-card .uc-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}

<body>
<div id="toast"></div>
<div id="root"></div>
<script>
// ============================================================
// PRE-PREG ROLL TRACKER — OPTIMAL  (GitHub storage edition)
// ============================================================
const INITIAL_USERS = [
  { id:'admin', login:'admin', pass:'adminOPTIMAL', name:'Administrator', role:'admin' },
  { id:'user1', login:'user1', pass:'user1OPTIMAL', name:'User 1',        role:'user'  },
];
// GitHub storage — owner/repo/branch embedded, only the access token is stored per browser
const GH_OWNER  = 'optimaladmin';
const GH_REPO   = 'Roll-Data';
const GH_BRANCH = 'main';
const GH_FILE   = 'roll_data.json';
const TOKEN_KEY = 'rolltracker_gh_token';
const CACHE_KEY = 'rolltracker_cache';
const SESSION_KEY = 'rolltracker_session';
const SERIAL_PREFIX = 'OPT-PP-';
const FORM_PAGES = ['rollform','password','storage'];
const POLL_MS = 60000;

const state = {
  mode: 'github',
  store: null,            // full JSON document as stored in GitHub
  sha: null,              // GitHub blob sha of the version we hold
  syncing: false, lastSync: null, ghError: null, offline: false,
  loaded: { users:false, rolls:false, projects:false },
  data: { users:{}, rolls:{}, projects:{} },
  loggedIn:false, currentUser:null,
  page:'dashboard', rollId:null, editRollId:null,
  filters:{ q:'', status:'active' },
  an:{ project:'', material:'', from:'', to:'' },
  pendingRender:false,
};
// ============================================================
// HELPERS
// ============================================================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nowISO = () => new Date().toISOString();
const num = (n,d=2) => Number(n||0).toLocaleString('pt-PT',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtDT = iso => iso ? new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
function fmtDur(ms){ const h = ms/3.6e6; if (h < 48) return num(h,1)+' h'; return num(h/24,1)+' d'; }
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function toDateInput(iso){ return iso ? toLocalInput(iso).slice(0,10) : ''; }
function fromLocalInput(v){ if(!v) return null; const d=new Date(v); return isNaN(d) ? null : d.toISOString(); }
function serialStr(n){ return SERIAL_PREFIX + String(n).padStart(5,'0'); }
const isAdmin = () => state.currentUser?.role === 'admin';
const users = () => Object.values(state.data.users).sort((a,b)=>(a.role===b.role? a.login.localeCompare(b.login) : a.role==='admin'?-1:1));
const rolls = () => Object.values(state.data.rolls).sort((a,b)=>(b.serial||0)-(a.serial||0));
const projects = () => Object.values(state.data.projects).sort((a,b)=>String(a.code||a.name).localeCompare(String(b.code||b.name)));
const userName = login => state.data.users[Object.keys(state.data.users).find(k=>state.data.users[k].login===login)]?.name || login;

function toast(msg, type='success', duration=3500) {
  const t = document.createElement('div');
  t.className = 'toast-item '+type; t.textContent = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(()=>{ t.style.animation='slideOut 0.2s ease forwards'; setTimeout(()=>t.remove(), 200); }, duration);
}

// ============================================================
// ROLL COMPUTATIONS
// ============================================================
function addMonths(iso, m){ const d=new Date(iso); d.setMonth(d.getMonth()+Number(m||0)); return d; }
function rollStats(r){
  const usages = r.usages || [];
  const used = usages.reduce((s,u)=>s+Number(u.meters||0),0);
  const initial = Number(r.initialLength||0);
  const remaining = Math.max(0, initial - used);
  const now = Date.now();
  let outMs = 0, open = null;
  usages.forEach(u=>{
    const a = new Date(u.outAt).getTime();
    const b = u.inAt ? new Date(u.inAt).getTime() : now;
    if (!u.inAt) open = u;
    if (!isNaN(a)) outMs += Math.max(0, b - a);
  });
  const outLifeMs = Number(r.lifeOutDays||0) * 864e5;
  const outPct = outLifeMs ? outMs/outLifeMs*100 : 0;
  const outLeftMs = outLifeMs ? outLifeMs - outMs : null;
  const coldExpiry = (r.arrival && r.lifeColdMonths) ? addMonths(r.arrival, r.lifeColdMonths) : null;
  const coldDaysLeft = coldExpiry ? Math.floor((coldExpiry.getTime()-now)/864e5) : null;
  const widthM = Number(r.width||0)/1000;
  let status = 'stored';
  if (r.archived) status = 'archived';
  else if (initial > 0 && remaining <= 0.0001) status = 'depleted';
  else if (open) status = 'out';
  const expired = (outLifeMs && outPct >= 100) || (coldDaysLeft !== null && coldDaysLeft < 0);
  const warn = !expired && ((outLifeMs && outPct >= 80) || (coldDaysLeft !== null && coldDaysLeft <= 30));
  return { used, initial, remaining, remPct: initial? remaining/initial*100 : 0, area: remaining*widthM,
           outMs, outPct, outLeftMs, open, coldExpiry, coldDaysLeft, status, expired, warn };
}
function statusBadge(st, s){
  const map = { stored:['badge-cyan','In cold storage'], out:['badge-amber','Out of storage'], depleted:['badge-gray','Depleted'], archived:['badge-gray','Archived'] };
  const [c,l] = map[st.status];
  let extra = '';
  if (st.status!=='archived' && st.status!=='depleted') {
    if (st.expired) extra = ' <span class="badge badge-red">Expired</span>';
    else if (st.warn) extra = ' <span class="badge badge-amber">Life warning</span>';
  }
  return `<span class="badge ${c}">${l}</span>${extra}`;
}
function barClass(pct, inverse){ // inverse: high pct = bad
  if (inverse) return pct>=100?'red':pct>=80?'amber':'green';
  return pct<=10?'red':pct<=25?'amber':'';
}
function partsText(parts){ return (parts||[]).filter(p=>p.qty>0).map(p=>`${p.qty}× ${p.name}`).join(', '); }
function partsChips(parts){
  const ps = (parts||[]).filter(p=>p.qty>0);
  if (!ps.length) return '<span class="dim">—</span>';
  return ps.map(p=>`<span class="chip"><b>${p.qty}×</b> ${esc(p.name)}${p.pn?` <span class="dim">${esc(p.pn)}</span>`:''}</span>`).join('');
}

// ============================================================
// STORAGE LAYER — GitHub repository (single JSON file)
// ============================================================
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e) { return ''; } };
const setToken = t => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(e) {} };
const ghConfigured = () => !!getToken();
const ghHeaders = (accept='application/vnd.github+json') => ({ 'Authorization':'Bearer '+getToken(), 'Accept':accept, 'X-GitHub-Api-Version':'2022-11-28' });
const ghUrl = () => `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

function emptyStore(){ return { schema:1, users:{}, rolls:{}, projects:{}, meta:{ nextSerial:1 } }; }
function normalizeStore(d){
  const s = Object.assign(emptyStore(), d||{});
  ['users','rolls','projects'].forEach(k=>{ s[k] = s[k] || {}; Object.keys(s[k]).forEach(id=>{ s[k][id].id = id; }); });
  s.meta = Object.assign({ nextSerial:1 }, s.meta||{});
  return s;
}
function applyStore(d, sha){
  state.store = normalizeStore(d);
  if (sha !== undefined) state.sha = sha;
  state.data = { users:state.store.users, rolls:state.store.rolls, projects:state.store.projects };
  state.loaded = { users:true, rolls:true, projects:true };
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ store:state.store, sha:state.sha, at:nowISO() })); } catch(e) {}
}
function loadCache(){
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if (c && c.store) { applyStore(c.store, c.sha); state.lastSync = c.at; return true; } } catch(e) {}
  return false;
}
function b64EncodeUtf8(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i=0; i<bytes.length; i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(bin);
}
function b64DecodeUtf8(b64){ const bin = atob(b64.replace(/\s/g,'')); const bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(bytes); }
function ghErrorText(status, body){
  if (status===401) return 'GitHub rejected the access token (401). It may be wrong or expired — enter a new token.';
  if (status===403) return 'Access forbidden (403). The token needs "Contents: Read and write" on '+GH_OWNER+'/'+GH_REPO+'.';
  if (status===404) return 'Repository '+GH_OWNER+'/'+GH_REPO+' not found, or the token has no access to it.';
  return 'GitHub error '+status+(body?': '+String(body).slice(0,160):'');
}
// → {ok, data, sha} | {ok:true, notFound:true} | {ok:false, status, error, network}
async function ghGet(){
  if (!ghConfigured()) return { ok:false, error:'No GitHub access token on this computer.' };
  try {
    const r = await fetch(ghUrl()+`?ref=${GH_BRANCH}&t=${Date.now()}`, { headers:ghHeaders(), cache:'no-store' });
    if (r.status === 404) {
      // distinguish "file not created yet" from "repo not reachable"
      const rr = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, { headers:ghHeaders(), cache:'no-store' });
      if (rr.ok) return { ok:true, notFound:true };
      return { ok:false, status:rr.status, error:ghErrorText(rr.status) };
    }
    if (!r.ok) return { ok:false, status:r.status, error:ghErrorText(r.status, await r.text()) };
    const meta = await r.json();
    let text;
    if (meta.content && meta.encoding === 'base64') text = b64DecodeUtf8(meta.content);
    else { // files over 1 MB: fetch raw
      const raw = await fetch(ghUrl()+`?ref=${GH_BRANCH}&t=${Date.now()}`, { headers:ghHeaders('application/vnd.github.raw+json'), cache:'no-store' });
      if (!raw.ok) return { ok:false, status:raw.status, error:ghErrorText(raw.status) };
      text = await raw.text();
    }
    return { ok:true, data: JSON.parse(text), sha: meta.sha };
  } catch(e) { return { ok:false, network:true, error:'Could not reach GitHub ('+e.message+').' }; }
}
// → {ok, sha} | {ok:false, conflict:true} | {ok:false, error}
async function ghPut(data, sha, message){
  try {
    const body = { message: message || 'Roll Tracker update', content: b64EncodeUtf8(JSON.stringify(data, null, 1)), branch: GH_BRANCH };
    if (sha) body.sha = sha;
    const r = await fetch(ghUrl(), { method:'PUT', headers:{ ...ghHeaders(), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if (r.ok) { const j = await r.json(); return { ok:true, sha:j.content.sha }; }
    const txt = await r.text();
    if (r.status === 409 || (r.status === 422 && /sha/i.test(txt))) return { ok:false, conflict:true };
    if (r.status === 422 && /branch/i.test(txt)) return { ok:false, error:'Branch "'+GH_BRANCH+'" does not exist in '+GH_REPO+'. Add a README in GitHub so the main branch is created.' };
    return { ok:false, status:r.status, error:ghErrorText(r.status, txt) };
  } catch(e) { return { ok:false, network:true, error:'Could not reach GitHub ('+e.message+'). Nothing was saved.' }; }
}
function setSyncing(on, label){
  state.syncing = on;
  const b = document.getElementById('sync-btn');
  if (b) { b.textContent = on ? (label||'⟳ Saving…') : '⟳ Sync'; b.disabled = on; }
  const c = document.getElementById('sync-chip');
  if (c) { c.className = 'conn-chip '+(state.ghError?'local':'ok'); c.textContent = state.ghError ? '● Sync problem' : '● GitHub · '+(state.lastSync?new Date(state.lastSync).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'—'); c.title = state.ghError || ('Last synced '+fmtDT(state.lastSync)); }
}
// Pull the latest file. Returns {ok, changed, notFound, error}
async function pull(){
  const r = await ghGet();
  if (!r.ok) { state.ghError = r.error; state.offline = !!r.network; setSyncing(state.syncing); return r; }
  state.ghError = null; state.offline = false; state.lastSync = nowISO();
  if (r.notFound) { setSyncing(state.syncing); return { ok:true, notFound:true }; }
  const changed = r.sha !== state.sha;
  if (changed) applyStore(r.data, r.sha);
  setSyncing(state.syncing);
  return { ok:true, changed };
}
// Every change goes through commit(): fn(data) edits a fresh copy of the whole store.
// On a conflict (someone else saved first) we pull and re-apply fn, so no one's change is lost.
let writeChain = Promise.resolve();
function commit(message, fn){
  const p = writeChain.then(()=>doCommit(message, fn));
  writeChain = p.catch(()=>{});
  return p;
}
class AbortCommit extends Error {}
async function doCommit(message, fn){
  if (!ghConfigured()) { toast('No GitHub token on this computer — nothing was saved.','error',6000); return { ok:false }; }
  setSyncing(true);
  try {
    for (let attempt=0; attempt<5; attempt++) {
      if (attempt>0 || !state.store) { const pr = await pull(); if (!pr.ok) { toast(pr.error+' Nothing was saved.','error',7000); return { ok:false }; } if (pr.notFound && !state.store) applyStore(emptyStore(), null); }
      const d = clone(state.store || emptyStore());
      let res;
      try { res = fn(d); } catch(e) { if (e instanceof AbortCommit) { toast(e.message,'error',6000); return { ok:false }; } throw e; }
      d.updatedAt = nowISO(); d.updatedBy = state.currentUser?.login || 'system';
      const w = await ghPut(d, state.sha, message + (state.currentUser?` [${state.currentUser.login}]`:''));
      if (w.ok) { applyStore(d, w.sha); state.lastSync = nowISO(); state.ghError = null; return { ok:true, res }; }
      if (w.conflict) { await sleep(300 + Math.random()*500); continue; }
      state.ghError = w.error; toast(w.error,'error',8000); return { ok:false };
    }
    toast('Could not save — the data kept changing on GitHub. Please try again.','error',6000); return { ok:false };
  } finally { setSyncing(false); }
}
const abort = msg => { throw new AbortCommit(msg); };
const strip = o => { const c = clone(o); delete c.id; return c; };
async function saveDoc(coll, id, data, message){ return (await commit(message||`Save ${coll}/${id}`, d=>{ d[coll][id] = strip(data); })).ok; }
async function deleteDoc(coll, id, message){ return (await commit(message||`Delete ${coll}/${id}`, d=>{ delete d[coll][id]; })).ok; }
async function mutate(coll, id, message, fn){
  return (await commit(message, d=>{ const cur = d[coll][id]; if (!cur) abort('This record no longer exists (it may have been deleted by someone else).'); const out = fn(clone(cur), d); d[coll][id] = strip(out || cur); })).ok;
}
async function ensureFile(){
  // first run: create roll_data.json with the starting accounts
  return commit('Initialise Roll Tracker data', d=>{
    if (Object.keys(d.users).length) return;
    INITIAL_USERS.forEach(u=>{ d.users[u.id] = { ...strip(u), createdAt: nowISO() }; });
  });
}
async function manualSync(){
  if (state.syncing) return;
  setSyncing(true,'⟳ Syncing…');
  const r = await pull();
  setSyncing(false);
  if (r.ok) { toast(r.changed?'Synced with GitHub — new data loaded ✓':'Synced with GitHub ✓'); requestRender(); }
  else toast(r.error,'error',7000);
}
setInterval(async ()=>{ if (state.loggedIn && ghConfigured() && !state.syncing && !document.hidden) { const r = await pull(); if (r.ok && r.changed) requestRender(); } }, POLL_MS);
window.addEventListener('focus', async ()=>{ if (state.loggedIn && ghConfigured() && !state.syncing) { const r = await pull(); if (r.ok && r.changed) requestRender(); } });
// ============================================================
// RENDER SCHEDULING (don't wipe what someone is typing)
// ============================================================
function busy(){
  if (!state.loggedIn) return true;
  if (document.querySelector('.modal-overlay')) return true;
  if (FORM_PAGES.includes(state.page)) return true;
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest('.main') && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && !ae.classList.contains('flt')) return true;
  return [...document.querySelectorAll('.main textarea, .main input.draft')].some(el => el.value && el.value.trim());
}
function requestRender(){
  if (!state.loggedIn) { updateLoginButton(); return; }
  if (state.currentUser) { const fresh = state.data.users[state.currentUser.id]; if (fresh) state.currentUser = fresh; else { doLogout(); return; } }
  if (busy()) { state.pendingRender = true; return; }
  render();
}
setInterval(()=>{ if (state.pendingRender && !busy()) render(); }, 1500);
setInterval(()=>{ if (state.loggedIn && !busy() && ['dashboard','roll','rolls'].includes(state.page)) render(); }, 60000); // keep out-time clocks moving

// ============================================================
// RENDER ENGINE
// ============================================================
function render(){
  state.pendingRender = false;
  const root = document.getElementById('root');
  const y = window.scrollY;
  root.innerHTML = '';
  if (!state.loggedIn) { root.appendChild(renderLogin()); return; }
  root.appendChild(renderApp());
  window.scrollTo(0, y);
}

// ============================================================
// LOGIN
// ============================================================
function renderLogin(){
  const BUILD_DATE = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
  const needToken = !ghConfigured() || state.ghError && /401|403|404|token/i.test(state.ghError);
  const page = document.createElement('div'); page.className = 'login-page';
  page.innerHTML = `

function updateLoginButton(){}
async function doLogin(){
  const login = document.getElementById('lu')?.value.trim();
  const pass  = document.getElementById('lp')?.value;
  const errEl = document.getElementById('login-err');
  const tok = document.getElementById('lp-gh')?.value.trim();
  if (tok) setToken(tok);
  if (!ghConfigured()) { errEl.innerHTML = '<div class="alert alert-error">Enter the GitHub access token to connect this computer.</div>'; return; }
  const btn = document.getElementById('login-submit-btn');
  btn.disabled = true; btn.textContent = '⟳ Syncing with GitHub…';
  // Pull the latest data BEFORE checking credentials, so users added on other computers are recognised
  let r = await pull();
  if (r.ok && r.notFound) { applyStore(emptyStore(), null); const c = await ensureFile(); if (!c.ok) r = { ok:false, error: state.ghError || 'Could not create '+GH_FILE+' in the repository.' }; }
  btn.disabled = false; btn.textContent = 'Sign in';
  if (!r.ok) {
    if (r.network && state.store) { toast('GitHub is unreachable — showing this computer’s last synced data. Changes cannot be saved until the connection returns.','error',9000); }
    else { if (/401|403|404|token/i.test(r.error||'')) { const keepU=login; render(); document.getElementById('lu').value=keepU||''; return; } errEl.innerHTML = `<div class="alert alert-error">${esc(r.error)}</div>`; return; }
  }
  const user = Object.values(state.data.users).find(u => u.login === login && u.pass === pass);
  if (!user) { errEl.innerHTML = '<div class="alert alert-error">Invalid username or password.</div>'; return; }
  state.loggedIn = true; state.currentUser = user; state.page = 'dashboard';
  try { localStorage.setItem(SESSION_KEY, user.id); } catch(e) {}
  toast('Synced with GitHub ✓');
  render();
}
function doLogout(){ state.loggedIn=false; state.currentUser=null; closeModal(); try{ localStorage.removeItem(SESSION_KEY); }catch(e){} render(); }

function renderApp(){
  const u = state.currentUser, admin = isAdmin();
  const wrap = document.createElement('div'); wrap.className = 'app';
  const outNow = rolls().filter(r=>rollStats(r).status==='out').length;
  const topbar = document.createElement('div'); topbar.className = 'topbar';
  topbar.innerHTML = `
    <div class="topbar-title"><span>ROLL</span> TRACKER</div>
    <div class="topbar-sep"></div>
    <div class="topbar-user">Logged in as <strong>${esc(u.login)}</strong></div>
    <div class="topbar-right">

function nav(page){ closeModal(); state.page=page; if(page!=='rollform') state.editRollId=null; render(); window.scrollTo(0,0); }
function openRoll(id){ state.rollId=id; nav('roll'); }
function openRollForm(id){ state.editRollId=id; closeModal(); state.page='rollform'; render(); window.scrollTo(0,0); }

// ============================================================
// MODALS
// ============================================================
function openModal(html, opts={}){
  closeModal();
  const ov = document.createElement('div'); ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('mousedown', e=>{ if (e.target===ov) closeModal(); });
  document.body.appendChild(ov);
  setTimeout(()=>ov.querySelector('input:not([type=hidden]),select,textarea')?.focus(), 30);
  return ov;
}
function closeModal(){ document.querySelectorAll('.modal-overlay').forEach(m=>m.remove()); }
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeModal(); });
let _confirmFn = null;
function confirmBox(title, text, fn, label='Delete'){
  _confirmFn = fn;
  openModal(`<h3>${esc(title)}</h3><div class="modal-desc">${text}</div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="(async()=>{const f=_confirmFn;closeModal();await f();})()">${esc(label)}</button></div>`);
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard(){
  const u = state.currentUser;
  const rs = rolls().map(r=>({r, s:rollStats(r)}));
  const active = rs.filter(x=>x.s.status==='stored'||x.s.status==='out');
  const out = rs.filter(x=>x.s.status==='out');
  const stockM = active.reduce((t,x)=>t+x.s.remaining,0);
  const stockA = active.reduce((t,x)=>t+x.s.area,0);
  const alerts = active.filter(x=>x.s.expired||x.s.warn);
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="page-header"><h2>Welcome back, ${esc(u.name.split(' ')[0])}</h2><p>${new Date().toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p></div>
    <div class="stats-row">
      <div class="stat-card"><div class="label">Active rolls</div><div class="value">${active.length}</div></div>
      <div class="stat-card"><div class="label">Live stock</div><div class="value" style="color:var(--cyan)">${num(stockM,1)}<span style="font-size:13px;color:var(--text2)"> m</span></div><div class="dim" style="font-size:10px">${num(stockA,1)} m²</div></div>
      <div class="stat-card"><div class="label">Out of cold storage now</div><div class="value" style="color:${out.length?'var(--amber)':'var(--text)'}">${out.length}</div></div>
      <div class="stat-card"><div class="label">Life alerts</div><div class="value" style="color:${alerts.some(x=>x.s.expired)?'var(--red)':alerts.length?'var(--amber)':'var(--text)'}">${alerts.length}</div></div>
    </div>`;

  const outCard = document.createElement('div'); outCard.className='card'; outCard.style.marginBottom='20px';
  outCard.innerHTML = `<div class="section-title">Currently out of cold storage</div>` + (out.length ? `
    <div class="table-wrap"><table><thead><tr><th>Serial</th><th>Material</th><th>Removed</th><th>By</th><th>This session</th><th>Out-life used</th><th></th></tr></thead><tbody>
    ${out.map(({r,s})=>`<tr class="clickrow" onclick="openRoll('${r.id}')">
      <td class="serial">${esc(serialStr(r.serial))}</td><td>${esc(r.material||'—')}</td><td>${fmtDT(s.open.outAt)}</td><td>${esc(userName(s.open.by))}</td>
      <td style="color:var(--amber);font-weight:600">${fmtDur(Date.now()-new Date(s.open.outAt).getTime())}</td>
      <td>${s.outLeftMs===null?'<span class="dim">no limit set</span>':`<div class="bar ${barClass(s.outPct,true)}"><i style="width:${Math.min(100,s.outPct)}%"></i></div><span class="dim" style="font-size:10px">${num(s.outPct,0)}% · ${s.outLeftMs>0?fmtDur(s.outLeftMs)+' left':'exceeded'}</span>`}</td>
      <td onclick="event.stopPropagation()"><button class="btn btn-success btn-sm" onclick="quickReturn('${r.id}')">${svgIcon('snow')} Return</button></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">All rolls are in cold storage.</div>`);
  div.appendChild(outCard);

  const two = document.createElement('div'); two.className='grid2'; two.style.alignItems='start';
  const alCard = document.createElement('div'); alCard.className='card';
  alCard.innerHTML = `<div class="section-title">Life alerts</div>` + (alerts.length ? `<div class="alert-list">${alerts.map(({r,s})=>{
    const msgs=[];
    if (s.outLeftMs!==null && s.outPct>=80) msgs.push(s.outPct>=100?`Out-life exceeded by ${fmtDur(-s.outLeftMs)}`:`Out-life ${num(s.outPct,0)}% used`);
    if (s.coldDaysLeft!==null && s.coldDaysLeft<=30) msgs.push(s.coldDaysLeft<0?`Cold-storage life expired ${fmtDate(s.coldExpiry.toISOString())}`:`Cold-storage life ends in ${s.coldDaysLeft} d`);
    return `<div class="al" onclick="openRoll('${r.id}')"><span class="badge ${s.expired?'badge-red':'badge-amber'}">${s.expired?'Expired':'Warning'}</span><span class="serial">${esc(serialStr(r.serial))}</span><span class="muted">${esc(msgs.join(' · '))}</span></div>`;}).join('')}</div>` : `<div class="empty">No rolls near end of life.</div>`);
  two.appendChild(alCard);

  const recent = [];
  rolls().forEach(r=>(r.usages||[]).forEach(us=>recent.push({r,us})));
  recent.sort((a,b)=>new Date(b.us.outAt)-new Date(a.us.outAt));
  const rcCard = document.createElement('div'); rcCard.className='card';
  rcCard.innerHTML = `<div class="section-title">Recent material withdrawals</div>` + (recent.length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Roll</th><th>Project</th><th style="text-align:right">m</th></tr></thead><tbody>
    ${recent.slice(0,8).map(({r,us})=>`<tr class="clickrow" onclick="openRoll('${r.id}')"><td>${fmtDate(us.outAt)}</td><td class="serial">${esc(serialStr(r.serial))}</td><td>${esc(us.projectName||'—')}</td><td style="text-align:right;font-weight:600">${num(us.meters)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">No material withdrawn yet.</div>`);
  two.appendChild(rcCard);
  div.appendChild(two);
  return div;
}

function renderRolls(){
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
      <div><h2>Rolls</h2><p>Every pre-preg roll registered at OPTIMAL, with live remaining length and storage life</p></div>
      <button class="btn btn-primary" onclick="openRollForm(null)">${svgIcon('plus')} New Roll</button>
    </div>
    <div class="toolbar">
      <div class="form-group" style="flex:1;min-width:200px"><label>Search</label><input type="text" class="flt" id="rf-q" placeholder="Serial, material, supplier, supplier S/N…" value="${esc(state.filters.q)}"></div>
      <div class="form-group"><label>Status</label><select class="flt" id="rf-s">
        ${[['active','Active (stored + out)'],['stored','In cold storage'],['out','Out of storage'],['alerts','Life alerts'],['depleted','Depleted'],['archived','Archived'],['all','All rolls']].map(([v,l])=>`<option value="${v}" ${state.filters.status===v?'selected':''}>${l}</option>`).join('')}
      </select></div>
    </div>
    <div class="card" style="padding:0"><div id="roll-table"></div></div>`;
  setTimeout(()=>{
    const q=document.getElementById('rf-q'), s=document.getElementById('rf-s');
    q?.addEventListener('input', ()=>{ state.filters.q=q.value; fillRollTable(); });
    s?.addEventListener('change', ()=>{ state.filters.status=s.value; fillRollTable(); });
    fillRollTable();
  },0);

}
function fillRollTable(){
  const el = document.getElementById('roll-table'); if (!el) return;
  const q = state.filters.q.trim().toLowerCase(), f = state.filters.status;
  const list = rolls().map(r=>({r,s:rollStats(r)})).filter(({r,s})=>{
    if (f==='active' && !(s.status==='stored'||s.status==='out')) return false;
    if (['stored','out','depleted','archived'].includes(f) && s.status!==f) return false;
    if (f==='alerts' && !((s.expired||s.warn) && (s.status==='stored'||s.status==='out'))) return false;
    if (!q) return true;
    return [serialStr(r.serial), r.material, r.supplier, r.supplierSN].some(v=>String(v||'').toLowerCase().includes(q));
  });
  if (!list.length) { el.innerHTML = `<div class="empty">${rolls().length? 'No rolls match these filters.' : 'No rolls yet — create the first one with “New Roll”.'}</div>`; return; }
  el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Serial</th><th>Material</th><th>Supplier</th><th>Supplier S/N</th><th style="text-align:right">Width</th><th>Remaining</th><th>Out-life used</th><th>Cold life until</th><th>Status</th></tr></thead><tbody>
  ${list.map(({r,s})=>`<tr class="clickrow" onclick="openRoll('${r.id}')">
    <td class="serial">${esc(serialStr(r.serial))}</td>
    <td>${esc(r.material||'—')}</td><td>${esc(r.supplier||'—')}</td><td class="muted">${esc(r.supplierSN||'—')}</td>
    <td style="text-align:right">${r.width?num(r.width,0)+' mm':'—'}</td>
    <td><div style="font-weight:600">${num(s.remaining)} <span class="dim">/ ${num(s.initial,0)} m</span></div><div class="bar ${barClass(s.remPct)}"><i style="width:${Math.max(0,Math.min(100,s.remPct))}%"></i></div></td>
    <td>${s.outLeftMs===null?'<span class="dim">—</span>':`<div class="dim" style="font-size:10px">${fmtDur(s.outMs)} · ${num(s.outPct,0)}%</div><div class="bar ${barClass(s.outPct,true)}"><i style="width:${Math.min(100,s.outPct)}%"></i></div>`}</td>
    <td style="${s.coldDaysLeft!==null&&s.coldDaysLeft<0?'color:var(--red)':s.coldDaysLeft!==null&&s.coldDaysLeft<=30?'color:var(--amber)':''}">${s.coldExpiry?fmtDate(s.coldExpiry.toISOString()):'—'}</td>
    <td>${statusBadge(s)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

async function saveRollForm(){
  const g = id => document.getElementById(id)?.value?.trim() || '';
  const msg = document.getElementById('f-msg');
  const data = { material:g('f-material'), supplier:g('f-supplier'), supplierSN:g('f-sn'),
    arrival: g('f-arrival') ? new Date(g('f-arrival')+'T12:00:00').toISOString() : null,
    lifeColdMonths: g('f-cold')===''?null:Number(g('f-cold')), lifeOutDays: g('f-out')===''?null:Number(g('f-out')),
    width: g('f-width')===''?null:Number(g('f-width')), initialLength: g('f-length')===''?null:Number(g('f-length')) };
  if (!data.material || !data.supplier || !data.arrival || !data.width || !data.initialLength) { msg.innerHTML = '<div class="alert alert-error">Material, supplier, arrival date, width and initial length are required.</div>'; return; }
  const btn = document.getElementById('f-save'); btn.disabled = true;
  const by = state.currentUser.login, at = nowISO();
  if (state.editRollId) {
    const id = state.editRollId;
    const labels = {material:'material',supplier:'supplier',supplierSN:'supplier S/N',arrival:'arrival',lifeColdMonths:'cold-storage life',lifeOutDays:'out-of-storage life',width:'width',initialLength:'initial length'};
    const ok = await mutate('rolls', id, `Edit roll ${serialStr(state.data.rolls[id].serial)}`, r=>{
      const used = rollStats(r).used;
      if (data.initialLength < used) abort('Initial length can’t be less than the material already withdrawn ('+num(used)+' m).');
      const changed = Object.keys(labels).filter(k => String(r[k]??'') !== String(data[k]??''));
      Object.assign(r, data, { updatedAt:at, updatedBy:by });
      if (changed.length) (r.history = r.history||[]).push({ at, by, action:'Edited roll: '+changed.map(k=>labels[k]).join(', ') });
      return r;
    });
    if (ok) { toast('Roll updated ✓'); openRoll(id); } else btn.disabled=false;
  } else {
    const note = g('f-note');
    // serial is reserved inside the commit: if two people create a roll at once, the second one retries with the next number
    const c = await commit('Register new roll', d=>{
      const maxExisting = Object.values(d.rolls).reduce((m,r)=>Math.max(m, r.serial||0), 0);
      const serial = Math.max(Number(d.meta.nextSerial||1), maxExisting+1);
      d.meta.nextSerial = serial + 1;
      const id = 'roll-' + String(serial).padStart(5,'0');
      d.rolls[id] = { ...data, serial, createdAt:at, createdBy:by, usages:[], notes: note?[{id:uid(),text:note,at,by}]:[], history:[{at,by,action:'Roll registered as '+serialStr(serial)}], archived:false };
      return { id, serial };
    });
    if (c.ok) { toast(`Roll ${serialStr(c.res.serial)} created ✓`); state.editRollId=null; openRoll(c.res.id); } else btn.disabled=false;
  }
}

function renderPartPicker(){
  const el = document.getElementById('u-parts'); if (!el) return;

  if (!pid) { el.innerHTML = '<div class="dim" style="font-size:11px;padding:8px 0">Select a project to list its parts.</div>'; return; }

  if (!parts.length && !extra.length) { el.innerHTML = '<div class="alert alert-info" style="margin:0">No parts defined for this project yet — add them in “Projects & Parts”.</div>'; return; }
  const qtyOf = id => _usageCtx.parts.find(x=>x.partId===id)?.qty || 0;
  el.innerHTML = `<div class="part-pick">${[...parts.map(pp=>({id:pp.id,name:pp.name,pn:pp.pn})), ...extra.map(x=>({id:x.partId,name:x.name,pn:x.pn,gone:true}))].map(pp=>{

  }).join('')}</div>`;

function setQty(partId, delta, abs){
  const pid = document.getElementById('u-p').value; const p = state.data.projects[pid];
  let item = _usageCtx.parts.find(x=>x.partId===partId);
  const def = (p?.parts||[]).find(x=>x.id===partId);
  if (!item) { item = { partId, name:def?.name||'', pn:def?.pn||'', qty:0 }; _usageCtx.parts.push(item); }
  item.qty = Math.max(0, Math.round(abs!==undefined ? Number(abs)||0 : item.qty + delta));
  renderPartPicker();
}

  if (inAt && new Date(inAt) < new Date(outAt)) return msg.innerHTML = '<div class="alert alert-error">The return time must be after the removal time.</div>';
  if (!(meters > 0)) return msg.innerHTML = '<div class="alert alert-error">Enter the linear meters removed.</div>';
  if (!p) return msg.innerHTML = '<div class="alert alert-error">Select the project.</div>';
  const ctx = clone(_usageCtx);
  const parts = ctx.parts.filter(x=>x.qty>0).map(x=>{ const d=(p.parts||[]).find(pp=>pp.id===x.partId); return { partId:x.partId, name:d?.name||x.name, pn:d?.pn||x.pn||'', qty:x.qty }; });
  const by = state.currentUser.login, at = nowISO();
  const body = { outAt, inAt, meters, projectId:p.id, projectName:(p.code?p.code+' — ':'')+p.name, parts, remark:g('u-rem') };
  const saveBtn = document.getElementById('u-save'); if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
  const ok = await mutate('rolls', ctx.rollId, `${ctx.usageId?'Edit':'Record'} withdrawal ${num(meters)} m — ${serialStr(state.data.rolls[ctx.rollId].serial)}`, r=>{
    r.usages = r.usages||[];
    const others = r.usages.filter(x=>x.id!==ctx.usageId);
    const avail = Number(r.initialLength||0) - others.reduce((s,x)=>s+Number(x.meters||0),0);
    if (meters > avail + 1e-6) abort(`Only ${num(avail)} m are available on this roll.`);
    if (!inAt && others.some(x=>!x.inAt)) abort('Another withdrawal on this roll is still open (roll not returned). Close it first.');
    r.history = r.history||[];
    if (ctx.usageId) {
      const ix = r.usages.findIndex(x=>x.id===ctx.usageId);
      if (ix<0) abort('This withdrawal no longer exists.');
      r.usages[ix] = { ...r.usages[ix], ...body, editedAt:at, editedBy:by };
      r.history.push({at,by,action:`Edited withdrawal of ${num(meters)} m (${body.projectName})`});
    } else {
      r.usages.push({ id:uid(), ...body, at, by });
      r.history.push({at,by,action:`Withdrew ${num(meters)} m for ${body.projectName}${parts.length?' — '+partsText(parts):''}${inAt?'':' · roll out of cold storage'}`});
    }
    return r;
  });
  if (ok) { closeModal(); toast('Withdrawal saved ✓'); render(); }
  else if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
}

}

function allUsages(){
  const out = [];
  rolls().forEach(r=>(r.usages||[]).forEach(u=>out.push({ r, u, area: Number(u.meters||0)*Number(r.width||0)/1000 })));
  return out.sort((a,b)=>new Date(b.u.outAt)-new Date(a.u.outAt));
}
function filteredUsages(){
  const f = state.an;
  return allUsages().filter(({r,u})=>{
    if (f.project && u.projectId!==f.project) return false;
    if (f.material && r.material!==f.material) return false;
    const d = toDateInput(u.outAt);
    if (f.from && d < f.from) return false;
    if (f.to && d > f.to) return false;
    return true;
  });
}

function fillConsumption(){
  const el = document.getElementById('an-body'); if (!el) return;
  const list = filteredUsages();
  const tm = list.reduce((s,x)=>s+Number(x.u.meters||0),0), ta = list.reduce((s,x)=>s+x.area,0);
  const outH = list.reduce((s,x)=>s+Math.max(0,((x.u.inAt?new Date(x.u.inAt):new Date())-new Date(x.u.outAt))),0);
  const group = (keyFn) => { const m = {}; list.forEach(x=>{ const k=keyFn(x); if(!m[k]) m[k]={m:0,a:0,n:0}; m[k].m+=Number(x.u.meters||0); m[k].a+=x.area; m[k].n++; }); return Object.entries(m); };
  const byProj = group(x=>x.u.projectName||'—').sort((a,b)=>b[1].m-a[1].m);

  const parts = {}; list.forEach(x=>(x.u.parts||[]).forEach(p=>{ const k=(x.u.projectName||'')+'|'+(p.pn||'')+'|'+p.name; if(!parts[k]) parts[k]={proj:x.u.projectName,pn:p.pn,name:p.name,q:0,n:0}; parts[k].q+=p.qty; parts[k].n++; }));

  const pct = v => tm>0? num(v/tm*100,1)+'%' : '—';
  if (!list.length) { el.innerHTML = `<div class="card"><div class="empty">No withdrawals match these filters.</div></div>`; return; }

    <div class="stats-row">

      <div class="stat-card"><div class="label">Area</div><div class="value">${num(ta,1)}<span style="font-size:13px;color:var(--text2)"> m²</span></div></div>

    <div class="grid2" style="align-items:start;margin-bottom:20px">
      <div class="card"><div class="section-title">By project</div>${tbl(['Project','Withdrawals','m','m²','Share'], byProj.map(([k,v])=>`<tr><td><strong>${esc(k)}</strong></td><td style="text-align:right">${v.n}</td><td style="text-align:right;color:var(--cyan);font-weight:700">${num(v.m)}</td><td style="text-align:right">${num(v.a)}</td><td style="text-align:right" class="muted">${pct(v.m)}</td></tr>`).join(''))}</div>
      <div class="card"><div class="section-title">By material</div>${tbl(['Material','Withdrawals','m','m²','Share'], byMat.map(([k,v])=>`<tr><td><strong>${esc(k)}</strong></td><td style="text-align:right">${v.n}</td><td style="text-align:right;color:var(--cyan);font-weight:700">${num(v.m)}</td><td style="text-align:right">${num(v.a)}</td><td style="text-align:right" class="muted">${pct(v.m)}</td></tr>`).join(''))}</div>
    </div>
    <div class="grid2" style="align-items:start;margin-bottom:20px">
      <div class="card"><div class="section-title">Parts produced</div>${partRows.length?tbl(['Part','Project','Qty','Withdrawals'], partRows.map(p=>`<tr><td><strong>${esc(p.name)}</strong>${p.pn?` <span class="dim">${esc(p.pn)}</span>`:''}</td><td style="text-align:right" class="muted">${esc(p.proj||'')}</td><td style="text-align:right;color:var(--cyan);font-weight:700">${p.q}</td><td style="text-align:right">${p.n}</td></tr>`).join('')):'<div class="empty">No parts recorded.</div>'}</div>
      <div class="card"><div class="section-title">By month</div>${tbl(['Month','Withdrawals','m','m²'], byMonth.map(([k,v])=>{ const [y,mo]=k.split('-'); return `<tr><td><strong>${new Date(y,mo-1,1).toLocaleString('en-GB',{month:'long',year:'numeric'})}</strong></td><td style="text-align:right">${v.n}</td><td style="text-align:right;color:var(--cyan);font-weight:700">${num(v.m)}</td><td style="text-align:right">${num(v.a)}</td></tr>`; }).join(''))}</div>
    </div>
    <div class="card"><div class="section-title">All withdrawals (${list.length})</div>${tbl(['Removed','Roll','Material','Project','Parts','m','Time out','By'], list.map(({r,u})=>`<tr class="clickrow" onclick="openRoll('${r.id}')"><td style="white-space:nowrap">${fmtDT(u.outAt)}</td><td style="text-align:right" class="serial">${esc(serialStr(r.serial))}</td><td style="text-align:right">${esc(r.material||'')}</td><td style="text-align:right">${esc(u.projectName||'')}</td><td style="text-align:right" class="muted">${esc(partsText(u.parts)||'—')}</td><td style="text-align:right;font-weight:700;color:var(--cyan)">${num(u.meters)}</td><td style="text-align:right;${u.inAt?'':'color:var(--amber)'}">${fmtDur(Math.max(0,(u.inAt?new Date(u.inAt):new Date())-new Date(u.outAt)))}</td><td style="text-align:right">${esc(userName(u.by))}</td></tr>`).join(''))}</div>`;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportCSV(){
  const q = v => '"' + String(v??'').replace(/"/g,'""') + '"';
  const rows = [['Roll serial','Material','Supplier','Supplier S/N','Width (mm)','Project','Parts','Linear meters','Area (m2)','Removed from cold storage','Returned to cold storage','Time out (h)','Recorded by','Remark']];
  filteredUsages().forEach(({r,u,area})=>rows.push([serialStr(r.serial),r.material,r.supplier,r.supplierSN,r.width,u.projectName,partsText(u.parts),u.meters,area.toFixed(3),u.outAt,u.inAt||'',(((u.inAt?new Date(u.inAt):new Date())-new Date(u.outAt))/3.6e6).toFixed(2),u.by,u.remark||'']));
  const csv = '\ufeff' + rows.map(r=>r.map(q).join(';')).join('\r\n');
  downloadBlob(new Blob([csv],{type:'text/csv'}), `roll-consumption-${toDateInput(nowISO())}.csv`);
}

        <div class="form-group" style="margin:0"><label class="req">Full name</label><input class="draft" id="nu-name" type="text" placeholder="Full name"></div>
        <div class="form-group" style="margin:0"><label class="req">Login</label><input class="draft" id="nu-login" type="text" placeholder="username"></div>
        <div class="form-group" style="margin:0"><label class="req">Password</label><input class="draft" id="nu-pass" type="password" placeholder="password"></div>
        <div class="form-group" style="margin:0"><label>Role</label><select id="nu-role"><option value="user">User</option><option value="admin">Administrator</option></select></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="addUser()">${svgIcon('plus')} Add user</button>
    </div>
    <div class="card">${users().map(u=>{ const ini=u.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); return `
      <div class="user-row">
        <div class="user-avatar" style="background:${u.role==='admin'?'var(--blue-dim)':'var(--cyan-dim)'};color:${u.role==='admin'?'var(--blue)':'var(--cyan)'}">${esc(ini)}</div>
        <div class="user-info"><div class="uname">${esc(u.name)} ${u.role==='admin'?'<span class="badge badge-blue" style="margin-left:4px">Admin</span>':''}</div><div class="uemail">@${esc(u.login)}${u.createdAt?' · since '+fmtDate(u.createdAt):''}</div></div>
        <div class="btn-group"><button class="btn btn-outline btn-sm" onclick="editUser('${u.id}')">${svgIcon('edit')} Edit</button>
        ${u.id!=='admin' && u.id!==state.currentUser.id?`<button class="btn btn-danger btn-sm" onclick="removeUser('${u.id}')">Remove</button>`:''}</div>
      </div>`;}).join('')}</div>`;
  return div;
}
async function addUser(){
  const g = id => document.getElementById(id)?.value?.trim()||'';
  const name=g('nu-name'), login=g('nu-login'), pass=document.getElementById('nu-pass').value, role=g('nu-role');
  if (!name||!login||!pass) { toast('Name, login and password are required.','error'); return; }
  const id = 'u-'+uid();
  const c = await commit(`Add user ${login}`, d=>{
    if (Object.values(d.users).some(u=>u.login.toLowerCase()===login.toLowerCase())) abort('Login already exists.');
    d.users[id] = { login, pass, name, role, createdAt:nowISO() };
  });
  if (c.ok) { ['nu-name','nu-login','nu-pass'].forEach(i=>document.getElementById(i).value=''); toast(`User ${name} added ✓`); render(); }
}
function editUser(id){
  const u = state.data.users[id];
  openModal(`<h3>Edit user</h3>
    <div class="form-group"><label>Full name</label><input type="text" id="eu-name" value="${esc(u.name)}"></div>
    <div class="form-group"><label>Login</label><input type="text" id="eu-login" value="${esc(u.login)}" ${id==='admin'?'disabled':''}></div>
    <div class="form-group"><label>New password <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:400">— leave empty to keep</span></label><input type="password" id="eu-pass"></div>
    <div class="form-group"><label>Role</label><select id="eu-role" ${id==='admin'||id===state.currentUser.id?'disabled':''}><option value="user" ${u.role==='user'?'selected':''}>User</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrator</option></select></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUserEdit('${id}')">Save</button></div>`);
}
async function saveUserEdit(id){
  const name = document.getElementById('eu-name').value.trim(), login = document.getElementById('eu-login').value.trim(), pass = document.getElementById('eu-pass').value;
  const role = document.getElementById('eu-role').value;
  if (!name || !login) { toast('Name and login are required.','error'); return; }
  closeModal();
  const ok = await commit(`Edit user ${login}`, d=>{
    const u = d.users[id]; if (!u) abort('This user no longer exists.');
    if (Object.entries(d.users).some(([k,x])=>k!==id && x.login.toLowerCase()===login.toLowerCase())) abort('Login already exists.');
    u.name=name; if (id!=='admin') u.login=login; if (pass) u.pass=pass;
    if (id!=='admin' && id!==state.currentUser.id) u.role=role;
  });
  if (ok.ok) { toast('User updated ✓'); render(); }
}
function removeUser(id){
  const u = state.data.users[id];
  confirmBox('Remove user', `<strong>${esc(u.name)}</strong> (@${esc(u.login)}) will no longer be able to sign in. Records they created are kept.`, async ()=>{ if (await deleteDoc('users', id, `Remove user ${u.login}`)) { toast('User removed'); render(); } }, 'Remove');
}
// ============================================================
// CHANGE PASSWORD
// ============================================================
function renderChangePassword(){
  const u = state.currentUser;
  const div = document.createElement('div');
  div.innerHTML = `<div class="page-header"><h2>Change Password</h2><p>Update your login password. You will need to use the new password on your next login.</p></div>
    <div class="card" style="max-width:420px">
      <div style="margin-bottom:20px;display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:var(--radius);background:var(--cyan-dim);border:1px solid var(--cyan-border);display:flex;align-items:center;justify-content:center;font-size:18px">🔒</div>
        <div><div style="font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:0.04em">${esc(u.name)}</div><div style="font-size:10px;color:var(--text3);margin-top:2px">@${esc(u.login)}</div></div>
      </div>
      <div class="form-group"><label>Current password</label><input type="password" id="cp-current" autocomplete="current-password"></div>
      <div class="form-group"><label>New password</label><input type="password" id="cp-new" autocomplete="new-password"></div>
      <div class="form-group"><label>Confirm new password</label><input type="password" id="cp-confirm" autocomplete="new-password"></div>
      <div id="cp-msg"></div>
      <button class="btn btn-primary" onclick="changePassword()">Update password</button>
    </div>`;
  return div;
}
async function changePassword(){
  const u = state.currentUser, msg = document.getElementById('cp-msg');
  const c = document.getElementById('cp-current').value, n = document.getElementById('cp-new').value, k = document.getElementById('cp-confirm').value;
  if (!c||!n||!k) return msg.innerHTML='<div class="alert alert-error">All fields are required.</div>';
  if (c !== u.pass) return msg.innerHTML='<div class="alert alert-error">Current password is incorrect.</div>';
  if (n !== k) return msg.innerHTML='<div class="alert alert-error">New passwords do not match.</div>';
  if (n.length < 4) return msg.innerHTML='<div class="alert alert-error">Use at least 4 characters.</div>';
  if (await mutate('users', u.id, `Change password for ${u.login}`, x=>{ x.pass=n; return x; })) { state.currentUser = state.data.users[u.id]; toast('Password updated ✓'); nav('dashboard'); }
}
// ============================================================
// GITHUB STORAGE (admin)
// ============================================================
function renderStorage(){
  const div = document.createElement('div');
  const tok = getToken();
  const size = state.store ? new Blob([JSON.stringify(state.store)]).size : 0;
  div.innerHTML = `
    <div class="page-header"><h2>GitHub Storage</h2><p>All Roll Tracker data is kept in one file in a private GitHub repository. Every save is a commit, so the full change history can be reviewed and restored in GitHub.</p></div>
    <div class="grid2" style="align-items:start">
      <div class="card">
        <div class="section-title">Connection</div>
        <div class="po-grid" style="grid-template-columns:1fr;margin-bottom:16px">
          <div class="po-field"><div class="key">Repository</div><div class="val">${esc(GH_OWNER)}/${esc(GH_REPO)} · branch ${esc(GH_BRANCH)}</div></div>
          <div class="po-field"><div class="key">Data file</div><div class="val">${esc(GH_FILE)} · ${num(size/1024,1)} kB</div></div>
          <div class="po-field"><div class="key">Last synced</div><div class="val">${fmtDT(state.lastSync)}${state.sha?` <span class="dim">· ${esc(state.sha.slice(0,7))}</span>`:''}</div></div>
          <div class="po-field"><div class="key">Status</div><div class="val" style="color:${state.ghError?'var(--amber)':'var(--green)'}">${esc(state.ghError||'Connected')}</div></div>
          <div class="po-field"><div class="key">Token on this computer</div><div class="val">${tok?esc(tok.slice(0,11))+'…'+esc(tok.slice(-4)):'—'}</div></div>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="testConnection()">${svgIcon('check')} Test connection</button>
          <button class="btn btn-outline btn-sm" onclick="downloadBackup()">${svgIcon('download')} Download backup (JSON)</button>
          <a class="btn btn-outline btn-sm" href="https://github.com/${GH_OWNER}/${GH_REPO}/commits/${GH_BRANCH}/${GH_FILE}" target="_blank" rel="noopener">View history on GitHub ↗</a>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Replace access token</div>
        <p class="muted" style="font-size:11px;margin-bottom:14px;line-height:1.7">Use this when the token expires or is renewed. The token is stored only in this browser; each computer enters it once at login.</p>
        <div class="form-group"><label>New GitHub access token</label><input type="password" id="st-token" placeholder="github_pat_xxxxxxxx" autocomplete="off"></div>
        <div id="st-msg"></div>
        <button class="btn btn-primary btn-sm" onclick="replaceToken()">Save &amp; test</button>
      </div>
    </div>`;
  return div;
}
async function testConnection(){
  const r = await pull();
  if (r.ok) { toast('GitHub connection OK ✓'); render(); } else { toast(r.error,'error',7000); render(); }
}
async function replaceToken(){
  const el = document.getElementById('st-token'); const t = el.value.trim(); const msg = document.getElementById('st-msg');
  if (!t) { msg.innerHTML = '<div class="alert alert-error">Paste the new token first.</div>'; return; }
  const old = getToken(); setToken(t);
  const r = await pull();
  if (!r.ok) { setToken(old); msg.innerHTML = `<div class="alert alert-error">${esc(r.error)} The previous token was kept.</div>`; state.ghError = null; return; }
  el.value=''; toast('Token saved and tested ✓'); render();
}
function downloadBackup(){
  if (!state.store) return;
  downloadBlob(new Blob([JSON.stringify(state.store, null, 1)], {type:'application/json'}), `roll_data-backup-${toDateInput(nowISO())}.json`);
}

// ============================================================
// SVG ICONS
// ============================================================
function svgIcon(name){
  const paths = {
    grid:'<rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
    roll:'<ellipse cx="4.5" cy="8" rx="2.5" ry="5.5"/><path d="M4.5 2.5h7c1.4 0 2.5 2.5 2.5 5.5s-1.1 5.5-2.5 5.5h-7"/><ellipse cx="4.5" cy="8" rx="0.8" ry="1.8"/>',
    plus:'<path d="M8 3v10M3 8h10"/>',
    folder:'<path d="M2 4a1 1 0 011-1h3l1.5 1.5H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1V4z"/>',
    chart:'<path d="M2 12l4-4 3 3 5-7"/><path d="M2 14h12"/>',
    users:'<circle cx="8" cy="5" r="3"/><path d="M2 14a6 6 0 0112 0"/>',
    key:'<circle cx="5" cy="10" r="3"/><path d="M7.2 7.8L13 2M11 4l2 2M9.5 5.5l1.5 1.5"/>',
    logout:'<path d="M6 3H3a1 1 0 00-1 1v8a1 1 0 001 1h3M11 10l3-2-3-2M14 8H7"/>',
    check:'<path d="M2 8l4 4 8-8"/>',
    edit:'<path d="M11 2.5l2.5 2.5L6 12.5H3.5V10L11 2.5z"/>',
    trash:'<path d="M3 4h10M6 4V2.5h4V4M4.5 4l.7 9.5h5.6l.7-9.5"/>',
    archive:'<path d="M2 4a1 1 0 011-1h10a1 1 0 011 1v1a1 1 0 01-1 1H3a1 1 0 01-1-1V4z"/><path d="M3 6v7a1 1 0 001 1h8a1 1 0 001-1V6"/><path d="M6.5 9h3"/>',
    snow:'<path d="M8 1.5v13M2.4 4.8l11.2 6.4M2.4 11.2l11.2-6.4M6 2.8l2 1.5 2-1.5M6 13.2l2-1.5 2 1.5"/>',
    settings:'<circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.5 3.5l1.5 1.5M11 11l1.5 1.5M3.5 12.5l1.5-1.5M11 5l1.5-1.5"/>',
    download:'<path d="M2 10v3a1 1 0 001 1h10a1 1 0 001-1v-3M8 2v8M5 7l3 3 3-3"/>',
  };
  return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths[name]||''}</svg>`;
}

// ============================================================
// INIT
// ============================================================
async function startup(){
  loadCache();
  render();
  if (!ghConfigured()) return;
  const btn = document.getElementById('login-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⟳ Syncing with GitHub…'; }
  const r = await pull();
  let sid = null; try { sid = localStorage.getItem(SESSION_KEY); } catch(e) {}
  if (sid && (r.ok || (r.network && state.store)) && !r.notFound && state.data.users[sid]) {
    state.loggedIn = true; state.currentUser = state.data.users[sid];
    if (!r.ok) toast('GitHub is unreachable — showing this computer’s last synced data.','error',8000);
  }
  render();
}
startup();
</script>
