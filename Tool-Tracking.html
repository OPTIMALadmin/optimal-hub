<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Tracking — OPTIMAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#0f1117;--surface:#181c24;--surface2:#1e2330;--surface3:#252b38;--border:#2a3040;--border2:#3a4255;
  --text:#e0e6f0;--text2:#8a95a8;--text3:#5a6578;
  --cyan:#00d4aa;--cyan-dim:rgba(0,212,170,0.12);--cyan-border:rgba(0,212,170,0.3);
  --green:#39d353;--green-dim:rgba(57,211,83,0.1);--green-border:rgba(57,211,83,0.3);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.1);--amber-border:rgba(245,166,35,0.3);
  --red:#e05252;--red-dim:rgba(224,82,82,0.1);--red-border:rgba(224,82,82,0.3);
  --blue:#4a9eff;--blue-dim:rgba(74,158,255,0.1);--blue-border:rgba(74,158,255,0.3);
  --radius:4px;--radius-lg:6px;
  --shadow-lg:0 8px 32px rgba(0,0,0,0.5);
  --font:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --top:70px;--safe-top:env(safe-area-inset-top,0px);
}
html{scroll-padding-top:calc(var(--top) + env(safe-area-inset-top,0px))}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;min-height:100%;line-height:1.5}
.app{display:flex;min-height:100vh;flex-direction:column}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* Top bar */
.topbar{height:calc(var(--top) + var(--safe-top));padding:var(--safe-top) 24px 0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;position:fixed;top:0;left:0;right:0;z-index:200}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--text);white-space:nowrap}
.topbar-title span{color:var(--cyan)}
.topbar-sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.topbar-user{font-size:11px;color:var(--text2);letter-spacing:0.05em;white-space:nowrap}
.topbar-user strong{color:var(--cyan);font-weight:500}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.conn{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--text2);white-space:nowrap}
.conn i{width:7px;height:7px;border-radius:50%;display:inline-block}
.menu-btn{display:none;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius);width:34px;height:34px;align-items:center;justify-content:center;cursor:pointer}
.menu-btn svg{width:16px;height:16px}

.app-body{display:flex;margin-top:calc(var(--top) + var(--safe-top));min-height:calc(100vh - var(--top))}

/* Sidebar */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:calc(var(--top) + var(--safe-top));bottom:0;left:0;z-index:100;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sidebar-user{padding:16px 18px;border-bottom:1px solid var(--border)}
.sidebar-user .name{font-size:12px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.06em}
.sidebar-user .role{font-size:10px;color:var(--cyan);margin-top:3px;letter-spacing:0.06em}
nav{flex:1;padding:8px 0}
nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--text2);text-decoration:none;font-size:11px;cursor:pointer;transition:all 0.12s;border:none;background:none;width:100%;text-align:left;font-family:var(--font);letter-spacing:0.06em;text-transform:uppercase;border-left:2px solid transparent}
nav a:hover{background:var(--surface2);color:var(--text);border-left-color:var(--border2)}
nav a.active{background:var(--cyan-dim);color:var(--cyan);border-left-color:var(--cyan)}
nav a svg{width:14px;height:14px;flex-shrink:0}
.nav-count{margin-left:auto;border-radius:2px;padding:0 5px;font-size:9px;font-weight:700;color:#0f1117}
.nav-section{padding:14px 18px 4px;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-top:4px}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--border)}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 12px;border-radius:var(--radius);cursor:pointer;font-size:10px;font-family:var(--font);width:100%;text-align:left;transition:all 0.12s;display:flex;align-items:center;gap:8px;letter-spacing:0.06em;text-transform:uppercase}
.logout-btn svg{width:13px;height:13px}
.logout-btn:hover{border-color:var(--red-border);color:var(--red);background:var(--red-dim)}

/* Main */
.main{margin-left:220px;flex:1;padding:28px 32px 48px;min-width:0;max-width:calc(100vw - 220px)}
.page-header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-header .ph-text{flex:1;min-width:220px}
.page-header h2{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text)}
.page-header h2 .code{color:var(--cyan)}
.page-header p{color:var(--text2);margin-top:4px;font-size:11px;letter-spacing:0.04em}
.crumbs{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--text2);cursor:pointer;text-decoration:none}
.crumbs a:hover{color:var(--cyan)}

/* Login */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);flex-direction:column;padding:90px 16px 40px}
.login-topbar{width:100%;background:var(--surface);border-bottom:1px solid var(--border);padding:calc(14px + var(--safe-top)) 32px 14px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0}
.login-topbar-left{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text)}
.login-topbar-left span{color:var(--cyan)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;width:380px;max-width:100%}
.login-logo-wrap{text-align:center;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.login-logo-wrap h1{font-size:12px;font-weight:600;color:var(--text2);margin-top:14px;letter-spacing:0.12em;text-transform:uppercase}

/* Forms */
.form-group{margin-bottom:16px}
label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--surface2);color:var(--text);transition:border-color 0.12s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-dim)}
input::-webkit-calendar-picker-indicator{filter:invert(0.7)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input[type=checkbox]{width:auto;margin-right:6px;accent-color:var(--cyan)}
.hint{font-size:10px;color:var(--text3);margin-top:5px;letter-spacing:0.02em;text-transform:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.sn-input{font-size:18px!important;padding:12px 14px!important;letter-spacing:0.06em;color:var(--cyan)!important;font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.12s;text-decoration:none;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-primary{background:var(--cyan);color:#0f1117;border-color:var(--cyan)}.btn-primary:hover{background:#00bfa0}
.btn-success{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}.btn-success:hover{background:var(--green);color:#0f1117}
.btn-danger{background:var(--red-dim);color:var(--red);border-color:var(--red-border)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.btn-amber{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-border)}.btn-amber:hover{background:var(--amber);color:#0f1117}
.btn-sm{padding:5px 10px;font-size:10px}
.btn:disabled{opacity:0.3;cursor:not-allowed}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{background:transparent;border:1px solid transparent;color:var(--text3);cursor:pointer;border-radius:var(--radius);width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:12px;height:12px}
.icon-btn:hover{color:var(--red);border-color:var(--red-border);background:var(--red-dim)}

/* Cards / stats */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--cyan);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-title .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;font-weight:600}
.stat-card .value{font-size:28px;font-weight:700;letter-spacing:-0.02em;color:var(--text);line-height:1.1}
.stat-card .value small{font-size:13px;color:var(--text3);font-weight:500;letter-spacing:0}
.stat-card .sub{font-size:10px;color:var(--text2);margin-top:6px}
.section{margin-bottom:24px}
.section-title{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:var(--cyan);margin-bottom:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);font-weight:600;white-space:nowrap;background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
tr.click{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:2px;font-size:10px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:0.06em;border:1px solid}
.badge-blue{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-border)}
.badge-green{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}
.badge-amber{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-border)}
.badge-red{background:var(--red-dim);color:var(--red);border-color:var(--red-border)}
.badge-gray{background:var(--surface3);color:var(--text2);border-color:var(--border)}
.badge-cyan{background:var(--cyan-dim);color:var(--cyan);border-color:var(--cyan-border)}

/* Progress meters */
.meter{display:flex;align-items:center;gap:8px;min-width:140px}
.meter .track{flex:1;height:6px;background:var(--surface3);border-radius:1px;overflow:hidden;position:relative}
.meter .fill{height:100%;background:var(--green)}
.meter .tick{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--text3)}
.meter .txt{font-size:10px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.meter-block{margin-bottom:14px}
.meter-block .mhead{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em}
.meter-block .meter .track{height:10px}

/* Alerts */
.alert{padding:11px 14px;border-radius:var(--radius);font-size:11px;margin-bottom:16px;line-height:1.6;border:1px solid}
.alert-success{background:var(--green-dim);color:var(--green);border-color:var(--green-border)}
.alert-error{background:var(--red-dim);color:var(--red);border-color:var(--red-border)}
.alert-info{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-border)}
.alert-warning{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-border)}

/* Project grid */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.proj-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:var(--radius-lg);padding:18px;cursor:pointer;transition:border-color 0.12s,background 0.12s;text-align:left;font-family:var(--font);color:var(--text);width:100%}
.proj-card:hover{background:var(--surface2);border-color:var(--cyan-border);border-left-color:var(--cyan)}
.proj-card.closed{border-left-color:var(--text3);opacity:0.7}
.proj-card .pc-code{font-size:10px;color:var(--cyan);letter-spacing:0.1em;font-weight:600}
.proj-card .pc-name{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin:4px 0 6px}
.proj-card .pc-desc{font-size:11px;color:var(--text2);min-height:16px;margin-bottom:14px;line-height:1.5}
.proj-card .pc-stats{display:flex;gap:18px;border-top:1px solid var(--border);padding-top:12px;align-items:flex-end}
.proj-card .pc-stats div{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em}
.proj-card .pc-stats b{display:block;font-size:18px;color:var(--text);letter-spacing:-0.01em;margin-top:2px}

/* Production record cards */
.part-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.part-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 12px 10px;position:relative}
.part-card .pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.part-card .cyc{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase}
.sn-box{background:var(--surface2);border:1px solid var(--cyan-border);border-radius:var(--radius);padding:14px;font-size:22px;font-weight:700;color:var(--cyan);letter-spacing:0.08em;text-align:center;word-break:break-all}
.part-card .op{font-size:11px;color:var(--text);margin-top:4px;font-weight:600;letter-spacing:0.04em}
.part-card .sn{font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:0.04em;word-break:break-all}
.part-card .when{font-size:11px;color:var(--text);margin-top:6px}
.part-card .who{font-size:10px;color:var(--text3);margin-top:2px}
.part-card .note{font-size:10px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);white-space:pre-wrap}
.part-card.maint{background:var(--amber-dim);border-color:var(--amber-border)}
.part-card.maint .sn{color:var(--amber);font-size:12px;word-break:normal}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{max-width:260px}

/* Timeline */
.timeline-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.timeline-item:last-child{border-bottom:none}
.timeline-dot{width:28px;height:28px;border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border);background:var(--surface2);color:var(--cyan)}
.timeline-dot svg{width:13px;height:13px}
.timeline-body .who{font-size:11px;font-weight:600;color:var(--text);letter-spacing:0.02em}
.timeline-body .when{font-size:10px;color:var(--text3);margin-top:2px}

/* Chart */
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:18px;border-bottom:1px solid var(--border)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:18px}
.bars .b .col{width:100%;background:var(--cyan);opacity:0.85;border-radius:1px 1px 0 0;min-height:1px}
.bars .b .v{font-size:9px;color:var(--text2);margin-bottom:4px}
.bar-labels{display:flex;gap:6px;margin-top:6px}
.bar-labels span{flex:1;min-width:18px;text-align:center;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em}

/* Users */
.user-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.user-row:last-child{border-bottom:none}
.user-avatar{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid var(--cyan-border);background:var(--cyan-dim);color:var(--cyan)}
.user-info{flex:1;min-width:160px}
.user-info .uname{font-size:12px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:0.04em}
.user-info .ulogin{font-size:10px;color:var(--text3);margin-top:2px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:flex-start;justify-content:center;z-index:999;padding:calc(40px + var(--safe-top)) 16px 40px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;width:520px;max-width:100%;box-shadow:var(--shadow-lg);animation:pop 0.14s ease}
.modal.wide{width:640px}
.modal h3{font-size:13px;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cyan)}
.modal .modal-desc{color:var(--text2);font-size:11px;margin-bottom:18px;line-height:1.7}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* Toast */
#toast{position:fixed;top:calc(78px + var(--safe-top));right:20px;z-index:9999;pointer-events:none}
.toast-item{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:var(--radius);font-size:11px;margin-bottom:7px;box-shadow:var(--shadow-lg);animation:slideIn 0.15s ease;max-width:320px;line-height:1.5;letter-spacing:0.03em}
.toast-item.success{border-color:var(--green-border);color:var(--green);background:#14231b}
.toast-item.error{border-color:var(--red-border);color:var(--red);background:#2a1719}
.toast-item.warn{border-color:var(--amber-border);color:var(--amber);background:#2a2214}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{opacity:1}to{opacity:0;transform:translateX(110%)}}

.empty{color:var(--text3);text-align:center;padding:28px 16px;font-size:12px;line-height:1.7}
.muted{color:var(--text3)}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:1000px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
}
@media(max-width:760px){
  .menu-btn{display:inline-flex}
  .topbar{padding-left:14px;padding-right:14px;gap:12px}
  .topbar-sep,.topbar-user,.topbar-logo{display:none}
  .topbar-title{font-size:13px}
  .sidebar{transform:translateX(-100%);transition:transform 0.18s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0;max-width:100vw;padding:20px 14px 40px}
  .grid2,.grid3{grid-template-columns:1fr}
  .toolbar input{max-width:none}
}
</style>
</head>
<body>
<div id="toast"></div>
<div id="root"></div>
<div id="modal-root"></div>
<script>
// ============================================================

// ============================================================
// GITHUB STORAGE BACKEND
// Same approach as the PO Approval tool: owner/repo/branch are embedded,
// only the Personal Access Token (PAT) is stored per browser.
// ============================================================
const GH_OWNER     = 'optimaladmin';
const GH_REPO      = 'Tool-Tracker';
const GH_BRANCH    = 'main';
const GH_DATA_FILE = 'tool_tracking_data.json';
const GH_TOKEN_KEY = 'tt_gh_token';
const POLL_MS      = 60000;   // refresh from GitHub every minute while the page is open

function ghToken() { try { return localStorage.getItem(GH_TOKEN_KEY) || ''; } catch (e) { return ''; } }
function ghSetToken(t) { try { if (t) localStorage.setItem(GH_TOKEN_KEY, t); else localStorage.removeItem(GH_TOKEN_KEY); } catch (e) {} }
function ghConfigured() { return !!ghToken(); }
function ghHeaders() {
  return { 'Authorization': `token ${ghToken()}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
}
function ghContentsUrl() { return `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_DATA_FILE}`; }
function b64ToUtf8(b64) {
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function ghErr(status, text) {
  if (status === 401) return 'GitHub rejected the token (401). Check the token in Admin → GitHub.';
  if (status === 403) return 'GitHub refused access (403). The token needs Contents read/write on ' + GH_OWNER + '/' + GH_REPO + '.';
  if (status === 404) return 'Repository ' + GH_OWNER + '/' + GH_REPO + ' not found, or the token cannot see it.';
  return `GitHub error ${status}${text ? ': ' + text.slice(0, 120) : ''}`;
}

// Read the data file. Returns {data, sha}; data is null when the file doesn't exist yet. Throws on failure.
async function ghRead() {
  let r;
  try { r = await fetch(`${ghContentsUrl()}?ref=${GH_BRANCH}&t=${Date.now()}`, { headers: ghHeaders(), cache: 'no-store' }); }
  catch (e) { throw new Error('Cannot reach GitHub. Check the internet connection.'); }
  if (r.status === 404) {
    // distinguish "file missing" from "repo missing / no access"
    const rr = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, { headers: ghHeaders() }).catch(() => null);
    if (rr && rr.ok) return { data: null, sha: null };
    throw new Error(ghErr(404));
  }
  if (!r.ok) throw new Error(ghErr(r.status, await r.text().catch(() => '')));
  const meta = await r.json();
  let raw = meta.content && meta.content.trim() ? meta.content : null;
  if (!raw) { // files over 1 MB come back without content: read the blob instead
    const br = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/git/blobs/${meta.sha}`, { headers: ghHeaders() });
    if (!br.ok) throw new Error(ghErr(br.status));
    raw = (await br.json()).content;
  }
  return { data: JSON.parse(b64ToUtf8(raw)), sha: meta.sha };
}

// Write the data file. Returns new sha; throws {conflict:true} when someone else saved first.
async function ghWrite(obj, sha, message) {
  const body = { message, content: utf8ToB64(JSON.stringify(obj, null, 1)), branch: GH_BRANCH };
  if (sha) body.sha = sha;
  let r;
  try { r = await fetch(ghContentsUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) }); }
  catch (e) { throw new Error('Cannot reach GitHub. Check the internet connection.'); }
  if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (!r.ok) throw new Error(ghErr(r.status, await r.text().catch(() => '')));
  return (await r.json()).content.sha;
}

function normalise(d) {
  const o = {}; COLS.forEach(c => { o[c] = Array.isArray(d && d[c]) ? d[c] : []; });
  // which default accounts were already created (so a deleted one is not re-created)
  o.seeded = Array.isArray(d && d.seeded) ? d.seeded : (o.users.length ? ['admin','user1'] : []);
  return o;
}
// Add any default account that was never created before
function seedUsers(d) {
  const done = new Set(d.seeded || []);
  INITIAL_USERS.forEach(u => {
    if (done.has(u.id)) return;
    if (!d.users.some(x => x.id === u.id || (x.login||'').toLowerCase() === u.login.toLowerCase())) d.users.push(JSON.parse(JSON.stringify(u)));
    done.add(u.id);
  });
  d.seeded = [...done];
}

const Store = {
  sha: null, queue: Promise.resolve(), busy: 0,
  init() {
    try { const s = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); Object.assign(data, normalise(s)); this.sha = s._sha || null; } catch (e) {}
    state.mode = ghConfigured() ? 'github' : 'local';
    markReady();
    if (ghConfigured()) this.pull(true);
    setInterval(() => {
      if (document.visibilityState === 'visible' && state.loggedIn && ghConfigured() && !this.busy) this.pull(true);
    }, POLL_MS);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.loggedIn && ghConfigured() && !this.busy) this.pull(true);
    });
  },
  saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Object.assign({ _sha: this.sha }, data))); }
    catch (e) { console.warn('[cache] localStorage write failed', e); }
  },
  apply(d) { COLS.forEach(c => { data[c] = d[c]; }); data.seeded = d.seeded || []; this.saveLocal(); },
  // Fetch the latest data from GitHub. quiet = no toast on success.
  async pull(quiet) {
    if (!ghConfigured()) return false;
    state.syncing = true; updateSyncBadge();
    try {
      const r = await ghRead();
      if (r.data) { this.sha = r.sha; this.apply(normalise(r.data)); }
      state.mode = 'github'; state.syncError = ''; state.lastSync = new Date();
      if (!quiet) toast('Synced with GitHub.');
      return true;
    } catch (e) {
      state.mode = 'error'; state.syncError = e.message;
      if (!quiet) toast(e.message, 'error', 7000);
      return false;
    } finally {
      state.syncing = false; onData();
    }
  },
  // Apply a change: read latest from GitHub, apply, write back; retry on conflict.
  mutate(fn, message) {
    const job = async () => {
      this.busy++;
      try {
        if (!ghConfigured()) { // local only
          const d = normalise(JSON.parse(JSON.stringify(data)));
          seedUsers(d);
          fn(d); this.apply(d); onData(); return true;
        }
        state.syncing = true; updateSyncBadge();
        for (let attempt = 1; attempt <= 5; attempt++) {
          try {
            const remote = await ghRead();
            const d = remote.data ? normalise(remote.data) : normalise(JSON.parse(JSON.stringify(data)));
            seedUsers(d);
            fn(d);
            const by = state.currentUser ? ` (${state.currentUser.login})` : '';
            this.sha = await ghWrite(d, remote.sha, ((typeof message === 'function' ? message() : message) || 'Tool tracking update') + by);
            this.apply(d);
            state.mode = 'github'; state.syncError = ''; state.lastSync = new Date();
            return true;
          } catch (e) {
            if (e.conflict && attempt < 5) { await sleep(300 + Math.random() * 700); continue; }
            throw e;
          }
        }
      } catch (e) {
        console.error('[GH]', e);
        state.mode = 'error'; state.syncError = e.message;
        toast('Not saved. ' + (e.conflict ? 'Too many people saving at once. Try again.' : e.message), 'error', 8000);
        return false;
      } finally {
        this.busy--; state.syncing = false; onData();
      }
    };
    const p = this.queue.then(job, job);
    this.queue = p.catch(() => {});
    return p;
  },
  put(col, obj, message) {
    const body = JSON.parse(JSON.stringify(obj));
    return this.mutate(d => {
      const i = d[col].findIndex(x => x.id === body.id);
      if (i >= 0) d[col][i] = body; else d[col].push(body);
    }, message);
  },
  del(col, id, message) {
    return this.mutate(d => { d[col] = d[col].filter(x => x.id !== id); }, message);
  },
};

// TOOL ANALYTICS
// ============================================================
// true when part p was produced after maintenance m (ties broken by entry time)
function after(p, m) { return p.producedAt > m.performedAt || (p.producedAt === m.performedAt && (p.createdAt||'') > (m.createdAt||'')); }
// ---- Facility access ----
// Administrators see every facility. A user sees only the facilities the administrator ticked
// (accounts saved before facilities existed keep full access until the admin edits them).
function userFacilities(u) {
  if (!u) return [];
  if (u.role === 'admin') return FACILITIES.slice();
  return Array.isArray(u.facilities) ? u.facilities.filter(f => FACILITIES.includes(f)) : FACILITIES.slice();
}
function canSeeTool(t) { return !!t && (isAdmin() || (!!t.facility && userFacilities(state.currentUser).includes(t.facility))); }
function visTools() { return data.tools.filter(canSeeTool); }
function visParts() { const ids = new Set(visTools().map(t => t.id)); return data.parts.filter(p => ids.has(p.toolId)); }
function visProjects() { if (canManage()) return data.projects.slice(); const ids = new Set(visTools().map(t => t.projectId)); return data.projects.filter(p => ids.has(p.id)); }
// ---- Serial number allocation (moulds) ----
// Format: 5-digit project number + company code + 2-digit year + 3-digit sequence, e.g. 00014HV26001.
// The sequence restarts each year and is counted per project and company.
const FAC_CODE = { OSS:'OS', OHV:'HV', OMAR:'MA' };
function isMould(t) { return !!t && t.type === 'Mould'; }
function projectNumber(p) { return p && /^\d{1,5}$/.test(String(p.number || '')) ? String(p.number).padStart(5, '0') : ''; }
function mouldBlock(t) {
  if (!projectNumber(data.projects.find(x => x.id === t.projectId))) return 'This project has no project number, so serial numbers cannot be allocated. The administrator must add the 5-digit project number in Edit project.';
  if (!FAC_CODE[t.facility]) return 'This mould has no facility, so serial numbers cannot be allocated. The administrator must set it in Edit tool.';
  return '';
}
function nextSN(t, year, d = data) {
  const pn = projectNumber(d.projects.find(x => x.id === t.projectId));
  const cc = FAC_CODE[t.facility];
  if (!pn || !cc) return { error: 'Serial number cannot be allocated: project number or facility missing.' };
  const prefix = pn + cc + String(year % 100).padStart(2, '0');
  const re = new RegExp('^' + prefix + '(\\d{3})$');
  let max = 0;
  d.parts.forEach(p => { const r = re.exec(p.sn || ''); if (r) max = Math.max(max, +r[1]); });
  if (max >= 999) return { error: `All 999 serial numbers for ${prefix} are used.` };
  return { sn: prefix + String(max + 1).padStart(3, '0') };
}
function facBadge(f) { return f ? `<span class="badge badge-blue">${esc(f)}</span>` : `<span class="badge badge-red" title="Assign a facility so users can see this tool">No facility</span>`; }

// A mandrel's uses are the mould parts it was ticked on
function partsOf(toolId) { return data.parts.filter(p => p.toolId === toolId || (Array.isArray(p.mandrelIds) && p.mandrelIds.includes(toolId))); }
function isMandrel(t) { return !!t && t.type === 'Mandrel'; }
function mandrelsOf(mouldId) { return data.tools.filter(x => isMandrel(x) && x.mouldId === mouldId).sort((a,b) => (a.code||'').localeCompare(b.code||'')); }
function toolCode(id) { const x = data.tools.find(y => y.id === id); return x ? x.code : '—'; }
function maintOf(toolId) { return data.maint.filter(m => m.toolId === toolId).sort((a,b) => (b.performedAt||'').localeCompare(a.performedAt||'')); }

function toolStats(t) {
  const parts = partsOf(t.id).slice().sort((a,b) => (a.producedAt||'').localeCompare(b.producedAt||''));
  const total = parts.length;
  const maint = maintOf(t.id);
  const lastReset = maint.find(m => m.resets !== false);
  const since = lastReset ? parts.filter(p => after(p, lastReset)).length : total;
  const baseDate = lastReset ? lastReset.performedAt : (t.inServiceAt || (parts[0] && parts[0].producedAt) || t.createdAt);
  const daysSince = baseDate ? Math.max(0, (Date.now() - new Date(baseDate).getTime()) / 864e5) : 0;
  const lastUse = total ? parts[total-1].producedAt : null;
  const firstUse = total ? parts[0].producedAt : null;
  const cutoff = new Date(Date.now() - 30*864e5).toISOString();
  const last30 = parts.filter(p => p.producedAt >= cutoff).length;
  // Use the last 30 days rate; if quiet, fall back to the lifetime average
  let rate = last30 / 30;
  if (!rate && total > 1) {
    const span = (new Date(lastUse) - new Date(firstUse)) / 864e5;
    rate = span > 0 ? total / span : 0;
  }
  // Average parts between counter-resetting maintenance events
  const resets = maint.filter(m => m.resets !== false).slice().reverse();
  const intervals = []; let prev = null;
  resets.forEach(r => { intervals.push(parts.filter(p => (!prev || after(p, prev)) && !after(p, r)).length); prev = r; });
  const avgInterval = intervals.length ? intervals.reduce((a,b)=>a+b,0) / intervals.length : null;

  let forecast = null;
  if (t.maintCycles > 0 && rate > 0) {
    const remaining = Math.max(0, t.maintCycles - since);
    forecast = new Date(Date.now() + (remaining / rate) * 864e5).toISOString();
  }
  if (t.maintDays > 0 && baseDate) {
    const byDays = new Date(new Date(baseDate).getTime() + t.maintDays * 864e5).toISOString();
    if (!forecast || byDays < forecast) forecast = byDays;
  }
  const st = { total, since, daysSince, lastUse, firstUse, last30, rate, maintCount: maint.length, lastMaint: maint[0] || null, avgInterval, forecast };
  st.status = toolStatus(t, st);
  return st;
}

function toolStatus(t, s) {
  if (t.status === 'retired') return { lvl:-1, label:'Retired', cls:'gray', reasons:['Tool retired from service'] };
  const warn = (t.warnPct || 80) / 100;
  let lvl = 0; const reasons = [];
  const bump = (l, r) => { lvl = Math.max(lvl, l); reasons.push(r); };
  if (t.maintCycles > 0) {
    if (s.since >= t.maintCycles) bump(2, `Maintenance overdue: ${s.since} parts since last maintenance (interval ${t.maintCycles})`);
    else if (s.since >= t.maintCycles * warn) bump(1, `Maintenance due in ${t.maintCycles - s.since} parts`);
  }
  if (t.maintDays > 0) {
    const d = Math.floor(s.daysSince);
    if (d >= t.maintDays) bump(2, `Maintenance overdue: ${d} days since last maintenance (interval ${t.maintDays} days)`);
    else if (d >= t.maintDays * warn) bump(1, `Maintenance due in ${t.maintDays - d} days`);
  }
  if (t.lifeCycles > 0) {
    if (s.total >= t.lifeCycles) bump(3, `Expected tool life reached: ${s.total} of ${t.lifeCycles} parts`);
    else if (s.total >= t.lifeCycles * 0.9) bump(1, `Approaching end of life: ${s.total} of ${t.lifeCycles} parts`);
  }
  const map = { 0:['OK','green'], 1:['Due soon','amber'], 2:['Overdue','red'], 3:['End of life','red'] };
  return { lvl, label: map[lvl][0], cls: map[lvl][1], reasons };
}

function alertTools() {
  return visTools().map(t => ({ t, s: toolStats(t) })).filter(x => x.s.status.lvl >= 1)
    .sort((a,b) => b.s.status.lvl - a.s.status.lvl);
}
function projectName(id) { const p = data.projects.find(x => x.id === id); return p ? p.name : '—'; }

function meter(value, max, warnPct, label) {
  if (!max) return `<span class="muted" style="font-size:10px">${label ?? value} · limit not set</span>`;
  const r = value / max; const w = Math.min(100, r * 100);
  const col = r >= 1 ? 'var(--red)' : r >= (warnPct||80)/100 ? 'var(--amber)' : 'var(--green)';
  return `<div class="meter"><div class="track"><div class="fill" style="width:${w}%;background:${col}"></div><div class="tick" style="left:${warnPct||80}%"></div></div><span class="txt">${label ?? (value + ' / ' + max)}</span></div>`;
}

      <h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}
    </div>
    ${actions ? `<div class="btn-group">${actions}</div>` : ''}
  </div>`;
}
function wireCrumbs(root) {
  root.querySelectorAll('[data-crumb]').forEach(a => a.onclick = () => { const n = JSON.parse(a.dataset.crumb); nav(n.page, n); });
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const u = state.currentUser;
  const activeProjects = visProjects().filter(p => p.status !== 'closed').length;
  const activeTools = visTools().filter(t => t.status !== 'retired').length;
  const vParts = visParts();
  const weekAgo = new Date(Date.now() - 7*864e5).toISOString();
  const thisWeek = vParts.filter(p => p.producedAt >= weekAgo).length;
  const alerts = alertTools();
  const overdue = alerts.filter(a => a.s.status.lvl >= 2).length;

  const div = el(`<div>
    ${header(`Welcome back, ${esc(u.name.split(' ')[0])}`, new Date().toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'}), [],
      `<button class="btn btn-primary" id="quick-part">${svgIcon('plus')} Register part</button>`)}
    <div class="stats-row">
      <div class="stat-card"><div class="label">Active projects</div><div class="value">${activeProjects}</div></div>
      <div class="stat-card"><div class="label">Tools in service</div><div class="value">${activeTools}</div></div>
      <div class="stat-card"><div class="label">Parts recorded</div><div class="value" style="color:var(--cyan)">${vParts.length}</div><div class="sub">${thisWeek} in the last 7 days</div></div>
      <div class="stat-card"><div class="label">Maintenance alerts</div><div class="value" style="color:${overdue ? 'var(--red)' : alerts.length ? 'var(--amber)' : 'var(--green)'}">${alerts.length}</div><div class="sub">${overdue} overdue or end of life</div></div>
    </div>
    <div class="split">
      <div class="card" style="padding:0" id="dash-alerts"></div>
      <div class="card" id="dash-recent"></div>
    </div>
  </div>`);
  div.querySelector('#quick-part').onclick = () => openRegisterPart(null);

  const ac = div.querySelector('#dash-alerts');
  ac.innerHTML = `<div class="card-title" style="padding:18px 20px 0">Tools needing attention</div>`;
  if (!alerts.length) ac.appendChild(el(`<div class="empty">All tools are within their maintenance intervals.</div>`));
  else ac.appendChild(alertTable(alerts.slice(0, 8)));

  const rc = div.querySelector('#dash-recent');
  rc.innerHTML = `<div class="card-title">Latest production</div>`;
  const recent = vParts.slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, 8);
  if (!recent.length) rc.appendChild(el(`<div class="empty">No parts recorded yet. Open a project, choose a tool and register the first part.</div>`));
  else {
    const tl = document.createElement('div');
    recent.forEach(p => {
      const t = data.tools.find(x => x.id === p.toolId);
      const item = el(`<div class="timeline-item" style="cursor:pointer">
        <div class="timeline-dot">${svgIcon('part')}</div>
        <div class="timeline-body"><div class="who">SN ${esc(p.sn)}</div>
        <div class="when">${esc(t ? t.code : '—')} · ${esc(projectName(p.projectId))}</div>
        <div class="when">${fmtDateTime(p.producedAt)} · ${esc(userName(p.createdBy))}</div></div></div>`);
      if (t) item.onclick = () => nav('tool', { projectId: t.projectId, toolId: t.id });
      tl.appendChild(item);
    });
    rc.appendChild(tl);
  }
  return div;
}

function alertTable(list) {
  const wrap = el(`<div class="table-wrap"><table><thead><tr><th>Status</th><th>Tool</th><th>Facility</th><th>Project</th><th>Since maintenance</th><th>Reason</th></tr></thead><tbody></tbody></table></div>`);
  const tb = wrap.querySelector('tbody');
  list.forEach(({ t, s }) => {
    const tr = el(`<table><tr class="click">
      <td><span class="badge badge-${s.status.cls}">${s.status.label}</span></td>
      <td><strong>${esc(t.code)}</strong><div class="muted" style="font-size:10px">${esc(t.name)}</div></td>
      <td>${facBadge(t.facility)}</td>
      <td>${esc(projectName(t.projectId))}</td>
      <td>${t.maintCycles ? meter(s.since, t.maintCycles, t.warnPct) : `<span class="muted">${s.since} parts</span>`}</td>
      <td style="font-size:10px;color:var(--text2);max-width:280px">${s.status.reasons.map(esc).join('<br>')}</td>
    </tr></table>`).querySelector('tr');
    tr.onclick = () => nav('tool', { projectId: t.projectId, toolId: t.id });
    tb.appendChild(tr);
  });
  return wrap;
}

// ============================================================
function renderProjects() {
  const admin = canManage();
  const div = el(`<div>${header('Projects', admin ? 'Create projects and the tool list used in each one.' : 'Choose a project to see its tools and register parts.', [],
    admin && canWrite() ? `<button class="btn btn-primary" id="new-proj">${svgIcon('plus')} New project</button>` : '')}<div id="pgrid"></div></div>`);
  if (div.querySelector('#new-proj')) div.querySelector('#new-proj').onclick = () => openProjectForm(null);
  const g = div.querySelector('#pgrid');
  const projects = visProjects().sort((a,b) => (a.status==='closed') - (b.status==='closed') || (a.code||'').localeCompare(b.code||''));
  if (!projects.length) {
    const none = !admin && !userFacilities(state.currentUser).length;
    g.appendChild(el(`<div class="card"><div class="empty">${admin ? 'No projects yet. Use “New project” to create the first one, then add its tools.' : none ? 'Your account has no facility access yet. Ask the administrator to assign OSS, OHV or OMAR.' : 'No projects with tools at your facilities yet.'}</div></div>`));
    return div;
  }
  const grid = el(`<div class="proj-grid"></div>`);
  projects.forEach(p => {
    const tools = visTools().filter(t => t.projectId === p.id);
    const tIds = new Set(tools.map(x => x.id));
    const parts = data.parts.filter(x => tIds.has(x.toolId)).length;
    const facs = FACILITIES.filter(f => tools.some(x => x.facility === f));
    const nAl = tools.map(t => toolStats(t).status.lvl).filter(l => l >= 1).length;
    const card = el(`<button class="proj-card ${p.status==='closed'?'closed':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="pc-code">${projectNumber(p) ? esc(projectNumber(p)) : '<span style="color:var(--amber)">NO PROJECT Nº</span>'}${p.code ? ' · ' + esc(p.code) : ''}</span>
      ${p.status==='closed' ? '<span class="badge badge-gray">Closed</span>' : nAl ? `<span class="badge badge-amber">${nAl} alert${nAl>1?'s':''}</span>` : ''}</div>
      <div class="pc-name">${esc(p.name)}</div>
      <div class="pc-desc">${esc(p.client ? p.client + (p.description ? ' — ' : '') : '')}${esc(p.description || '')}</div>
      <div class="pc-stats"><div>Tools<b>${tools.length}</b></div><div>Parts<b>${parts}</b></div>
        <span style="margin-left:auto;display:flex;gap:4px">${facs.map(f => `<span class="badge badge-blue" style="font-size:9px;padding:1px 6px">${f}</span>`).join('')}</span></div>
    </button>`);
    card.onclick = () => nav('project', { projectId: p.id });
    grid.appendChild(card);
  });
  g.appendChild(grid);
  return div;
}

function renderProject() {
  const p = visProjects().find(x => x.id === state.projectId);
  if (!p) return el(`<div>${header('Project not found', 'It may have been removed.', [{label:'Projects', nav:{page:'projects'}}])}</div>`);
  const admin = canManage() && canWrite();
  const tools = (() => {
    const all = visTools().filter(t => t.projectId === p.id);
    const sorter = (a,b) => (a.status==='retired') - (b.status==='retired') || (a.code||'').localeCompare(b.code||'');
    const ids = new Set(all.map(x => x.id));
    const out = [];
    all.filter(x => !(isMandrel(x) && ids.has(x.mouldId))).sort(sorter).forEach(x => {
      out.push(x);
      if (isMould(x)) all.filter(y => isMandrel(y) && y.mouldId === x.id).sort(sorter).forEach(y => out.push(y));
    });
    return out;
  })();
  const div = el(`<div>${header(`<span class="code">${esc(projectNumber(p) || p.code || '')}</span> ${esc(p.name)}`,
      esc([p.client, p.description].filter(Boolean).join(' — ')) || 'Tools used in this project',
      [{label:'Projects', nav:{page:'projects'}}, {label:p.name}],
      (admin ? `<button class="btn btn-outline" id="edit-proj">${svgIcon('edit')} Edit project</button><button class="btn btn-primary" id="add-tool">${svgIcon('plus')} Add tool</button>` : ''))}
    <div class="card" style="padding:0" id="tlist"></div></div>`);
  wireCrumbs(div);
  if (admin) {
    div.querySelector('#edit-proj').onclick = () => openProjectForm(p);
    div.querySelector('#add-tool').onclick = () => openToolForm(null, p.id);
  }
  const box = div.querySelector('#tlist');
  if (!tools.length) {
    box.appendChild(el(`<div class="empty">${admin ? 'This project has no tools yet. Use “Add tool” to build the tool list.' : 'The administrator has not added tools to this project yet.'}</div>`));
    return div;
  }
  const wrap = el(`<div class="table-wrap"><table><thead><tr><th>Tool ID</th><th>Name</th><th>Facility</th><th>Type</th><th class="num">Total parts</th><th>Since maintenance</th><th>Last used</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb = wrap.querySelector('tbody');
  tools.forEach(t => {
    const s = toolStats(t);
    const tr = el(`<table><tr class="click">
      <td>${isMandrel(t) ? '<span style="color:var(--text3);margin-right:6px">↳</span>' : ''}<strong style="color:${isMandrel(t) ? 'var(--text)' : 'var(--cyan)'}">${esc(t.code)}</strong></td>
      <td>${esc(t.name)}</td>
      <td>${facBadge(t.facility)}</td>
      <td class="muted">${isMandrel(t) ? `Mandrel <span style="color:var(--text3)">· ${esc(toolCode(t.mouldId))}</span>` : esc(t.type || '—')}</td>
      <td class="num"><strong>${s.total}</strong>${t.lifeCycles ? `<span class="muted"> / ${t.lifeCycles}</span>` : ''}</td>
      <td>${t.maintCycles ? meter(s.since, t.maintCycles, t.warnPct) : `<span class="muted">${s.since} parts</span>`}</td>
      <td class="muted" style="white-space:nowrap">${s.lastUse ? fmtDateTime(s.lastUse) : 'Never'}</td>
      <td><span class="badge badge-${s.status.cls}">${s.status.label}</span></td>
      <td style="text-align:right">${t.status !== 'retired' && canWrite() && !isMandrel(t) ? `<button class="btn btn-success btn-sm" data-add="1">${svgIcon('plus')} Part</button>` : ''}</td>
    </tr></table>`).querySelector('tr');
    tr.onclick = e => { if (e.target.closest('[data-add]')) { e.stopPropagation(); openRegisterPart(t); return; } nav('tool', { toolId: t.id }); };
    tb.appendChild(tr);
  });
  box.appendChild(wrap);
  return div;
}

function renderTool() {
  const t = data.tools.find(x => x.id === state.toolId && canSeeTool(x));
  if (!t) return el(`<div>${header('Tool not found', 'It may have been removed.', [{label:'Projects', nav:{page:'projects'}}])}</div>`);
  const p = data.projects.find(x => x.id === t.projectId) || { name:'—', id:null };

  const retired = t.status === 'retired';
  const mandrel = isMandrel(t);
  const mouldT = mandrel ? data.tools.find(x => x.id === t.mouldId) : null;
  const actions = (canWrite() && !retired ? (mandrel ? '' : `<button class="btn btn-primary" id="reg">${svgIcon('plus')} Register part</button>`) + `<button class="btn btn-amber" id="mnt">${svgIcon('wrench')} Log maintenance</button>` : '')

    ${header(`<span class="code">${esc(t.code)}</span> ${esc(t.name)}`,
      (t.facility ? esc(t.facility) + ' · ' : '') + (esc([t.type, t.description].filter(Boolean).join(' — ')) || 'Tool record'),
      [{label:'Projects', nav:{page:'projects'}}, {label:p.name, nav:{page:'project', projectId:p.id}}, {label:t.code}], actions)}
    ${s.status.lvl >= 1 ? `<div class="alert alert-${s.status.lvl >= 2 ? 'error' : 'warning'}"><strong>${s.status.label}.</strong> ${s.status.reasons.map(esc).join(' · ')}</div>` : ''}
    ${mandrel ? `<div class="alert alert-info">Mandrel used with mould <a id="go-mould" style="color:var(--blue);cursor:pointer;text-decoration:underline">${esc(mouldT ? mouldT.code + ' — ' + mouldT.name : 'not found')}</a>. Its uses are counted when it is ticked while registering a part on that mould.</div>` : ''}
    ${retired ? `<div class="alert alert-info">This tool is retired. New parts can't be registered until an administrator returns it to service.</div>` : ''}
    <div class="stats-row">
      <div class="stat-card"><div class="label">Total parts</div><div class="value">${s.total}${t.lifeCycles ? `<small> / ${t.lifeCycles}</small>` : ''}</div><div class="sub">${s.firstUse ? 'First used ' + fmtDate(s.firstUse) : 'Not used yet'}</div></div>
      <div class="stat-card"><div class="label">Since last maintenance</div><div class="value" style="color:${s.status.lvl>=2?'var(--red)':s.status.lvl===1?'var(--amber)':'var(--text)'}">${s.since}${t.maintCycles ? `<small> / ${t.maintCycles}</small>` : ''}</div><div class="sub">${s.lastMaint ? 'Last: ' + fmtDate(s.lastMaint.performedAt) : 'No maintenance logged'}</div></div>
      <div class="stat-card"><div class="label">Usage rate</div><div class="value">${s.rate ? (s.rate*7).toFixed(1) : '0'}<small> /week</small></div><div class="sub">${s.last30} parts in the last 30 days</div></div>
      <div class="stat-card"><div class="label">Next maintenance</div><div class="value" style="font-size:18px;padding-top:6px">${s.forecast ? fmtDate(s.forecast) : '—'}</div><div class="sub">${s.forecast ? 'Estimate from interval and usage rate' : 'Set an interval to get an estimate'}</div></div>
    </div>
    <div class="split section">
      <div class="card">
        <div class="card-title">Maintenance intervals</div>
        <div class="meter-block"><div class="mhead"><span>Parts since maintenance</span><span>${t.maintCycles ? `warning at ${t.warnPct||80}%` : ''}</span></div>${meter(s.since, t.maintCycles, t.warnPct, t.maintCycles ? `${s.since} / ${t.maintCycles}` : `${s.since} parts`)}</div>
        <div class="meter-block"><div class="mhead"><span>Days since maintenance</span></div>${meter(Math.floor(s.daysSince), t.maintDays, t.warnPct, t.maintDays ? `${Math.floor(s.daysSince)} / ${t.maintDays} days` : `${Math.floor(s.daysSince)} days`)}</div>
        <div class="meter-block" style="margin-bottom:0"><div class="mhead"><span>Tool life used</span></div>${meter(s.total, t.lifeCycles, 90, t.lifeCycles ? `${s.total} / ${t.lifeCycles} (${Math.round(s.total/t.lifeCycles*100)}%)` : `${s.total} parts`)}</div>
      </div>
      <div class="card">
        <div class="card-title">Tool data</div>
        <table><tbody>
          <tr><td class="muted">Project</td><td>${esc(p.name)}</td></tr>
          <tr><td class="muted">Facility</td><td>${facBadge(t.facility)}</td></tr>
          ${mandrel ? `<tr><td class="muted">Used with mould</td><td>${esc(mouldT ? mouldT.code : '—')}</td></tr>` : ''}
          ${isMould(t) ? `<tr><td class="muted">Mandrels</td><td>${mandrelsOf(t.id).filter(canSeeTool).length}</td></tr>` : ''}
          <tr><td class="muted">In service since</td><td>${t.inServiceAt ? fmtDate(t.inServiceAt) : '—'}</td></tr>
          <tr><td class="muted">Maintenance events</td><td>${s.maintCount}</td></tr>
          <tr><td class="muted">Avg parts between maint.</td><td>${s.avgInterval != null ? Math.round(s.avgInterval) : '—'}</td></tr>
          <tr><td class="muted">Status</td><td><span class="badge badge-${s.status.cls}">${s.status.label}</span></td></tr>
        </tbody></table>
      </div>
    </div>
    ${isMould(t) ? `<div class="card section" style="padding:0" id="mandrels"></div>` : ''}
    <div class="card section">
      <div class="card-title">Production records <span class="badge badge-gray">${s.total}</span>
        <div class="right"><input type="search" id="sn-filter" placeholder="Search SN or OP number" value="${esc(state.snFilter)}" style="width:220px;padding:6px 10px;font-size:11px"></div></div>
      <div id="part-grid"></div>
    </div>
    <div class="card" style="padding:0" id="mhist"></div>
  </div>`);

  if (div.querySelector('#reg')) div.querySelector('#reg').onclick = () => openRegisterPart(t);
  if (div.querySelector('#mnt')) div.querySelector('#mnt').onclick = () => openMaintForm(t);
  if (div.querySelector('#edit-tool')) div.querySelector('#edit-tool').onclick = () => openToolForm(t, t.projectId);
  const gm = div.querySelector('#go-mould'); if (gm && mouldT) gm.onclick = () => nav('tool', { toolId: mouldT.id });
  const mb = div.querySelector('#mandrels');
  if (mb) {
    const list = mandrelsOf(t.id).filter(canSeeTool);
    mb.innerHTML = `<div class="card-title" style="padding:18px 20px 0">Mandrels <span class="badge badge-gray">${list.length}</span>${admin ? `<div class="right"><button class="btn btn-outline btn-sm" id="add-mandrel">${svgIcon('plus')} Add mandrel</button></div>` : ''}</div>`;
    if (!list.length) mb.appendChild(el(`<div class="empty">No mandrels linked to this mould.${admin ? ' Use “Add mandrel” to create one.' : ''}</div>`));
    else {
      const w = el(`<div class="table-wrap"><table><thead><tr><th>Mandrel</th><th class="num">Uses</th><th>Since maintenance</th><th>Life used</th><th>Status</th></tr></thead><tbody></tbody></table></div>`);
      list.forEach(x => {
        const sx = toolStats(x);
        const tr = el(`<table><tr class="click"><td><strong>${esc(x.code)}</strong> <span class="muted">${esc(x.name)}</span></td><td class="num">${sx.total}</td>
          <td>${x.maintCycles ? meter(sx.since, x.maintCycles, x.warnPct) : `<span class="muted">${sx.since} uses</span>`}</td>
          <td>${meter(sx.total, x.lifeCycles, 90, x.lifeCycles ? `${sx.total} / ${x.lifeCycles}` : `${sx.total} uses`)}</td>
          <td><span class="badge badge-${sx.status.cls}">${sx.status.label}</span></td></tr></table>`).querySelector('tr');
        tr.onclick = () => nav('tool', { toolId: x.id });
        w.querySelector('tbody').appendChild(tr);
      });
      mb.appendChild(w);
    }
    const am = mb.querySelector('#add-mandrel'); if (am) am.onclick = () => openToolForm(null, t.projectId, { type:'Mandrel', mouldId: t.id });
  }
  const fi = div.querySelector('#sn-filter');
  fi.oninput = () => { state.snFilter = fi.value; fillPartGrid(div.querySelector('#part-grid'), t); };
  fillPartGrid(div.querySelector('#part-grid'), t);

  // maintenance history
  const mh = div.querySelector('#mhist');
  mh.innerHTML = `<div class="card-title" style="padding:18px 20px 0">Maintenance history</div>`;
  const ms = maintOf(t.id);
  if (!ms.length) mh.appendChild(el(`<div class="empty">No maintenance logged for this tool yet.</div>`));
  else {
    const w = el(`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Counter</th><th>Performed by</th><th>Notes</th><th></th></tr></thead><tbody></tbody></table></div>`);
    ms.forEach(m => {
      const tr = el(`<table><tr><td style="white-space:nowrap">${fmtDateTime(m.performedAt)}</td><td><span class="badge badge-amber">${esc(m.type||'Maintenance')}</span></td>
        <td class="muted">${m.resets === false ? 'Not reset' : 'Reset'}</td><td>${esc(m.performedBy || userName(m.createdBy))}</td>
        <td style="font-size:10px;color:var(--text2);white-space:pre-wrap">${esc(m.notes||'')}</td>
        <td style="text-align:right">${isAdmin() && canWrite() ? `<button class="icon-btn" title="Delete maintenance record">${svgIcon('trash')}</button>` : ''}</td></tr></table>`).querySelector('tr');
      const b = tr.querySelector('.icon-btn');
      if (b) b.onclick = () => confirmBox('Delete maintenance record', `Remove the ${esc(m.type||'maintenance')} entry from ${fmtDateTime(m.performedAt)}? The parts counter will be recalculated.`, 'Delete record', async () => { if (await Store.del('maint', m.id)) toast('Maintenance record deleted.'); });
      w.querySelector('tbody').appendChild(tr);
    });
    mh.appendChild(w);
  }
  return div;
}

function fillPartGrid(box, t) {
  box.innerHTML = '';
  const all = partsOf(t.id).slice().sort((a,b) => (a.producedAt||'').localeCompare(b.producedAt||''));
  const cycleNo = new Map(all.map((p,i) => [p.id, i+1]));
  const q = state.snFilter.trim().toLowerCase();
  let list = all.slice().reverse();
  if (q) list = list.filter(p => (p.sn||'').toLowerCase().includes(q) || (p.op||'').toLowerCase().includes(q));
  if (!all.length) { box.appendChild(el(`<div class="empty">No parts registered with this tool yet. Use “Register part” each time a part comes off the tool.</div>`)); return; }
  if (!list.length) { box.appendChild(el(`<div class="empty">No serial or OP number matches “${esc(state.snFilter)}”.</div>`)); return; }
  const LIMIT = 60;
  const shown = state.showAllParts || q ? list : list.slice(0, LIMIT);
  // maintenance markers between cards
  const maints = maintOf(t.id);
  const grid = el(`<div class="part-grid"></div>`);
  let mi = 0;
  shown.forEach(p => {
    if (!q) {
      while (mi < maints.length && !after(p, maints[mi])) {
        const m = maints[mi++];
        grid.appendChild(el(`<div class="part-card maint"><div class="pc-top"><span class="cyc">Maintenance</span></div><div class="sn">${esc(m.type||'Maintenance')}${m.resets===false?'':' · counter reset'}</div><div class="when">${fmtDateTime(m.performedAt)}</div><div class="who">${esc(m.performedBy || userName(m.createdBy))}</div></div>`));
      }
    }
    const mine = p.createdBy === state.currentUser.id;
    const card = el(`<div class="part-card">
      <div class="pc-top"><span class="cyc">Cycle #${cycleNo.get(p.id)}</span>
      ${(isAdmin() || mine) && canWrite() ? `<button class="icon-btn" title="Delete record">${svgIcon('trash')}</button>` : ''}</div>
      <div class="sn">${esc(p.sn)}</div>
      ${p.op ? `<div class="op"><span class="muted" style="font-weight:400">OP</span> ${esc(p.op)}</div>` : ''}
      <div class="when">${fmtDateTime(p.producedAt)}</div>
      <div class="who">${esc(userName(p.createdBy))}</div>
      ${p.toolId !== t.id ? `<div class="who" style="color:var(--text2)">On mould ${esc(toolCode(p.toolId))}</div>` : ''}

      ${p.notes ? `<div class="note">${esc(p.notes)}</div>` : ''}
    </div>`);

function renderAnalysis() {
  const projOpts = visProjects().sort((a,b)=>(a.code||'').localeCompare(b.code||''));
  if (state.anProject && !projOpts.find(p => p.id === state.anProject)) state.anProject = '';
  const myFacs = userFacilities(state.currentUser);
  if (state.anFac && !myFacs.includes(state.anFac)) state.anFac = '';
  const toolsInScope = visTools().filter(t => (!state.anProject || t.projectId === state.anProject) && (!state.anFac || t.facility === state.anFac));
  if (state.anTool && !toolsInScope.find(t => t.id === state.anTool)) state.anTool = '';
  const div = el(`<div>${header('Tool longevity', 'Usage history, maintenance intervals achieved and life consumed per tool.', [],
      `<button class="btn btn-outline" id="exp">${svgIcon('download')} Export records (CSV)</button>`)}
    <div class="toolbar">
      <select id="an-f" style="width:auto;min-width:140px"><option value="">All facilities</option>${myFacs.map(f=>`<option ${state.anFac===f?'selected':''}>${f}</option>`).join('')}</select>
      <select id="an-p" style="width:auto;min-width:200px"><option value="">All projects</option>${projOpts.map(p=>`<option value="${p.id}" ${state.anProject===p.id?'selected':''}>${esc(p.code ? p.code + ' — ' : '')}${esc(p.name)}</option>`).join('')}</select>
      <select id="an-t" style="width:auto;min-width:200px"><option value="">All tools</option>${toolsInScope.map(t=>`<option value="${t.id}" ${state.anTool===t.id?'selected':''}>${esc(t.code)} — ${esc(t.name)}</option>`).join('')}</select>
    </div>
    <div class="card section" id="chart"></div>
    <div class="card" style="padding:0" id="tbl"></div></div>`);
  div.querySelector('#an-f').onchange = e => { state.anFac = e.target.value; state.anTool = ''; render(); };
  div.querySelector('#an-p').onchange = e => { state.anProject = e.target.value; state.anTool = ''; render(); };
  div.querySelector('#an-t').onchange = e => { state.anTool = e.target.value; render(); };
  div.querySelector('#exp').onclick = exportCSV;

  // Monthly production chart, last 12 months
  const scopeIds = new Set(toolsInScope.map(x => x.id));
  const usesTool = (p, id) => p.toolId === id || (Array.isArray(p.mandrelIds) && p.mandrelIds.includes(id));
  const parts = data.parts.filter(p => state.anTool ? usesTool(p, state.anTool) : (scopeIds.has(p.toolId) || (p.mandrelIds || []).some(id => scopeIds.has(id))));
  const months = []; const d0 = new Date(); d0.setDate(1);
  for (let i = 11; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); months.push({ key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label:d.toLocaleString('en-GB',{month:'short'}), n:0 }); }
  parts.forEach(p => { const d = new Date(p.producedAt); const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; const m = months.find(x => x.key === k); if (m) m.n++; });
  const max = Math.max(1, ...months.map(m => m.n));
  const ch = div.querySelector('#chart');
  ch.innerHTML = `<div class="card-title">Parts produced per month <span class="badge badge-gray">last 12 months</span></div>
    <div class="bars">${months.map(m => `<div class="b" title="${m.label}: ${m.n}"><span class="v">${m.n || ''}</span><div class="col" style="height:${m.n/max*100}%"></div></div>`).join('')}</div>
    <div class="bar-labels">${months.map(m => `<span>${m.label}</span>`).join('')}</div>`;

  const tb = div.querySelector('#tbl');
  tb.innerHTML = `<div class="card-title" style="padding:18px 20px 0">Per tool</div>`;
  const rows = (state.anTool ? toolsInScope.filter(t => t.id === state.anTool) : toolsInScope);
  if (!rows.length) { tb.appendChild(el(`<div class="empty">No tools to analyse yet.</div>`)); return div; }
  const w = el(`<div class="table-wrap"><table><thead><tr><th>Tool</th><th>Facility</th><th>Project</th><th class="num">Parts</th><th>First use</th><th>Last use</th><th class="num">Rate /week</th><th class="num">Maint. events</th><th class="num">Avg parts / interval</th><th>Life used</th><th>Next maint. (est.)</th><th>Status</th></tr></thead><tbody></tbody></table></div>`);
  rows.forEach(t => {
    const s = toolStats(t);
    const tr = el(`<table><tr class="click">
      <td><strong style="color:var(--cyan)">${esc(t.code)}</strong><div class="muted" style="font-size:10px">${esc(t.name)}</div></td>
      <td>${facBadge(t.facility)}</td><td>${esc(projectName(t.projectId))}</td><td class="num"><strong>${s.total}</strong></td>
      <td class="muted" style="white-space:nowrap">${fmtDate(s.firstUse)}</td><td class="muted" style="white-space:nowrap">${fmtDate(s.lastUse)}</td>
      <td class="num">${(s.rate*7).toFixed(1)}</td><td class="num">${s.maintCount}</td>
      <td class="num">${s.avgInterval != null ? Math.round(s.avgInterval) : '—'}${t.maintCycles ? `<span class="muted"> / ${t.maintCycles}</span>` : ''}</td>
      <td>${meter(s.total, t.lifeCycles, 90, t.lifeCycles ? Math.round(s.total/t.lifeCycles*100) + '%' : '—')}</td>
      <td style="white-space:nowrap">${s.forecast ? fmtDate(s.forecast) : '—'}</td>
      <td><span class="badge badge-${s.status.cls}">${s.status.label}</span></td></tr></table>`).querySelector('tr');
    tr.onclick = () => nav('tool', { projectId: t.projectId, toolId: t.id });
    w.querySelector('tbody').appendChild(tr);
  });
  tb.appendChild(w);
  return div;
}

async function exportCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = [['Facility','Project code','Project','Tool ID','Tool name','Cycle #','Serial number','OP number','Mandrels used','Recorded on mould','Produced at','Registered by','Notes'].map(q).join(',')];
  visTools().forEach(t => {
    const p = data.projects.find(x => x.id === t.projectId) || {};
    partsOf(t.id).sort((a,b)=>(a.producedAt||'').localeCompare(b.producedAt||'')).forEach((r,i) => {
      rows.push([t.facility, p.code, p.name, t.code, t.name, i+1, r.sn, r.op, (r.mandrelIds || []).map(toolCode).join(' '), r.toolId !== t.id ? toolCode(r.toolId) : '', fmtDateTime(r.producedAt), userName(r.createdBy), r.notes].map(q).join(','));
    });
  });
  const csv = '\uFEFF' + rows.join('\r\n');
  const filename = `OPTIMAL_tool_records_${new Date().toISOString().slice(0,10)}.csv`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' })); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function openModal(html, opts = {}) {
  const mr = document.getElementById('modal-root');
  mr.innerHTML = '';
  const ov = el(`<div class="modal-overlay"><div class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`);
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  ov.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  mr.appendChild(ov);
  const f = ov.querySelector('[autofocus]') || ov.querySelector('input,select,textarea,button');
  if (f) setTimeout(() => f.focus(), 30);
  return ov;
}
function closeModal() { const mr = document.getElementById('modal-root'); if (mr) mr.innerHTML = ''; }

function confirmBox(title, bodyHtml, okLabel, onOk) {
  const m = openModal(`<h3>${esc(title)}</h3><div class="modal-desc">${bodyHtml}</div>
    <div class="modal-actions"><button class="btn btn-outline" data-c>Cancel</button><button class="btn btn-danger" data-ok>${esc(okLabel)}</button></div>`);
  m.querySelector('[data-c]').onclick = closeModal;
  m.querySelector('[data-ok]').onclick = async () => { m.querySelector('[data-ok]').disabled = true; closeModal(); await onOk(); };
}

// ---- Register part ----
function openRegisterPart(tool) {
  if (!canWrite()) return;
  const usable = visTools().filter(t => t.status !== 'retired' && !isMandrel(t));
  if (!tool && !usable.length) { toast('No tools available at your facilities yet.', 'warn', 5000); return; }
  const now = new Date();
  const toolPicker = tool ? '' : `<div class="grid2">
      <div class="form-group"><label>Project</label><select id="rp-proj">${data.projects.filter(p => usable.some(t => t.projectId === p.id)).map(p => `<option value="${p.id}">${esc(p.code ? p.code + ' — ' : '')}${esc(p.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label>Tool</label><select id="rp-tool"></select></div></div>`;
  const m = openModal(`
    <h3>Register part</h3>
    <div class="modal-desc" id="rp-desc"></div>
    ${toolPicker}
    <div id="rp-fields"></div>
    <div class="form-group"><label for="rp-dt">Date &amp; time produced</label><input type="datetime-local" id="rp-dt" value="${toLocalInput(now)}"><div class="hint">Set to now. Change it only if the part was made earlier.</div></div>
    <div class="form-group"><label for="rp-notes">Notes (optional)</label><textarea id="rp-notes" placeholder="Batch, shift, observations…" style="min-height:56px"></textarea></div>
    <div id="rp-warn"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" data-c>Cancel</button>
      <button class="btn btn-outline" data-more>Save &amp; add another</button>
      <button class="btn btn-primary" data-ok>Save part</button>
    </div>`);
  let current = tool;
  let dupConfirmed = '';
  const warn = m.querySelector('#rp-warn');
  const dtIn = m.querySelector('#rp-dt');
  const prodDate = () => { const v = dtIn.value; return (!v || v === dtIn.defaultValue) ? new Date() : new Date(v); };

  // Mould: number allocated by the tool. Other tools: operator types SN.
  const setTool = (t) => {
    current = t; dupConfirmed = ''; warn.innerHTML = '';
    const desc = m.querySelector('#rp-desc');
    desc.innerHTML = t ? `Tool <strong style="color:var(--text)">${esc(t.code)} — ${esc(t.name)}</strong> · ${esc(projectName(t.projectId))}${t.facility ? ' · ' + esc(t.facility) : ''}` : 'Choose the tool the part was produced in.';
    const box = m.querySelector('#rp-fields');
    const block = t && isMould(t) ? mouldBlock(t) : '';
    m.querySelectorAll('[data-ok],[data-more]').forEach(b => b.disabled = !!block || !t);
    if (t && isMould(t)) {
      box.innerHTML = block ? `<div class="alert alert-error">${esc(block)}</div>` : `
        <div class="form-group"><label>Part serial number <span style="color:var(--text3);text-transform:none;letter-spacing:0;font-weight:400">(allocated automatically)</span></label>
          <div class="sn-box" id="rp-prev"></div>
          <div class="hint">Project ${esc(projectNumber(data.projects.find(p => p.id === t.projectId)))} · ${esc(FAC_CODE[t.facility])} · year + sequence. Confirmed when you save.</div></div>
        <div class="form-group"><label for="rp-op">OP number (optional)</label><input type="text" id="rp-op" placeholder="OP#" autocomplete="off" autocapitalize="characters"></div>
        ${mandrelPicker(t)}`;
      updatePreview();
      const op = m.querySelector('#rp-op'); if (op) { op.focus(); op.addEventListener('keydown', e => { if (e.key === 'Enter') save(true); }); }
    } else {
      box.innerHTML = `<div class="grid2">
        <div class="form-group"><label for="rp-sn">Part serial number</label><input type="text" id="rp-sn" class="sn-input" placeholder="SN#" autocomplete="off" autocapitalize="characters"></div>
        <div class="form-group"><label for="rp-op">OP number (optional)</label><input type="text" id="rp-op" class="sn-input" placeholder="OP#" autocomplete="off" autocapitalize="characters" style="color:var(--text)!important"></div></div>`;
      const sn = m.querySelector('#rp-sn');
      sn.focus();
      sn.addEventListener('keydown', e => { if (e.key === 'Enter') m.querySelector('#rp-op').focus(); });
      m.querySelector('#rp-op').addEventListener('keydown', e => { if (e.key === 'Enter') save(true); });
    }
  };
  const updatePreview = () => {
    const pv = m.querySelector('#rp-prev'); if (!pv || !current) return;
    const d = prodDate(); if (isNaN(d)) { pv.textContent = '—'; return; }
    const r = nextSN(current, d.getFullYear());
    pv.textContent = r.sn || '—';
    if (r.error) warn.innerHTML = `<div class="alert alert-error">${esc(r.error)}</div>`;
  };
  dtIn.addEventListener('change', updatePreview);
  let keepMandrels = null;   // remembered between "Save & add another"
  function mandrelPicker(t) {
    const list = mandrelsOf(t.id).filter(x => x.status !== 'retired' && canSeeTool(x));
    if (!list.length) return `<div class="form-group"><label>Mandrels used</label><div class="hint" style="margin-top:0">No mandrels are linked to this mould.</div></div>`;
    return `<div class="form-group"><label>Mandrels used</label>
      <div style="display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;background:var(--surface2);max-height:200px;overflow-y:auto">
      ${list.map(x => { const sx = toolStats(x); return `<label style="display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text);margin:0;padding:5px 0;cursor:pointer">
        <input type="checkbox" class="rp-mand" value="${x.id}" ${keepMandrels && keepMandrels.includes(x.id) ? 'checked' : ''}>
        <strong>${esc(x.code)}</strong> <span class="muted">${esc(x.name)}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--text3)">${sx.total}${x.lifeCycles ? ' / ' + x.lifeCycles : ''} uses</span>
        ${sx.status.lvl >= 1 ? `<span class="badge badge-${sx.status.cls}" style="margin-left:6px;font-size:9px">${sx.status.label}</span>` : ''}</label>`; }).join('')}
      </div><div class="hint">Tick every mandrel used for this part.</div></div>`;
  }

  if (tool) setTool(tool);
  else {
    const ps = m.querySelector('#rp-proj'), ts = m.querySelector('#rp-tool');
    const fill = () => { ts.innerHTML = usable.filter(t => t.projectId === ps.value).map(t => `<option value="${t.id}">${esc(t.code)} — ${esc(t.name)}${t.facility ? ' (' + esc(t.facility) + ')' : ''}${isMould(t) ? ' · mould' : ''}</option>`).join(''); setTool(usable.find(t => t.id === ts.value)); };
    ps.onchange = fill; ts.onchange = () => setTool(usable.find(t => t.id === ts.value));
    fill();
  }
  m.querySelector('[data-c]').onclick = closeModal;

  const save = async (again) => {
    if (!current) { warn.innerHTML = '<div class="alert alert-error">Choose a tool.</div>'; return; }
    const mould = isMould(current);
    const opIn = m.querySelector('#rp-op');
    const op = opIn ? opIn.value.trim() : '';
    const notes = m.querySelector('#rp-notes').value.trim();
    const dt = prodDate();
    if (isNaN(dt)) { warn.innerHTML = '<div class="alert alert-error">Enter a valid date and time.</div>'; return; }
    if (dt.getTime() > Date.now() + 5*60000) { warn.innerHTML = '<div class="alert alert-error">The production date is in the future.</div>'; return; }
    let sn = '';
    if (!mould) {
      sn = m.querySelector('#rp-sn').value.trim();
      if (!sn) { warn.innerHTML = '<div class="alert alert-error">Enter the part serial number.</div>'; m.querySelector('#rp-sn').focus(); return; }
      const dup = data.parts.find(p => p.toolId === current.id && (p.sn||'').toLowerCase() === sn.toLowerCase());
      if (dup && dupConfirmed !== sn.toLowerCase()) {
        dupConfirmed = sn.toLowerCase();
        warn.innerHTML = `<div class="alert alert-warning">Serial number ${esc(sn)} is already recorded on this tool (${fmtDateTime(dup.producedAt)}). Save again to record it anyway.</div>`;
        return;
      }
    }
    const t = current;
    const before = toolStats(t).status.lvl;
    const mandrelIds = [...m.querySelectorAll('.rp-mand:checked')].map(x => x.value);
    const mBefore = Object.fromEntries(mandrelIds.map(id => [id, toolStats(data.tools.find(x => x.id === id)).status.lvl]));
    const rec = { id: uid(), toolId: t.id, projectId: t.projectId, sn, op, mandrelIds, snAuto: mould, producedAt: dt.toISOString(), notes, createdBy: state.currentUser.id, createdAt: nowISO() };
    m.querySelectorAll('.modal-actions button').forEach(b => b.disabled = true);
    let ok;
    if (mould) {
      // The number is worked out on the latest GitHub data, so two computers never get the same one
      ok = await Store.mutate(d => {
        const r = nextSN(t, dt.getFullYear(), d);
        if (r.error) throw new Error(r.error);
        rec.sn = r.sn; d.parts.push(rec);
      }, () => `Part ${rec.sn}${op ? ' OP ' + op : ''} on ${t.code}`);
    } else {
      ok = await Store.put('parts', rec, `Part ${sn}${op ? ' OP ' + op : ''} on ${t.code}`);
    }
    m.querySelectorAll('.modal-actions button').forEach(b => b.disabled = false);
    if (!ok) { if (mould) updatePreview(); return; }
    const afterS = toolStats(t);
    toast(`Part ${rec.sn} registered on ${t.code} — cycle #${afterS.total}.`);
    mandrelIds.forEach(id => { const mt = data.tools.find(x => x.id === id); if (!mt) return; const ms = toolStats(mt); if (ms.status.lvl >= 1 && ms.status.lvl >= mBefore[id]) toast(`Mandrel ${mt.code}: ${ms.status.reasons[0]}`, ms.status.lvl >= 2 ? 'error' : 'warn', 7000); });
    if (afterS.status.lvl >= 1 && afterS.status.lvl >= before) toast(`${t.code}: ${afterS.status.reasons[0]}`, afterS.status.lvl >= 2 ? 'error' : 'warn', 7000);

    if (mould && !again) {
      // keep the allocated number on screen so the operator can mark the part
      const mm = m.querySelector('.modal');
      mm.innerHTML = `<h3>Serial number allocated</h3>
        <div class="modal-desc">Mark this number on the part.</div>
        <div class="sn-box" style="font-size:30px;padding:22px">${esc(rec.sn)}</div>
        <table style="margin-top:14px"><tbody>
          <tr><td class="muted">Tool</td><td>${esc(t.code)} — ${esc(t.name)}</td></tr>
          ${op ? `<tr><td class="muted">OP number</td><td>${esc(op)}</td></tr>` : ''}
          <tr><td class="muted">Produced</td><td>${fmtDateTime(rec.producedAt)}</td></tr>
          <tr><td class="muted">Cycle</td><td>#${afterS.total}</td></tr>
          <tr><td class="muted">Mandrels</td><td>${mandrelIds.length ? mandrelIds.map(id => esc(toolCode(id))).join(', ') : '<span class="muted">None</span>'}</td></tr>
        </tbody></table>
        <div class="modal-actions"><button class="btn btn-outline" data-another>Register another</button><button class="btn btn-primary" data-done>Done</button></div>`;
      mm.querySelector('[data-done]').onclick = closeModal;
      mm.querySelector('[data-another]').onclick = () => openRegisterPart(t);
      mm.querySelector('[data-done]').focus();
      return;
    }
    if (again) {
      dupConfirmed = '';
      m.querySelector('#rp-notes').value = '';
      dtIn.value = dtIn.defaultValue = toLocalInput(new Date());
      if (opIn) opIn.value = '';
      keepMandrels = mandrelIds;
      warn.innerHTML = mould
        ? `<div class="alert alert-success">Allocated <strong style="font-size:15px;letter-spacing:0.05em">${esc(rec.sn)}</strong>${op ? ' · OP ' + esc(op) : ''}. Mark it on the part.</div>`
        : `<div class="alert alert-success">Saved ${esc(sn)}. Enter the next serial number.</div>`;
      if (mould) { updatePreview(); opIn && opIn.focus(); }
      else { m.querySelector('#rp-sn').value = ''; m.querySelector('#rp-sn').focus(); }
    } else closeModal();
  };
  m.querySelector('[data-ok]').onclick = () => save(false);
  m.querySelector('[data-more]').onclick = () => save(true);
}

// ---- Maintenance ----

    <div class="modal-desc">Tool <strong style="color:var(--text)">${esc(t.code)} — ${esc(t.name)}</strong></div>
    <div class="grid2">
      <div class="form-group"><label>Type</label><select id="mf-type">${MAINT_TYPES.map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="form-group"><label>Date &amp; time</label><input type="datetime-local" id="mf-dt" value="${toLocalInput(new Date())}"></div>
    </div>

    <div class="form-group"><label>Notes</label><textarea id="mf-notes" placeholder="Work done, parts replaced, findings…"></textarea></div>
    <label style="display:flex;align-items:center;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text)"><input type="checkbox" id="mf-reset" checked> Reset the parts-since-maintenance counter</label>
    <div class="hint">Leave unticked for inspections that don't restart the maintenance interval.</div>
    <div id="mf-err" style="margin-top:12px"></div>
    <div class="modal-actions"><button class="btn btn-outline" data-c>Cancel</button><button class="btn btn-amber" data-ok>Save maintenance</button></div>`);
  m.querySelector('#mf-type').onchange = e => { m.querySelector('#mf-reset').checked = e.target.value !== 'Inspection'; };
  m.querySelector('[data-c]').onclick = closeModal;
  m.querySelector('[data-ok]').onclick = async () => {
    const mv = m.querySelector('#mf-dt'); const dt = mv.value === mv.defaultValue ? new Date() : new Date(mv.value);
    if (isNaN(dt)) { m.querySelector('#mf-err').innerHTML = '<div class="alert alert-error">Enter a valid date and time.</div>'; return; }
