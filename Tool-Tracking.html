      createdBy: state.currentUser.id, createdAt: nowISO() };
    if (await Store.put('maint', rec, `Maintenance ${rec.type} on ${t.code}`)) { closeModal(); toast(`Maintenance logged for ${t.code}.`); }
  };
}

// ---- Project form (admin) ----
function openProjectForm(p) {
  const isNew = !p; p = p || {};
  const nTools = p.id ? data.tools.filter(t => t.projectId === p.id).length : 0;
  const m = openModal(`<h3>${isNew ? 'New project' : 'Edit project'}</h3>
    <div class="modal-desc">${isNew ? 'After creating the project, add the tools used in it.' : 'Changes apply for every user straight away.'}</div>
    <div class="grid2">
      <div class="form-group"><label>Project number (5 digits)</label><input type="text" id="pf-num" inputmode="numeric" maxlength="5" value="${esc(projectNumber(p))}" placeholder="e.g. 00014" autofocus><div class="hint">Used at the start of mould serial numbers.</div></div>
      <div class="form-group"><label>Project code (optional)</label><input type="text" id="pf-code" value="${esc(p.code||'')}" placeholder="e.g. P-2026-014"></div>
    </div>
    <div class="grid2">
      <div class="form-group"><label>Status</label><select id="pf-status"><option value="active">Active</option><option value="closed" ${p.status==='closed'?'selected':''}>Closed</option></select></div>
    </div>
    <div class="form-group"><label>Project name</label><input type="text" id="pf-name" value="${esc(p.name||'')}" placeholder="Project name"></div>
    <div class="form-group"><label>Client (optional)</label><input type="text" id="pf-client" value="${esc(p.client||'')}"></div>
    <div class="form-group"><label>Description (optional)</label><textarea id="pf-desc" style="min-height:56px">${esc(p.description||'')}</textarea></div>
    <div id="pf-err"></div>
    <div class="modal-actions">
      ${!isNew && isAdmin() ? `<button class="btn btn-danger" data-del style="margin-right:auto">Delete project</button>` : ''}
      <button class="btn btn-outline" data-c>Cancel</button><button class="btn btn-primary" data-ok>${isNew ? 'Create project' : 'Save changes'}</button></div>`);
  m.querySelector('[data-c]').onclick = closeModal;
  m.querySelector('[data-ok]').onclick = async () => {
    const g = s => m.querySelector(s).value.trim();
    const name = g('#pf-name'), code = g('#pf-code');
    const numRaw = g('#pf-num');
    if (!/^\d{1,5}$/.test(numRaw)) { m.querySelector('#pf-err').innerHTML = '<div class="alert alert-error">Enter the project number: up to 5 digits.</div>'; return; }
    const number = numRaw.padStart(5, '0');
    if (data.projects.some(x => x.id !== p.id && projectNumber(x) === number)) { m.querySelector('#pf-err').innerHTML = '<div class="alert alert-error">Another project already uses this project number.</div>'; return; }
    if (!name) { m.querySelector('#pf-err').innerHTML = '<div class="alert alert-error">Enter a project name.</div>'; return; }
    if (code && data.projects.some(x => x.id !== p.id && (x.code||'').toLowerCase() === code.toLowerCase())) { m.querySelector('#pf-err').innerHTML = '<div class="alert alert-error">Another project already uses this code.</div>'; return; }
    const rec = Object.assign({}, p, { id: p.id || uid(), number, code, name, client: g('#pf-client'), description: g('#pf-desc'), status: g('#pf-status'),
      createdAt: p.createdAt || nowISO(), updatedAt: nowISO() });
    if (await Store.put('projects', rec, `Project ${name}`)) { closeModal(); toast(isNew ? `Project ${name} created.` : 'Project updated.'); if (isNew) nav('project', { projectId: rec.id }); }
  };
  const del = m.querySelector('[data-del]');
  if (del) del.onclick = () => {
    if (nTools) { m.querySelector('#pf-err').innerHTML = `<div class="alert alert-warning">This project still has ${nTools} tool${nTools>1?'s':''}. Delete or move them first, or set the project to Closed.</div>`; return; }
    confirmBox('Delete project', `Delete project <strong>${esc(p.name)}</strong>? This can't be undone.`, 'Delete project', async () => {
      if (await Store.del('projects', p.id)) { toast('Project deleted.'); nav('projects'); }
    });
  };
}

// ---- Tool form (admin) ----
function openToolForm(t, projectId, preset) {
  const isNew = !t; t = t || Object.assign({ warnPct: 80, status: 'active' }, preset || {});
  const s = t.id ? toolStats(t) : null;
  const moulds = visTools().filter(x => isMould(x) && x.projectId === projectId && x.id !== t.id);
  const linked = t.id ? mandrelsOf(t.id) : [];
  const m = openModal(`<h3>${isNew ? (isMandrel(t) ? 'Add mandrel' : 'Add tool') : 'Edit tool'}</h3>
    <div class="modal-desc">Project <strong style="color:var(--text)">${esc(projectName(projectId))}</strong>. Leave an interval empty if it doesn't apply.</div>
    <div class="grid2">
      <div class="form-group"><label>Tool ID</label><input type="text" id="tf-code" value="${esc(t.code||'')}" placeholder="e.g. M-0231" autofocus></div>
      <div class="form-group"><label>Type</label><select id="tf-type">${TOOL_TYPES.map(x => `<option ${t.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div class="form-group" id="tf-mould-wrap"><label>Used with mould</label><select id="tf-mould"><option value="">Select mould…</option>${moulds.map(x => `<option value="${x.id}" ${t.mouldId===x.id?'selected':''}>${esc(x.code)} — ${esc(x.name)} (${esc(x.facility||'—')})</option>`).join('')}</select>
        <div class="hint">${moulds.length ? 'The mandrel takes the mould’s facility and counts a use each time it is ticked on a mould part.' : 'This project has no mould yet. Create the mould first.'}</div></div>
      <div class="form-group" id="tf-fac-wrap"><label>Facility (location)</label><select id="tf-fac"><option value="">Select facility…</option>${userFacilities(state.currentUser).map(f => `<option ${t.facility===f?'selected':''}>${f}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label>Tool name</label><input type="text" id="tf-name" value="${esc(t.name||'')}" placeholder="e.g. Wing skin lower mould"></div>
    <div class="form-group"><label>Description (optional)</label><input type="text" id="tf-desc" value="${esc(t.description||'')}" placeholder="Material, location, supplier…"></div>
    <div class="section-title" style="margin-top:6px">Maintenance & life</div>
    <div class="grid3">
      <div class="form-group"><label>Interval (parts)</label><input type="number" min="0" id="tf-mc" value="${t.maintCycles||''}" placeholder="e.g. 50"></div>
      <div class="form-group"><label>Interval (days)</label><input type="number" min="0" id="tf-md" value="${t.maintDays||''}" placeholder="e.g. 90"></div>
      <div class="form-group"><label>Warn at (%)</label><input type="number" min="10" max="100" id="tf-wp" value="${t.warnPct||80}"></div>
    </div>
    <div class="grid3">
      <div class="form-group"><label>Expected life (parts)</label><input type="number" min="0" id="tf-life" value="${t.lifeCycles||''}" placeholder="e.g. 1000"></div>
      <div class="form-group"><label>In service since</label><input type="date" id="tf-since" value="${t.inServiceAt ? t.inServiceAt.slice(0,10) : ''}"></div>
      <div class="form-group"><label>Status</label><select id="tf-status"><option value="active">Active</option><option value="retired" ${t.status==='retired'?'selected':''}>Retired</option></select></div>
    </div>
    <div id="tf-err"></div>
    <div class="modal-actions">
      ${!isNew && isAdmin() ? `<button class="btn btn-danger" data-del style="margin-right:auto">Delete tool</button>` : ''}
      <button class="btn btn-outline" data-c>Cancel</button><button class="btn btn-primary" data-ok>${isNew ? 'Add tool' : 'Save changes'}</button></div>`, { wide:true });
  const typeSel = m.querySelector('#tf-type');
  const syncType = () => {
    const mand = typeSel.value === 'Mandrel';
    m.querySelector('#tf-mould-wrap').style.display = mand ? '' : 'none';
    m.querySelector('#tf-fac-wrap').style.display = mand ? 'none' : '';
  };
  typeSel.onchange = syncType; syncType();
  m.querySelector('[data-c]').onclick = closeModal;
  m.querySelector('[data-ok]').onclick = async () => {
    const g = s => m.querySelector(s).value.trim();
    const code = g('#tf-code'), name = g('#tf-name'), type = g('#tf-type');
    const err = h => m.querySelector('#tf-err').innerHTML = `<div class="alert alert-error">${h}</div>`;
    if (!code || !name) return err('Enter the tool ID and name.');
    let facility = g('#tf-fac'), mouldId = '';
    if (type === 'Mandrel') {
      mouldId = g('#tf-mould');
      const mould = moulds.find(x => x.id === mouldId);
      if (!mould) return err(moulds.length ? 'Select the mould this mandrel is used with.' : 'This project has no mould yet. Create the mould first, then add its mandrels.');
      if (!mould.facility) return err('The selected mould has no facility. Set the mould\'s facility first.');
      facility = mould.facility;
    } else if (!facility) return err('Select the facility where the tool is located.');
    if (t.id && isMould(t) && type !== 'Mould' && linked.length) return err(`${linked.length} mandrel${linked.length>1?'s are':' is'} linked to this mould. Move or delete ${linked.length>1?'them':'it'} before changing the type.`);
    if (data.tools.some(x => x.id !== t.id && x.projectId === projectId && (x.code||'').toLowerCase() === code.toLowerCase())) return err('This project already has a tool with that ID.');
    let wp = num(g('#tf-wp')) || 80; wp = Math.min(100, Math.max(10, wp));
    const since = g('#tf-since');
    const rec = Object.assign({}, t, { id: t.id || uid(), projectId, code, name, facility, type, mouldId, description: g('#tf-desc'),
      maintCycles: num(g('#tf-mc')), maintDays: num(g('#tf-md')), warnPct: wp, lifeCycles: num(g('#tf-life')),
      inServiceAt: since ? new Date(since + 'T00:00:00').toISOString() : '', status: g('#tf-status'),
      createdAt: t.createdAt || nowISO(), updatedAt: nowISO() });
    // one save: the tool, plus its mandrels follow the mould if the mould moves facility
    const ok = await Store.mutate(d => {
      const i = d.tools.findIndex(x => x.id === rec.id);
      if (i >= 0) d.tools[i] = rec; else d.tools.push(rec);
      if (rec.type === 'Mould') d.tools.forEach(x => { if (x.mouldId === rec.id) x.facility = rec.facility; });
    }, `Tool ${code}`);
    if (ok) { closeModal(); toast(isNew ? `${type === 'Mandrel' ? 'Mandrel' : 'Tool'} ${code} added.` : 'Tool updated.'); }
  };
  const del = m.querySelector('[data-del]');
  if (del) del.onclick = () => {
    if (linked.length) { m.querySelector('#tf-err').innerHTML = `<div class="alert alert-warning">${linked.length} mandrel${linked.length>1?'s are':' is'} linked to this mould (${linked.map(x => esc(x.code)).join(', ')}). Delete or move ${linked.length>1?'them':'it'} first, or set the mould to Retired.</div>`; return; }
    const n = s ? s.total : 0, mc = s ? s.maintCount : 0;
    const what = isMandrel(t) ? `its usage on ${n} part${n===1?'':'s'} (the mould records stay)` : `its ${n} production record${n===1?'':'s'}`;
    confirmBox('Delete tool', `Delete <strong>${esc(t.code)} — ${esc(t.name)}</strong>${n || mc ? `, ${what} and ${mc} maintenance record${mc===1?'':'s'}` : ''}? This can't be undone.${n ? '<br><br>To keep the history, set the tool to Retired instead.' : ''}`, 'Delete tool', async () => {
      const ok = await Store.mutate(d => {
        d.parts = d.parts.filter(x => x.toolId !== t.id);
        d.parts.forEach(x => { if (Array.isArray(x.mandrelIds)) x.mandrelIds = x.mandrelIds.filter(id => id !== t.id); });
        d.maint = d.maint.filter(x => x.toolId !== t.id);
        d.tools = d.tools.filter(x => x.id !== t.id);
      }, `Delete tool ${t.code}`);
      if (ok) { toast(`Tool ${t.code} deleted.`); nav('project', { projectId }); }
    });
  };
}

    <div class="modal-actions"><button class="btn btn-outline" data-c>Cancel</button><button class="btn btn-primary" data-ok>${isNew ? 'Create user' : 'Save changes'}</button></div>`);
  m.querySelector('[data-c]').onclick = closeModal;
  m.querySelector('[data-ok]').onclick = async () => {
    const g = s => m.querySelector(s).value.trim();
    const name = g('#uf-name'), login = lockedAdmin ? 'admin' : g('#uf-login'), pass = m.querySelector('#uf-pass').value;
    const err = h => m.querySelector('#uf-err').innerHTML = `<div class="alert alert-error">${h}</div>`;
    if (!name || !login) return err('Enter a name and login.');
    if (!/^[A-Za-z0-9._-]+$/.test(login)) return err('Use letters, numbers, dots, dashes or underscores in the login.');
    if (isNew && pass.length < 6) return err('The password needs at least 6 characters.');
    if (!isNew && pass && pass.length < 6) return err('The new password needs at least 6 characters.');
    if (usersList().some(x => x.id !== u.id && x.login.toLowerCase() === login.toLowerCase())) return err('That login is already in use.');
    const facilities = [...m.querySelectorAll('.uf-fac:checked')].map(x => x.value);
    const role = lockedAdmin ? 'admin' : g('#uf-role');
    if (role !== 'admin' && !facilities.length) return err('Tick at least one facility for this user.');
    if (!(await ensureUsersSaved())) return;
    const base = isNew ? {} : (usersList().find(x => x.id === u.id) || u);
    const rec = Object.assign({}, base, { id: u.id || ('u' + uid()), name, login, role, facilities: role === 'admin' ? FACILITIES.slice() : facilities, pass: pass || base.pass, createdAt: base.createdAt || nowISO() });
    if (await Store.put('users', rec, `User ${login}`)) { closeModal(); toast(isNew ? `User ${name} created.` : `User ${name} updated.`); }
  };
}

// ICONS
// ============================================================

  const p = {
    grid:'<rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
    folder:'<path d="M1.5 4a1 1 0 011-1h3.5l1.5 1.5h6a1 1 0 011 1V12a1 1 0 01-1 1h-11a1 1 0 01-1-1V4z"/>',
    alert:'<path d="M8 1.8l6.5 11.4H1.5L8 1.8z"/><path d="M8 6.5v3M8 11.3v.2"/>',
    chart:'<path d="M2 12l4-4 3 3 5-7"/><path d="M2 14h12"/>',
    users:'<circle cx="8" cy="5" r="3"/><path d="M2 14a6 6 0 0112 0"/>',
    key:'<circle cx="5" cy="10" r="3"/><path d="M7.2 7.8L14 1M11 4l2 2M12.5 2.5l1.5 1.5"/>',
    logout:'<path d="M6 3H3a1 1 0 00-1 1v8a1 1 0 001 1h3M11 10l3-2-3-2M14 8H7"/>',
    plus:'<path d="M8 3v10M3 8h10"/>',
    edit:'<path d="M11 2l3 3-8 8H3v-3l8-8z"/>',
    trash:'<path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/>',
    wrench:'<path d="M10.5 1.5a3.5 3.5 0 00-3.3 4.6L1.8 11.5a1.4 1.4 0 002 2l5.4-5.4a3.5 3.5 0 004.6-3.3l-2 1.2-1.6-.6-.6-1.6 1.2-2.3z"/>',
    part:'<path d="M8 1.5l5.5 3.2v6.6L8 14.5l-5.5-3.2V4.7L8 1.5z"/><path d="M2.5 4.7L8 8l5.5-3.3M8 8v6.5"/>',
    download:'<path d="M2 10v3a1 1 0 001 1h10a1 1 0 001-1v-3M8 2v8M5 7l3 3 3-3"/>',
    menu:'<path d="M2 4h12M2 8h12M2 12h12"/>',
    cloud:'<path d="M4.5 12.5h7a3 3 0 00.4-6 4 4 0 00-7.7 1A2.5 2.5 0 004.5 12.5z"/>',
  };
  return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||''}</svg>`;
}

// ============================================================
// INIT
// ============================================================
render();
Store.init();
</script>
